<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokale Änderungsraten per Hand – ein Gespräch mit Sokrates</title>
<script>try{if(localStorage.getItem('sokratesThema')==='hell')document.documentElement.dataset.thema='hell'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/katex/katex.min.css">
<script defer src="/katex/katex.min.js"></script>

<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<link rel="stylesheet" href="/sokrates/engine.css?v=202611112123">
</head>
<body>
<div class="seite">
  <header>
    <div class="kopf-links"><a class="heim" id="heim" hidden></a><h1 id="titel"></h1></div>
    <div class="kopf-rechts"><span class="fortschritt" id="fortschritt"></span><button class="klein" id="thema">☀ Hell</button></div>
  </header>
  <main>
    <section class="dialog" id="dialog"></section>
    <section class="zeichnung"><div id="ggb"></div></section>
  </main>
</div>
<script>
const DIALOG = {
  titel: "Lokale Änderungsraten per Hand – ein Gespräch mit Sokrates",
  heim: {text:"◂ 11a", href:"/11a/"},
  lehrer: "Sokrates",
  schueler: "{name}",

  aufgabe: "Aufgabe 2: Bestimmen Sie die lokale Änderungsrate an der Stelle $a$ ohne die Funktionstasten des GTR durch Annähern mit $h = 0{,}1$ und $h = 0{,}005$.\n\na) $f(x) = x^2 - 2;\\ a = 1$\nb) $f(x) = (x-2)^2;\\ a = -1$\nc) $f(x) = \\frac{1}{2}x^3;\\ a = 3$",
  vorwissen: [
    "Differenzenquotient $\\dfrac{f(a+h) - f(a)}{h}$",
    "Binomische Formeln, Ausmultiplizieren",
    "Sekante und Tangente"
  ],
  hefteintrag: "Aufgabe 2 – Lokale Änderungsraten per Hand\nDifferenzenquotient $d(h) = \\dfrac{f(a+h) - f(a)}{h}$\n\na) $f(x) = x^2 - 2$, $a = 1$, $f(1) = -1$\n$d(0{,}1) = 2{,}1$ · $d(0{,}005) = 2{,}005$\nAllgemein: $d(h) = \\dfrac{(1+h)^2 - 2 + 1}{h} = \\dfrac{2h + h^2}{h} = 2 + h \\to 2$\nLokale Änderungsrate: $2$\n\nb) $f(x) = (x-2)^2$, $a = -1$, $f(-1) = 9$\n$d(0{,}1) = -5{,}9$ · $d(0{,}005) = -5{,}995$\nAllgemein: $d(h) = \\dfrac{(h-3)^2 - 9}{h} = -6 + h \\to -6$\nLokale Änderungsrate: $-6$\n\nc) $f(x) = \\frac{1}{2}x^3$, $a = 3$, $f(3) = 13{,}5$\n$d(0{,}1) = 13{,}955$ · $d(0{,}005) \\approx 13{,}5225$\nAllgemein: $d(h) = 13{,}5 + 4{,}5h + 0{,}5h^2 \\to 13{,}5$\nLokale Änderungsrate: $13{,}5$",
  merkzettel: [{"begriff": "Mittlere Änderungsrate (Differenzenquotient)", "text": "$\\dfrac{f(x_2) - f(x_1)}{x_2 - x_1} = \\dfrac{\\Delta y}{\\Delta x}$ – „Differenz durch Differenz“. Sie gehört zu einem Intervall $[x_1;\\,x_2]$."}, {"begriff": "Sekante", "text": "Gerade durch zwei Punkte des Graphen. Ihre Steigung ist die mittlere Änderungsrate."}, {"begriff": "Steigung einer Geraden", "text": "$m = \\dfrac{\\Delta y}{\\Delta x}$ – so viel steigt die Gerade, wenn man um $1$ nach rechts geht."}, {"begriff": "Schreibweise mit h", "text": "Statt $x_1 = a$ und $x_2 = a + h$ schreibt man $\\dfrac{f(a+h) - f(a)}{h}$. Dabei ist $h$ die Breite des Intervalls."}, {"begriff": "Der Limes", "text": "$\\displaystyle\\lim_{h \\to 0}$ liest man „Limes für $h$ gegen $0$“ (lat. limes = Grenze). Gemeint ist der Wert, dem sich der Term nähert, wenn $h$ immer näher an $0$ rückt – ohne dass $h$ jemals $0$ wird."}, {"begriff": "Lokale Änderungsrate", "text": "$\\displaystyle\\lim_{h \\to 0} \\frac{f(a+h) - f(a)}{h}$. Sie gehört zu einer Stelle $a$, nicht zu einem Intervall."}, {"begriff": "Tangente", "text": "Gerade, die den Graphen im Punkt $P$ berührt und dort dieselbe Steigung hat. Ihre Steigung ist die lokale Änderungsrate."}, {"begriff": "Binomische Formeln", "text": "$(a+b)^2 = a^2 + 2ab + b^2$, $(a-b)^2 = a^2 - 2ab + b^2$"}],

  geogebra: {
    sicht: [-1.2, 3.2, -3.2, 5.2, 1, 1],
    frei: true,
    fokus: "P",
    achsen: {x:"x", y:"y"},
    befehle: [
      "teil=1", "hh=0.5",
      "fa(x)=If(teil==1,x^2-2,If(teil==2,(x-2)^2,0.5x^3))",
      "aa=If(teil==1,1,If(teil==2,-1,3))",
      "bahn(x)=If(aa+0.004<=x<=aa+1.6,fa(x))",
      "P=(aa,fa(aa))", "Qe=(aa+hh,fa(aa+hh))", "Z=Point(bahn)",
      "fA=fa(aa)", "fB=fa(aa+hh)", "dy=fB-fA", "ah=aa+hh",
      "sek=Line(P,Qe)",
      "dq=(fa(aa+hh)-fa(aa))/hh",
      "Ecke=(aa+hh,fa(aa))",
      "stH=Segment(P,Ecke)", "stY=Segment(Ecke,Qe)",
      "Xa=(aa,0)", "Xb=(aa+hh,0)",
      "lotA=Segment(Xa,P)", "lotB=Segment(Xb,Qe)",
      "mtan=If(teil==1,2,If(teil==2,-6,13.5))",
      "tang=Line(P,P+(1,mtan))"
    ],
    koppeln: [{punkt:"Z", ziel:"hh", aus:"x(Z)-aa", min:0.005, max:1.5, runden:3, px:"aa+hh", py:"fa(aa+hh)"}],
    ziehbar: ["Z"],
    sichtbar: ["fa","P","Z","sek","stH","stY","Xa","Xb","lotA","lotB"],
    stil: {
      fa:{farbe:"gold", dicke:5},
      P:{farbe:"leucht", punkt:7, name:"P"},
      Z:{farbe:"hellgold", punkt:7, name:"Q"},
      sek:{farbe:"kupfer", dicke:3},
      stH:{farbe:"wasser", dicke:4, name:"h"},
      stY:{farbe:"gruen", dicke:4, name:"Δy"},
      Xa:{farbe:"matt", punkt:4, name:"a"},
      Xb:{farbe:"matt", punkt:4, name:"a+h"},
      lotA:{farbe:"matt", dicke:2, strich:"gestrichelt"},
      lotB:{farbe:"matt", dicke:2, strich:"gestrichelt"},
      tang:{farbe:"leucht", dicke:4}
    }
  },

  regler: [
    {text:"$h$", objekt:"hh", min:0.005, max:1.5, schritt:0.005, ab:"anfang"}
  ],
  werte: [
    {text:"$a$", objekt:"aa", ab:"anfang", stellen:0},
    {text:"$h$", objekt:"hh", ab:"anfang", stellen:3},
    {text:"$a + h$", objekt:"ah", ab:"anfang", stellen:3},
    {text:"$f(a)$", objekt:"fA", ab:"anfang", nurGeloest:true, stellen:6},
    {text:"$f(a+h)$", objekt:"fB", ab:"anfang", nurGeloest:true, stellen:6},
    {text:"$\\Delta y = f(a+h) - f(a)$", objekt:"dy", ab:"anfang", nurGeloest:true, stellen:6},
    {text:"Differenzenquotient $\\frac{\\Delta y}{h}$ = Steigung der Sekante", objekt:"dq", ab:"anfang", nurGeloest:true, stellen:4}
  ],

  schritte: [
    { id:"anfang", typ:"rede",
      text:"Sei gegrüßt, {name}. Heute rechnen wir von Hand: ohne die Ableitungstaste des Rechners. Wir nähern die lokale Änderungsrate an, indem wir den Differenzenquotienten $$\\frac{f(a+h) - f(a)}{h}$$ für kleine $h$ berechnen. Er ist die Steigung der [[Sekante|sek]] durch [[$P$|P]] und [[$Q$|Z]]: [[Höhenunterschied $\\Delta y$|stY]] geteilt durch [[$h$|stH]].\n\nDu kannst $Q$ mit dem Finger auf dem Graphen verschieben oder $h$ mit dem Regler einstellen.\n\nBeginnen wir mit a): $f(x) = x^2 - 2$ an der Stelle $a = 1$.",
      beimStart:["SetValue(teil,1)","SetValue(hh,0.5)"] },

    { id:"a1", tipps:["Setze in $f(x) = x^2 - 2$ ein: $f(1) = 1^2 - 2$ und $f(1{,}1) = 1{,}1^2 - 2$.", "$f(1) = -1$ und $f(1{,}1) = -0{,}79$. Bilde $\\Delta y = f(1{,}1) - f(1)$.", "$\\dfrac{\\Delta y}{h} = \\dfrac{-0{,}79 - (-1)}{0{,}1} = \\dfrac{0{,}21}{0{,}1}$"], typ:"zahl",
      text:"Berechne zuerst $f(1)$ und $f(1{,}1)$ und daraus den Differenzenquotienten für $h = 0{,}1$.",
      sicht:[0.45, 1.75, -1.7, 0.6, 0.1, 0.2],
      loesung:2.1, toleranz:0.001,
      falsch:"$f(1) = 1 - 2 = -1$ und $f(1{,}1) = 1{,}21 - 2 = -0{,}79$. Teile die Differenz durch $0{,}1$.",
      richtig:"Richtig: $\\dfrac{-0{,}79 - (-1)}{0{,}1} = \\dfrac{0{,}21}{0{,}1} = 2{,}1$.",
      beimStart:["SetValue(hh,0.1)"] },

    { id:"a2", tipps:["$a + h = 1{,}005$. Berechne $f(1{,}005) = 1{,}005^2 - 2$.", "$\\Delta y = f(1{,}005) - f(1) = -0{,}989975 - (-1) = 0{,}010025$", "Teile $0{,}010025$ durch $0{,}005$."], typ:"zahl",
      sicht:[-1.2, 3.2, -3.2, 5.2, 1, 1],
      text:"Nun für $h = 0{,}005$.",
      loesung:2.005, toleranz:0.0005,
      falsch:"$f(1{,}005) = 1{,}005^2 - 2 = 1{,}010025 - 2 = -0{,}989975$. Ziehe $f(1) = -1$ ab und teile durch $0{,}005$.",
      richtig:"Gut: $\\dfrac{0{,}010025}{0{,}005} = 2{,}005$.",
      beimStart:["SetValue(hh,0.005)"] },

    { id:"spiel", typ:"probieren",
      text:"Verändere $h$: Ziehe [[$Q$|Z]] auf dem Graphen oder nutze den Regler. Achte auf den Differenzenquotienten und auf die [[Sekante|sek]]. Fällt dir an den Zahlen etwas auf?",
      hinweis:"Ziehe den Regler und vergleiche $h$ mit dem Differenzenquotienten." },

    { id:"a_term", tipps:["Setze ein: $f(1+h) = (1+h)^2 - 2$ und $f(1) = -1$.", "$(1+h)^2 = 1 + 2h + h^2$. Der Zähler wird $1 + 2h + h^2 - 2 + 1 = 2h + h^2$.", "Kürze: $\\dfrac{2h + h^2}{h} = \\dfrac{h\\,(2 + h)}{h}$"], typ:"wahl",
      text:"Bei $h = 0{,}1$ kam $2{,}1$ heraus, bei $h = 0{,}005$ kam $2{,}005$ heraus. Das ist kein Zufall. Vereinfache allgemein: $$\\frac{f(1+h) - f(1)}{h} = \\frac{(1+h)^2 - 2 + 1}{h} = \\;?$$",
      optionen:[
        {text:"$2 + h$", richtig:true},
        {text:"$2h + h^2$", hinweis:"Das ist der Zähler. Teile ihn noch durch $h$."},
        {text:"$1 + h$"}
      ],
      falsch:"$(1+h)^2 = 1 + 2h + h^2$. Was bleibt im Zähler übrig, und was ergibt sich nach dem Kürzen durch $h$?",
      richtig:"Genau: $\\dfrac{2h + h^2}{h} = 2 + h$. Wird $h$ beliebig klein, so nähert sich das der $2$." },

    { id:"a_lim", tipps:["Was bleibt von $2 + h$, wenn $h$ gegen $0$ geht?"], typ:"zahl",
      text:"Wie groß ist also die lokale Änderungsrate in a)?",
      loesung:2, toleranz:0.0001,
      falsch:"Was wird aus $2 + h$, wenn $h$ gegen $0$ geht?",
      richtig:"Richtig: $2$. Das ist die Steigung der [[Tangente|tang]] in $P(1\\,|\\,-1)$.",
      zeigeNachRichtig:["tang"] },

    { id:"b1", tipps:["$f(-1) = (-1-2)^2 = 9$. Und $a + h = -0{,}9$.", "$f(-0{,}9) = (-0{,}9 - 2)^2 = (-2{,}9)^2 = 8{,}41$", "$\\dfrac{8{,}41 - 9}{0{,}1} = \\dfrac{-0{,}59}{0{,}1}$"], typ:"zahl",
      text:"Nun b): $f(x) = (x-2)^2$ an der Stelle $a = -1$. Berechne den Differenzenquotienten für $h = 0{,}1$.",
      sicht:[-1.7, -0.25, -0.8, 10.6, 0.1, 1],
      loesung:-5.9, toleranz:0.001,
      falsch:"$f(-1) = (-3)^2 = 9$ und $f(-0{,}9) = (-2{,}9)^2 = 8{,}41$. Achte auf das Vorzeichen.",
      richtig:"Richtig: $\\dfrac{8{,}41 - 9}{0{,}1} = -5{,}9$. Der Graph fällt hier, darum ist die Rate negativ.",
      beimStart:["SetValue(teil,2)","SetValue(hh,0.1)"], verberge:["tang"] },

    { id:"b2", tipps:["$a + h = -0{,}995$, also $f(-0{,}995) = (-2{,}995)^2$.", "$(-2{,}995)^2 = 8{,}970025$, also $\\Delta y = -0{,}029975$.", "Teile $-0{,}029975$ durch $0{,}005$."], typ:"zahl",
      sicht:[-3.2, 3.2, -1.5, 17, 1, 2],
      text:"Und für $h = 0{,}005$?",
      loesung:-5.995, toleranz:0.0005,
      falsch:"$f(-0{,}995) = (-2{,}995)^2 = 8{,}970025$. Ziehe $9$ ab und teile durch $0{,}005$.",
      richtig:"Gut: $-5{,}995$.",
      beimStart:["SetValue(hh,0.005)"] },

    { id:"b_lim", tipps:["$f(-1+h) = (-1 + h - 2)^2 = (h - 3)^2 = h^2 - 6h + 9$", "Der Zähler ist $h^2 - 6h + 9 - 9 = h^2 - 6h$. Teile durch $h$."], typ:"wahl",
      text:"Ohne langes Rechnen: Welche lokale Änderungsrate vermutest du in b)? Prüfe mit der Vereinfachung $\\dfrac{(h-3)^2 - 9}{h}$.",
      optionen:[
        {text:"$-6$, denn der Quotient ist $-6 + h$", richtig:true},
        {text:"$-5{,}995$", hinweis:"Das ist nur der Wert für $h = 0{,}005$. Wird $h$ noch kleiner, so ändert er sich weiter. Wohin?"},
        {text:"$6$, denn $(-3)^2$ ist positiv"}
      ],
      falsch:"$(h-3)^2 - 9 = h^2 - 6h$. Teile durch $h$.",
      richtig:"Recht so: $\\dfrac{h^2 - 6h}{h} = h - 6 \\to -6$. Die [[Tangente|tang]] fällt mit der Steigung $-6$.",
      zeigeNachRichtig:["tang"] },

    { id:"c1", tipps:["$f(3) = \\frac{1}{2} \\cdot 3^3 = 13{,}5$ und $f(3{,}1) = \\frac{1}{2} \\cdot 3{,}1^3$.", "$3{,}1^3 = 29{,}791$, die Hälfte ist $14{,}8955$.", "$\\dfrac{14{,}8955 - 13{,}5}{0{,}1}$"], typ:"zahl",
      text:"Zuletzt c): $f(x) = \\frac{1}{2}x^3$ an der Stelle $a = 3$. Den Differenzenquotienten für $h = 0{,}1$, bitte.",
      sicht:[2.35, 3.45, -1.2, 17.5, 0.1, 2],
      loesung:13.955, toleranz:0.001,
      falsch:"$f(3) = \\frac{1}{2} \\cdot 27 = 13{,}5$ und $f(3{,}1) = \\frac{1}{2} \\cdot 3{,}1^3 = 14{,}8955$.",
      richtig:"Richtig: $\\dfrac{14{,}8955 - 13{,}5}{0{,}1} = 13{,}955$.",
      beimStart:["SetValue(teil,3)","SetValue(hh,0.1)"], verberge:["tang"] },

    { id:"c2", tipps:["Berechne $f(3{,}005) = 0{,}5 \\cdot 3{,}005^3$ mit dem Rechner.", "$f(3{,}005) \\approx 13{,}5676126$, also $\\Delta y \\approx 0{,}0676126$.", "Teile durch $0{,}005$ und runde auf vier Stellen."], typ:"zahl",
      sicht:[-0.4, 4.6, -4, 46, 1, 5],
      text:"Und für $h = 0{,}005$? Runde auf vier Nachkommastellen.",
      loesung:13.5225, toleranz:0.0002,
      falsch:"$3{,}005^3 = 27{,}135225125$, die Hälfte davon ist $13{,}5676125625$. Ziehe $13{,}5$ ab und teile durch $0{,}005$.",
      richtig:"Gut: etwa $13{,}5225$.",
      beimStart:["SetValue(hh,0.005)"] },

    { id:"c_lim", tipps:["Lass $h$ in $13{,}5 + 4{,}5h + 0{,}5h^2$ gegen $0$ gehen. Was bleibt?"], typ:"wahl",
      text:"Welche lokale Änderungsrate ergibt sich in c)? Ausmultipliziert ist der Quotient $13{,}5 + 4{,}5h + 0{,}5h^2$.",
      optionen:[
        {text:"$13{,}5$", richtig:true},
        {text:"$13{,}52$", hinweis:"Das ist der gerundete Wert für $h = 0{,}005$. Was bleibt von $4{,}5h + 0{,}5h^2$ übrig, wenn $h$ gegen $0$ geht?"},
        {text:"$18$"}
      ],
      falsch:"Lass $h$ in jedem Summanden gegen $0$ gehen.",
      richtig:"Vortrefflich: $13{,}5$. Bemerkst du es? Hier ist die lokale Änderungsrate zufällig genauso groß wie der Funktionswert $f(3)$. Sieh dir die [[Tangente|tang]] an.",
      zeigeNachRichtig:["tang"] },

    { id:"schluss", typ:"rede",
      text:"So halten wir fest, {name}: Der Differenzenquotient für kleine $h$ liefert gute Näherungen. Doch wer ihn allgemein vereinfacht, sieht den Grenzwert genau: a) $2$, b) $-6$, c) $13{,}5$. Schreibe dir den Hefteintrag ab." }
  ]
};

</script>

</body>
</html>
