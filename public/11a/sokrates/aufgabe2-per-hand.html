<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokale Änderungsraten per Hand – ein Gespräch mit Sokrates</title>
<script>try{if(localStorage.getItem('sokratesThema')==='hell')document.documentElement.dataset.thema='hell'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/katex/katex.min.css">
<script defer src="/katex/katex.min.js"></script>
<script defer src="/katex/auto-render.min.js"></script>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<link rel="stylesheet" href="/sokrates/engine.css?v=202611112105">
</head>
<body>
<div class="seite">
  <header>
    <div class="kopf-links"><a class="heim" id="heim" hidden></a><h1 id="titel"></h1></div>
    <div class="kopf-rechts"><span class="fortschritt" id="fortschritt"></span><button class="klein" id="thema">☀ Hell</button></div>
  </header>
  <main>
    <section class="dialog" id="dialog"></section>
    <section class="zeichnung"><div id="ggb"></div></section>
  </main>
</div>
<script>
const DIALOG = {
  titel: "Lokale Änderungsraten per Hand – ein Gespräch mit Sokrates",
  heim: {text:"◂ 11a", href:"/11a/"},
  lehrer: "Sokrates",
  schueler: "{name}",

  aufgabe: "Aufgabe 2: Bestimmen Sie die lokale Änderungsrate an der Stelle $a$ ohne die Funktionstasten des GTR durch Annähern mit $h = 0{,}1$ und $h = 0{,}005$.\n\na) $f(x) = x^2 - 2;\\ a = 1$\nb) $f(x) = (x-2)^2;\\ a = -1$\nc) $f(x) = \\frac{1}{2}x^3;\\ a = 3$",
  vorwissen: [
    "Differenzenquotient $\\dfrac{f(a+h) - f(a)}{h}$",
    "Binomische Formeln, Ausmultiplizieren",
    "Sekante und Tangente"
  ],
  hefteintrag: "Aufgabe 2 – Lokale Änderungsraten per Hand\nDifferenzenquotient $d(h) = \\dfrac{f(a+h) - f(a)}{h}$\n\na) $f(x) = x^2 - 2$, $a = 1$, $f(1) = -1$\n$d(0{,}1) = 2{,}1$ · $d(0{,}005) = 2{,}005$\nAllgemein: $d(h) = \\dfrac{(1+h)^2 - 2 + 1}{h} = \\dfrac{2h + h^2}{h} = 2 + h \\to 2$\nLokale Änderungsrate: $2$\n\nb) $f(x) = (x-2)^2$, $a = -1$, $f(-1) = 9$\n$d(0{,}1) = -5{,}9$ · $d(0{,}005) = -5{,}995$\nAllgemein: $d(h) = \\dfrac{(h-3)^2 - 9}{h} = -6 + h \\to -6$\nLokale Änderungsrate: $-6$\n\nc) $f(x) = \\frac{1}{2}x^3$, $a = 3$, $f(3) = 13{,}5$\n$d(0{,}1) = 13{,}955$ · $d(0{,}005) \\approx 13{,}5225$\nAllgemein: $d(h) = 13{,}5 + 4{,}5h + 0{,}5h^2 \\to 13{,}5$\nLokale Änderungsrate: $13{,}5$",

  geogebra: {
    sicht: [-1.2, 3.2, -3.2, 5.2, 1, 1],
    frei: true,
    achsen: {x:"x", y:"y"},
    befehle: [
      "teil=1",
      "fa(x)=If(teil==1,x^2-2,If(teil==2,(x-2)^2,0.5x^3))",
      "aa=If(teil==1,1,If(teil==2,-1,3))",
      "bahn(x)=If(aa+0.004<=x<=aa+1.5,fa(x))",
      "P=(aa,fa(aa))", "Q=Point(bahn)", "hh=x(Q)-aa",
      "sek=Line(P,Q)",
      "dq=(fa(aa+hh)-fa(aa))/hh",
      "mtan=If(teil==1,2,If(teil==2,-6,13.5))",
      "tang=Line(P,P+(1,mtan))"
    ],
    startwerte: { Q: [1.5, 0.25] },
    ziehbar: ["Q"],
    sichtbar: ["fa","P","Q","sek"],
    stil: {
      fa:{farbe:"gold", dicke:5},
      P:{farbe:"leucht", punkt:7, name:"P"},
      Q:{farbe:"hellgold", punkt:6, name:"Q"},
      sek:{farbe:"kupfer", dicke:3},
      tang:{farbe:"leucht", dicke:4}
    }
  },

  regler: [
    {text:"$h$", objekt:"hh", min:0.005, max:1.5, schritt:0.005, ab:"spiel", setze:"SetCoords(Q,aa+#,fa(aa+#))"}
  ],
  werte: [
    {text:"$h$", objekt:"hh", ab:"a1", stellen:3},
    {text:"Differenzenquotient", objekt:"dq", nurGeloest:true, ab:"a1", wann:"richtig", stellen:4}
  ],

  schritte: [
    { id:"anfang", typ:"rede",
      text:"Sei gegrüßt, {name}. Heute rechnen wir von Hand: ohne die Ableitungstaste des Rechners. Wir nähern die lokale Änderungsrate an, indem wir den Differenzenquotienten $$\\frac{f(a+h) - f(a)}{h}$$ für kleine $h$ berechnen. Er ist die Steigung der [[Sekante|sek]] durch [[$P$|P]] und [[$Q$|Q]].\n\nBeginnen wir mit a): $f(x) = x^2 - 2$ an der Stelle $a = 1$.",
      beimStart:["SetValue(teil,1)","SetCoords(Q,aa+0.5,fa(aa+0.5))"] },

    { id:"a1", typ:"zahl",
      text:"Berechne zuerst $f(1)$ und $f(1{,}1)$ und daraus den Differenzenquotienten für $h = 0{,}1$.",
      loesung:2.1, toleranz:0.001,
      falsch:"$f(1) = 1 - 2 = -1$ und $f(1{,}1) = 1{,}21 - 2 = -0{,}79$. Teile die Differenz durch $0{,}1$.",
      richtig:"Richtig: $\\dfrac{-0{,}79 - (-1)}{0{,}1} = \\dfrac{0{,}21}{0{,}1} = 2{,}1$.",
      beimStart:["SetCoords(Q,aa+0.1,fa(aa+0.1))"] },

    { id:"a2", typ:"zahl",
      text:"Nun für $h = 0{,}005$.",
      loesung:2.005, toleranz:0.0005,
      falsch:"$f(1{,}005) = 1{,}005^2 - 2 = 1{,}010025 - 2 = -0{,}989975$. Ziehe $f(1) = -1$ ab und teile durch $0{,}005$.",
      richtig:"Gut: $\\dfrac{0{,}010025}{0{,}005} = 2{,}005$.",
      beimStart:["SetCoords(Q,aa+0.005,fa(aa+0.005))"] },

    { id:"spiel", typ:"probieren",
      text:"Verändere $h$: Ziehe [[$Q$|Q]] auf dem Graphen oder nutze den Regler. Achte auf den Differenzenquotienten und auf die [[Sekante|sek]]. Fällt dir an den Zahlen etwas auf?",
      hinweis:"Ziehe den Regler und vergleiche $h$ mit dem Differenzenquotienten." },

    { id:"a_term", typ:"wahl",
      text:"Bei $h = 0{,}1$ kam $2{,}1$ heraus, bei $h = 0{,}005$ kam $2{,}005$ heraus. Das ist kein Zufall. Vereinfache allgemein: $$\\frac{f(1+h) - f(1)}{h} = \\frac{(1+h)^2 - 2 + 1}{h} = \\;?$$",
      optionen:[
        {text:"$2 + h$", richtig:true},
        {text:"$2h + h^2$", hinweis:"Das ist der Zähler. Teile ihn noch durch $h$."},
        {text:"$1 + h$"}
      ],
      falsch:"$(1+h)^2 = 1 + 2h + h^2$. Was bleibt im Zähler übrig, und was ergibt sich nach dem Kürzen durch $h$?",
      richtig:"Genau: $\\dfrac{2h + h^2}{h} = 2 + h$. Wird $h$ beliebig klein, so nähert sich das der $2$." },

    { id:"a_lim", typ:"zahl",
      text:"Wie groß ist also die lokale Änderungsrate in a)?",
      loesung:2, toleranz:0.0001,
      falsch:"Was wird aus $2 + h$, wenn $h$ gegen $0$ geht?",
      richtig:"Richtig: $2$. Das ist die Steigung der [[Tangente|tang]] in $P(1\\,|\\,-1)$.",
      zeigeNachRichtig:["tang"] },

    { id:"b1", typ:"zahl",
      text:"Nun b): $f(x) = (x-2)^2$ an der Stelle $a = -1$. Berechne den Differenzenquotienten für $h = 0{,}1$.",
      sicht:[-3.2, 3.2, -1.5, 17, 1, 2],
      loesung:-5.9, toleranz:0.001,
      falsch:"$f(-1) = (-3)^2 = 9$ und $f(-0{,}9) = (-2{,}9)^2 = 8{,}41$. Achte auf das Vorzeichen.",
      richtig:"Richtig: $\\dfrac{8{,}41 - 9}{0{,}1} = -5{,}9$. Der Graph fällt hier, darum ist die Rate negativ.",
      beimStart:["SetValue(teil,2)","SetCoords(Q,aa+0.1,fa(aa+0.1))"], verberge:["tang"] },

    { id:"b2", typ:"zahl",
      text:"Und für $h = 0{,}005$?",
      loesung:-5.995, toleranz:0.0005,
      falsch:"$f(-0{,}995) = (-2{,}995)^2 = 8{,}970025$. Ziehe $9$ ab und teile durch $0{,}005$.",
      richtig:"Gut: $-5{,}995$.",
      beimStart:["SetCoords(Q,aa+0.005,fa(aa+0.005))"] },

    { id:"b_lim", typ:"wahl",
      text:"Ohne langes Rechnen: Welche lokale Änderungsrate vermutest du in b)? Prüfe mit der Vereinfachung $\\dfrac{(h-3)^2 - 9}{h}$.",
      optionen:[
        {text:"$-6$, denn der Quotient ist $-6 + h$", richtig:true},
        {text:"$-5{,}995$", hinweis:"Das ist nur der Wert für $h = 0{,}005$. Wird $h$ noch kleiner, so ändert er sich weiter. Wohin?"},
        {text:"$6$, denn $(-3)^2$ ist positiv"}
      ],
      falsch:"$(h-3)^2 - 9 = h^2 - 6h$. Teile durch $h$.",
      richtig:"Recht so: $\\dfrac{h^2 - 6h}{h} = h - 6 \\to -6$. Die [[Tangente|tang]] fällt mit der Steigung $-6$.",
      zeigeNachRichtig:["tang"] },

    { id:"c1", typ:"zahl",
      text:"Zuletzt c): $f(x) = \\frac{1}{2}x^3$ an der Stelle $a = 3$. Den Differenzenquotienten für $h = 0{,}1$, bitte.",
      sicht:[-0.4, 4.6, -4, 46, 1, 5],
      loesung:13.955, toleranz:0.001,
      falsch:"$f(3) = \\frac{1}{2} \\cdot 27 = 13{,}5$ und $f(3{,}1) = \\frac{1}{2} \\cdot 3{,}1^3 = 14{,}8955$.",
      richtig:"Richtig: $\\dfrac{14{,}8955 - 13{,}5}{0{,}1} = 13{,}955$.",
      beimStart:["SetValue(teil,3)","SetCoords(Q,aa+0.1,fa(aa+0.1))"], verberge:["tang"] },

    { id:"c2", typ:"zahl",
      text:"Und für $h = 0{,}005$? Runde auf vier Nachkommastellen.",
      loesung:13.5225, toleranz:0.0002,
      falsch:"$3{,}005^3 = 27{,}135225125$, die Hälfte davon ist $13{,}5676125625$. Ziehe $13{,}5$ ab und teile durch $0{,}005$.",
      richtig:"Gut: etwa $13{,}5225$.",
      beimStart:["SetCoords(Q,aa+0.005,fa(aa+0.005))"] },

    { id:"c_lim", typ:"wahl",
      text:"Welche lokale Änderungsrate ergibt sich in c)? Ausmultipliziert ist der Quotient $13{,}5 + 4{,}5h + 0{,}5h^2$.",
      optionen:[
        {text:"$13{,}5$", richtig:true},
        {text:"$13{,}52$", hinweis:"Das ist der gerundete Wert für $h = 0{,}005$. Was bleibt von $4{,}5h + 0{,}5h^2$ übrig, wenn $h$ gegen $0$ geht?"},
        {text:"$18$"}
      ],
      falsch:"Lass $h$ in jedem Summanden gegen $0$ gehen.",
      richtig:"Vortrefflich: $13{,}5$. Bemerkst du es? Hier ist die lokale Änderungsrate zufällig genauso groß wie der Funktionswert $f(3)$. Sieh dir die [[Tangente|tang]] an.",
      zeigeNachRichtig:["tang"] },

    { id:"schluss", typ:"rede",
      text:"So halten wir fest, {name}: Der Differenzenquotient für kleine $h$ liefert gute Näherungen. Doch wer ihn allgemein vereinfacht, sieht den Grenzwert genau: a) $2$, b) $-6$, c) $13{,}5$. Schreibe dir den Hefteintrag ab." }
  ]
};

</script>
<script src="/sokrates/engine.js?v=202611112105"></script>
</body>
</html>
