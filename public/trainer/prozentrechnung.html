<!DOCTYPE html>
<html lang="de" data-thema="hell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prozentrechnung Klasse 7 — Trainer für die Klassenarbeit</title>
<meta name="description" content="Übungsprogramm zur Prozentrechnung in Klasse 7: Diagnose, Erklärung, Üben und Re-Test mit immer neuen Aufgaben. Ohne Anmeldung — der Lernstand bleibt auf dem Gerät.">
<!--
  ===========================================================================
  Prozentrechnung Klasse 7 — Trainer für die Klassenarbeit
  ---------------------------------------------------------------------------
  Gebaut mit der Skill klassenarbeitstrainer (Vorlage aus dem Klausurtrainer
  11a und dem Klassenarbeitstrainer 7b, September 2026). Sechs Schritte je
  Thema:

      Diagnose  ->  Zuspruch  ->  Erklären  ->  Üben  ->  Re-Test  ->  Bestätigung

  INHALT: Prozentrechnung Klasse 7 in neun Themen — zwei Grundlagen (Bruch/Kommazahl/Prozent,
  Rechnen mit Kommazahlen) und sieben zur Prozentrechnung (Größen erkennen,
  Prozentwert, Prozentsatz, Grundwert, Zunahme und Abnahme, zurück zum alten
  Wert, zwei Änderungen nacheinander). Öffentliches Angebot, nicht an eine
  Lerngruppe und nicht an einen Termin gebunden.

  BUCHFREI, OHNE LERNGRUPPE: Keine Aufgabe, kein Kontext und kein Seiten-
  verweis aus einem Schulbuch, kein Bezug auf eine Klasse oder Schule.
  Geprüft vor jeder Veröffentlichung mit pruefe_trainer.mjs der Skill und
  der Musterliste scripts/trainer/prozentrechnung_muster.json.

  WARUM GENERIERTE AUFGABEN: Ein Re-Test muss dieselbe Sache mit anderen
  Zahlen prüfen. Aus einem festen Pool käme die gemerkte Aufgabe zurück.

  WARUM NICHTS ÜBERTRAGEN WIRD: Der Stand bleibt im Browser des Geräts
  (localStorage). Kein Server, keine Anmeldung, keine Auswertung.
  ===========================================================================
-->
<style>
/* --- Farben und Maße: dieselben Marken wie die Werkzeuge der Website ------ */
:root{
  --grund:#faf8f2; --flaeche:#ffffff; --flaeche-2:#f3efe6;
  --linie:#dcd5c5; --linie-stark:#bfb39c;
  --text:#2a241d; --text-leise:#564938; --text-schwach:#857355;
  --akzent:#2563eb; --akzent-hell:#dbeafe; --akzent-tief:#1e40af;
  --teal:#0d9488; --teal-hell:#ccfbf1;
  --violett:#7c3aed; --violett-hell:#ede9fe;
  --gold:#b45309; --gold-hell:#fef3c7;
  --gruen:#15803d; --gruen-hell:#dcfce7;
  --rot:#be123c; --rot-hell:#ffe4e6;
  --radius:12px; --radius-klein:8px;
  --schatten:0 1px 2px rgba(42,36,29,.06), 0 8px 24px -12px rgba(42,36,29,.18);
  --schrift:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --basis:17px;
}
html[data-thema="dunkel"]{
  --grund:#1a1623; --flaeche:#241f30; --flaeche-2:#2e2840;
  --linie:#423a56; --linie-stark:#5b5175;
  --text:#f3efe6; --text-leise:#cfc7bb; --text-schwach:#a79c8d;
  --akzent:#60a5fa; --akzent-hell:#1e3a8a; --akzent-tief:#93c5fd;
  --teal:#2dd4bf; --teal-hell:#134e4a;
  --violett:#a78bfa; --violett-hell:#3b2a6b;
  --gold:#fbbf24; --gold-hell:#4a3208;
  --gruen:#4ade80; --gruen-hell:#14361f;
  --rot:#fb7185; --rot-hell:#4c1327;
  --schatten:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{color-scheme:light; font-size:var(--basis); -webkit-text-size-adjust:100%}
html[data-thema="dunkel"]{color-scheme:dark}
body{
  margin:0; min-height:100vh; font-family:var(--schrift); color:var(--text);
  background:var(--grund); line-height:1.55;
}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.25; margin:0}
h1{font-size:1.5rem} h2{font-size:1.28rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
a{color:var(--akzent)}

/* --- Kopfleiste ---------------------------------------------------------- */
.kopf{
  position:sticky; top:0; z-index:30; background:var(--grund);
  border-bottom:1px solid var(--linie);
}
.kopf-innen{
  max-width:820px; margin:0 auto; padding:.6rem .9rem;
  display:flex; align-items:center; gap:.8rem;
}
.kopf-titel{font-family:var(--serif); font-weight:600; font-size:1rem; margin:0; flex:1; min-width:0}
.kopf-titel small{display:block; font-family:var(--schrift); font-weight:400;
  font-size:.76rem; color:var(--text-schwach)}
.streifen{height:4px; background:linear-gradient(90deg,var(--akzent),var(--teal),var(--violett))}

/* Fortschrittsring: neun Themen, ein Kreis. Sichtbar in jeder Ansicht, damit
   „wie weit bin ich?“ nie eine eigene Frage ist. */
.ring{flex:0 0 auto; width:2.7rem; height:2.7rem; position:relative}
.ring svg{display:block; transform:rotate(-90deg)}
.ring .zahl{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:.72rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-leise);
}
.iknopf{
  width:2.2rem; height:2.2rem; border:1px solid transparent; background:transparent;
  color:var(--text-leise); border-radius:var(--radius-klein); cursor:pointer;
  font-size:1rem; line-height:1; flex:0 0 auto;
}
.iknopf:hover{background:var(--flaeche-2); border-color:var(--linie)}

/* --- Grundbausteine ------------------------------------------------------ */
.huelle{max-width:820px; margin:0 auto; padding:1.1rem .9rem 5rem}
.karte{
  background:var(--flaeche); border:1px solid var(--linie); border-radius:var(--radius);
  padding:1.05rem 1.15rem; box-shadow:var(--schatten);
}
.karte + .karte{margin-top:.9rem}
.reihe{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center}
.reihe-ende{justify-content:flex-end}
.lead{color:var(--text-leise); font-size:1.02rem; max-width:62ch; margin:.35rem 0 1.1rem}
.leise{color:var(--text-schwach); font-size:.86rem}

.knopf{
  font:inherit; font-size:.95rem; font-weight:500; padding:.5rem .95rem;
  border-radius:var(--radius-klein); border:1px solid var(--linie-stark);
  background:var(--flaeche); color:var(--text); cursor:pointer;
  display:inline-flex; align-items:center; gap:.45rem; min-height:2.6rem;
}
.knopf:hover{background:var(--flaeche-2); border-color:var(--akzent)}
.knopf:active{transform:translateY(1px)}
.knopf:focus-visible{outline:3px solid var(--akzent); outline-offset:2px}
.knopf[disabled]{opacity:.45; cursor:not-allowed}
.knopf-haupt{background:var(--akzent); border-color:var(--akzent); color:#fff; font-weight:600}
html[data-thema="dunkel"] .knopf-haupt{color:#10131c}
.knopf-haupt:hover{background:var(--akzent-tief); border-color:var(--akzent-tief)}
html[data-thema="dunkel"] .knopf-haupt:hover{color:#10131c}
.knopf-still{border-color:transparent; background:transparent; color:var(--text-leise)}
.knopf-still:hover{background:var(--flaeche-2); border-color:var(--linie)}
.knopf-gross{font-size:1.08rem; padding:.7rem 1.3rem; min-height:3rem}

.pille{
  display:inline-flex; align-items:center; gap:.3rem; padding:.12rem .6rem;
  border-radius:999px; font-size:.76rem; font-weight:600;
  background:var(--akzent-hell); color:var(--akzent-tief);
}
html[data-thema="dunkel"] .pille{color:var(--text)}
.pille-gruen{background:var(--gruen-hell); color:var(--gruen)}
.pille-gold{background:var(--gold-hell); color:var(--gold)}
.pille-rot{background:var(--rot-hell); color:var(--rot)}
.pille-teal{background:var(--teal-hell); color:var(--teal)}

.hinweis{
  border-left:4px solid var(--akzent); background:var(--flaeche-2);
  padding:.7rem .9rem; border-radius:0 var(--radius-klein) var(--radius-klein) 0;
  font-size:.94rem; color:var(--text-leise); margin:.8rem 0;
}
.hinweis strong{color:var(--text)}
.hinweis-gold{border-left-color:var(--gold)}
.hinweis-gruen{border-left-color:var(--gruen)}
.hinweis-rot{border-left-color:var(--rot)}

/* --- Mathematischer Satz ------------------------------------------------- */
.m{font-family:var(--serif); font-size:1.06em; white-space:nowrap}
.mblock{
  font-family:var(--serif); font-size:1.28rem; text-align:center;
  margin:.9rem 0; padding:.55rem .4rem; overflow-x:auto;
}
.mblock.klein{font-size:1.08rem}
sup{font-size:.72em; vertical-align:.45em; line-height:0}
sub{font-size:.72em; vertical-align:-.25em; line-height:0}
.br{display:inline-block; vertical-align:-.55em; text-align:center; margin:0 .16em}
.br > span{display:block; padding:0 .22em}
.br > span:first-child{border-bottom:1.5px solid currentColor; padding-bottom:.05em}
.br > span:last-child{padding-top:.05em}
.wz{white-space:nowrap}
.wz > .dach{border-top:1.5px solid currentColor; padding:0 .12em 0 .06em; margin-left:-.06em}

/* --- Schrittfolge (das ausführliche Erklären) ---------------------------- */
.schritte{list-style:none; margin:.6rem 0 0; padding:0}
.schritt{
  display:grid; grid-template-columns:1.8rem 1fr; gap:.1rem .7rem;
  padding:.55rem 0; border-top:1px solid var(--linie);
}
.schritt:first-child{border-top:0}
.schritt .nr{
  grid-row:span 2; width:1.8rem; height:1.8rem; border-radius:50%;
  background:var(--akzent-hell); color:var(--akzent-tief);
  display:flex; align-items:center; justify-content:center;
  font-size:.82rem; font-weight:700; margin-top:.15rem;
}
html[data-thema="dunkel"] .schritt .nr{color:var(--text)}
.schritt .was{font-size:.9rem; color:var(--text-leise)}
.schritt .rechnung{font-family:var(--serif); font-size:1.12rem; margin-top:.1rem; overflow-x:auto}

/* --- Aufgabenkarte ------------------------------------------------------- */
.frage{font-size:1.06rem; margin:0 0 .2rem}
.felder{display:flex; flex-wrap:wrap; gap:.7rem 1rem; align-items:flex-end; margin:.9rem 0 .2rem}
.feld{display:flex; align-items:center; gap:.4rem}
.feld label{font-family:var(--serif); font-size:1.08rem; white-space:nowrap}
.feld input{
  font:inherit; font-family:var(--mono); font-size:1rem; width:7.5rem;
  padding:.5rem .6rem; border-radius:var(--radius-klein);
  border:1.5px solid var(--linie-stark); background:var(--flaeche); color:var(--text);
  min-height:2.8rem; text-align:center;
}
.feld input:focus-visible{outline:3px solid var(--akzent); outline-offset:1px; border-color:var(--akzent)}
.feld input[data-stand="richtig"]{border-color:var(--gruen); background:var(--gruen-hell)}
.feld input[data-stand="falsch"]{border-color:var(--rot); background:var(--rot-hell)}
.feld .einheit{font-size:.92rem; color:var(--text-leise)}

.wahlen{display:grid; gap:.5rem; margin:.9rem 0 .2rem}
.wahl{
  display:flex; align-items:center; gap:.7rem; text-align:left; width:100%;
  font:inherit; padding:.7rem .85rem; border-radius:var(--radius-klein);
  border:1.5px solid var(--linie-stark); background:var(--flaeche); color:var(--text);
  cursor:pointer; min-height:3rem;
}
.wahl:hover{border-color:var(--akzent); background:var(--flaeche-2)}
.wahl .buchstabe{
  flex:0 0 auto; width:1.7rem; height:1.7rem; border-radius:50%;
  background:var(--flaeche-2); border:1px solid var(--linie-stark);
  display:flex; align-items:center; justify-content:center;
  font-size:.82rem; font-weight:700; color:var(--text-leise);
}
.wahl[aria-pressed="true"]{border-color:var(--akzent); background:var(--akzent-hell)}
.wahl[aria-pressed="true"] .buchstabe{background:var(--akzent); color:#fff; border-color:var(--akzent)}
.wahl[data-stand="richtig"]{border-color:var(--gruen); background:var(--gruen-hell)}
.wahl[data-stand="falsch"]{border-color:var(--rot); background:var(--rot-hell)}
.wahl[disabled]{cursor:default; opacity:1}
.wahl .inhalt{font-family:var(--serif); font-size:1.06rem}

/* --- Rückmeldung --------------------------------------------------------- */
.echo{
  margin:.9rem 0 0; padding:.85rem 1rem; border-radius:var(--radius-klein);
  border:1px solid var(--linie); background:var(--flaeche-2);
}
.echo.gut{border-color:var(--gruen); background:var(--gruen-hell)}
.echo.fast{border-color:var(--gold); background:var(--gold-hell)}
.echo.nein{border-color:var(--rot); background:var(--rot-hell)}
.echo .kopfzeile{display:flex; align-items:center; gap:.5rem; font-weight:700; margin-bottom:.3rem}
.echo .zeichen{font-size:1.15rem}
.echo p:last-child{margin-bottom:0}

/* --- Landkarte ----------------------------------------------------------- */
.gruppe-titel{
  font-size:.78rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--text-schwach); margin:1.4rem 0 .5rem;
}
.thema-zeile{
  display:flex; align-items:center; gap:.85rem; width:100%; text-align:left;
  font:inherit; padding:.75rem .9rem; margin:.45rem 0; cursor:pointer;
  background:var(--flaeche); border:1px solid var(--linie); border-radius:var(--radius);
  color:var(--text);
}
.thema-zeile:hover{border-color:var(--akzent)}
.thema-zeile[data-dran="ja"]{border-color:var(--akzent); border-width:2px; box-shadow:var(--schatten)}
.thema-zeile .ampel{
  flex:0 0 auto; width:2.2rem; height:2.2rem; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:1rem; font-weight:700;
  background:var(--flaeche-2); color:var(--text-schwach); border:1px solid var(--linie);
}
.thema-zeile[data-stand="sicher"] .ampel{background:var(--gruen-hell); color:var(--gruen); border-color:var(--gruen)}
.thema-zeile[data-stand="wackelig"] .ampel{background:var(--gold-hell); color:var(--gold); border-color:var(--gold)}
.thema-zeile[data-stand="offen"] .ampel{background:var(--rot-hell); color:var(--rot); border-color:var(--rot)}
.thema-zeile .mitte{flex:1; min-width:0}
.thema-zeile .name{display:block; font-family:var(--serif); font-weight:600; font-size:1.02rem}
.thema-zeile .unter{display:block; font-size:.83rem; color:var(--text-schwach)}
.thema-zeile .pfeil{color:var(--text-schwach); font-size:1.1rem; flex:0 0 auto}

/* --- Phasenleiste im Thema ----------------------------------------------- */
.phasen{display:flex; gap:.3rem; margin:0 0 1rem; flex-wrap:wrap}
.phase{
  flex:1 1 0; min-width:4.6rem; text-align:center; font-size:.72rem; font-weight:600;
  padding:.32rem .2rem; border-radius:999px; background:var(--flaeche-2);
  color:var(--text-schwach); border:1px solid var(--linie);
}
.phase[data-jetzt="ja"]{background:var(--akzent); color:#fff; border-color:var(--akzent)}
html[data-thema="dunkel"] .phase[data-jetzt="ja"]{color:#10131c}
.phase[data-fertig="ja"]{background:var(--gruen-hell); color:var(--gruen); border-color:var(--gruen)}

/* --- Punkte (Re-Test-Fortschritt) ---------------------------------------- */
.punkte{display:flex; gap:.35rem; margin:.2rem 0 0}
.punkt{width:.7rem; height:.7rem; border-radius:50%; background:var(--linie)}
.punkt[data-stand="richtig"]{background:var(--gruen)}
.punkt[data-stand="falsch"]{background:var(--rot)}

/* --- Zeichnungen --------------------------------------------------------- */
svg.bild{display:block; width:100%; max-width:420px; height:auto; margin:.7rem auto;
  background:var(--flaeche); border:1px solid var(--linie); border-radius:var(--radius-klein)}
.bildpaar{display:grid; grid-template-columns:1fr 1fr; gap:.5rem}
.bildpaar svg.bild{max-width:100%}

table.werte{width:100%; border-collapse:collapse; font-family:var(--serif); font-size:1.02rem; margin:.7rem 0}
table.werte th,table.werte td{border:1px solid var(--linie); padding:.35rem .5rem; text-align:center}
table.werte th{background:var(--flaeche-2); font-weight:600; font-size:.92rem}

/* --- Fuß ----------------------------------------------------------------- */
.fuss{
  max-width:820px; margin:0 auto; padding:1.4rem .9rem 3rem;
  border-top:1px solid var(--linie); font-size:.82rem; color:var(--text-schwach);
  display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; align-items:baseline;
}
.fuss a{color:var(--text-leise)}
kbd{font-family:var(--mono); font-size:.78em; padding:.1em .4em; border:1px solid var(--linie-stark);
  border-bottom-width:2px; border-radius:4px; background:var(--flaeche-2); color:var(--text-leise)}

@media (max-width:30rem){
  .huelle{padding:.9rem .7rem 5rem}
  .karte{padding:.9rem .85rem}
  .phase{font-size:.66rem; min-width:3.6rem}
  .feld input{width:6rem}
}
@media print{
  .kopf,.fuss,.nicht-drucken,.streifen{display:none !important}
  body{background:#fff}
  .karte{box-shadow:none; border-color:#bbb; break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms !important; animation-duration:1ms !important}}
/* --- Ergänzungen: Lücken, Bild-Antworten, kleine Tabellen -------------- */
.luecke{display:inline-block; min-width:1.8em; padding:0 .2em; border-bottom:2px solid var(--akzent); color:var(--akzent); font-weight:700}
.wahl svg.bild{margin:.15rem 0; max-width:220px}
.wahl svg.gefaess{max-width:110px}
/* Bild-Antworten nebeneinander: vier Graphen untereinander füllen sonst
   drei Bildschirmhöhen. */
.wahlen:has(svg){grid-template-columns:1fr 1fr}
@media (max-width:22rem){ .wahlen:has(svg){grid-template-columns:1fr} }
svg.gefaess{max-width:160px}
table.werte.mini{width:auto; margin:.15rem 0; font-size:.95rem}
table.werte.mini th, table.werte.mini td{padding:.15rem .5rem}
/* --- Zusätze dieses Trainers ---------------------------------------------- */
.termin{margin-top:.6rem; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; font-size:.95rem}
.termin input{font:inherit; padding:.25rem .45rem; border:1px solid var(--linie-stark); border-radius:.45rem;
  background:var(--flaeche); color:var(--text)}
.fuss-zeile{flex-basis:100%}
.fuss-link{font:inherit; color:var(--text-leise); background:none; border:0; padding:0; text-decoration:underline; cursor:pointer}
.info ul{margin:.4rem 0 1rem 1.1rem; padding:0; color:var(--text-leise)}
.info li{margin:.3rem 0}
</style>
</head>
<body>

<header class="kopf nicht-drucken">
  <div class="kopf-innen">
    <div class="ring" id="ring" title="Themen, die sitzen"></div>
    <h1 class="kopf-titel">Prozent-Trainer<small id="kopf-unter">Prozentrechnung · Klasse 7</small></h1>
    <button class="iknopf" id="knopf-karte" type="button" title="Zur Übersicht" aria-label="Zur Übersicht">☰</button>
    <button class="iknopf" id="knopf-thema" type="button" title="Hell oder dunkel" aria-label="Hell oder dunkel">☾</button>
  </div>
</header>
<div class="streifen nicht-drucken"></div>

<main class="huelle" id="buehne"></main>

<footer class="fuss nicht-drucken">
  <span>Läuft ganz im Browser. Dein Stand bleibt auf diesem Gerät — er wird nirgendwohin geschickt.</span>
  <span style="margin-left:auto"><button class="knopf knopf-still" id="knopf-reset" type="button">Alles zurücksetzen</button></span>
  <span class="fuss-zeile"><button class="fuss-link" id="knopf-info" type="button">Für Eltern und Lehrkräfte</button>
    · <a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></span>
</footer>

<script>
"use strict";
/* ==========================================================================
   0 — Steckbrief
   --------------------------------------------------------------------------
   Das Einzige neben Aufgaben (3c) und Themen (4), was je Lerngruppe anders
   ist. Jede Zeichenkette hier erscheint so auf dem Bildschirm.
   ========================================================================== */
var KONFIG = {
  klasse:  "prozent",           /* nur für den Speicherschlüssel — keine Lerngruppe */
  kuerzel: "katrainer",       /* Speicherschlüssel: "katrainer" (KA) oder "klausurtrainer" */
  art:     "Klassenarbeit",           /* "Klassenarbeit" oder "Klausur"              */
  check:   "Arbeits-Check",         /* "Arbeits-Check" oder "Klausur-Check"        */
  niveau:  "Klassenarbeitsniveau",        /* "Klassenarbeitsniveau" oder "Klausurniveau" */
  datum:   "2000-01-01",        /* kein fester Termin: Den eigenen trägt man auf der Startseite ein */
  kapitel: "Prozentrechnung · Klasse 7",       /* Unterzeile nach dem Termin, z. B. "Kapitel 1 — Zuordnungen" */
  bogen:   "vom Umwandeln zwischen Bruch, Kommazahl und Prozent bis zur Frage, was vor einer Preiserhöhung auf dem Schild stand",         /* Startseite: „… durch alles, was in der Klassenarbeit
                                   vorkommt — <bogen>.“ z. B. "vom Graphenlesen bis zur Frage, …" */
  gruppen: {
    werkzeug: { titel: "Grundlagen — ohne sie geht es nicht", pille: "Grundlage" },
    klausur:  { titel: "Prozentrechnung",  pille: "Prozentrechnung" }
  },
  /* Beispiele unter jedem Zahlenfeld: nur Formen, die hier wirklich gefragt sind */
  eingabeBeispiele: ["2,5", "59,50", "12"]
};

var ZAHLWORT = ["null", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben",
                "acht", "neun", "zehn", "elf", "zwölf"];
function zahlwort(n){ return ZAHLWORT[n] || String(n); }
var MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
              "August", "September", "Oktober", "November", "Dezember"];

/* ==========================================================================
   1 — Kleinteile: Text, Zahlen, Zufall
   ========================================================================== */

var MINUS = "−";        /* echtes Minuszeichen, wie im Buch und an der Wand */
var MAL   = "·";
var HOCH2 = "²";

function esc(s){
  return String(s).replace(/[&<>"']/g, function(z){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[z];
  });
}

function el(tag, attr, kinder){
  var k = document.createElement(tag);
  if (attr) Object.keys(attr).forEach(function(name){
    var w = attr[name];
    if (w === null || w === undefined || w === false) return;
    if (name === "text") k.textContent = w;
    else if (name === "html") k.innerHTML = w;
    else if (name.slice(0,2) === "on" && typeof w === "function") k.addEventListener(name.slice(2).toLowerCase(), w);
    else k.setAttribute(name, w === true ? "" : w);
  });
  (kinder || []).forEach(function(kind){
    if (kind === null || kind === undefined) return;
    k.appendChild(typeof kind === "string" ? document.createTextNode(kind) : kind);
  });
  return k;
}

/* --- Brüche als Datentyp -------------------------------------------------
   WARUM: Eine Steigung ist oft 2/3, und 0,6666666667 ist an der Tafel keine
   Antwort. Wo geteilt wird, rechnet der Trainer mit {z, n} weiter und
   entscheidet erst beim Anzeigen, ob Dezimalzahl oder Bruch dasteht. */
function ggt(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var h=b; b=a%b; a=h; } return a||1; }

function BR(z, n){
  if (n === undefined) n = 1;
  if (n < 0){ z = -z; n = -n; }
  var t = ggt(z, n);
  return { z: z/t, n: n/t, bruch: true };
}
function istBr(v){ return v && typeof v === "object" && v.bruch === true; }
function wertVon(v){ return istBr(v) ? v.z / v.n : v; }
function brMal(a, b){ a = zuBr(a); b = zuBr(b); return BR(a.z*b.z, a.n*b.n); }
function brPlus(a, b){ a = zuBr(a); b = zuBr(b); return BR(a.z*b.n + b.z*a.n, a.n*b.n); }
function brMinus(a, b){ a = zuBr(a); b = zuBr(b); return BR(a.z*b.n - b.z*a.n, a.n*b.n); }
function brDurch(a, b){ a = zuBr(a); b = zuBr(b); return BR(a.z*b.n, a.n*b.z); }
function zuBr(v){
  if (istBr(v)) return v;
  if (Number.isInteger(v)) return BR(v, 1);
  /* Dezimalzahlen aus den Generatoren haben höchstens vier Stellen. */
  return BR(Math.round(v*10000), 10000);
}

/* Dezimaltext in deutscher Schreibweise, ohne Nachkommanullen. */
function dez(x, stellen){
  var n = (stellen === undefined) ? 4 : stellen;
  var g = Math.round(x * Math.pow(10,n)) / Math.pow(10,n);
  var s = String(g);
  if (s.indexOf("e") >= 0) s = g.toFixed(n);
  return s.replace("-", MINUS).replace(".", ",");
}

/* Endet die Dezimaldarstellung nach höchstens drei Stellen? Dann ist sie
   lesbarer als der Bruch — 0,75 statt drei Vierteln. */
function kurzDezimal(v){
  var b = zuBr(v);
  var x = b.z / b.n;
  return Math.abs(Math.round(x*1000)/1000 - x) < 1e-12;
}

/* Zahl als reiner Text (für Eingabefelder, Titel, Tabellen). */
function zText(v){
  if (!istBr(v)) return dez(v);
  if (v.n === 1) return dez(v.z);
  if (kurzDezimal(v)) return dez(v.z/v.n);
  return (v.z < 0 ? MINUS : "") + Math.abs(v.z) + "/" + v.n;
}

/* Zahl als HTML — hier darf der Bruch übereinander stehen. */
function zHtml(v){
  if (!istBr(v)) return esc(dez(v));
  if (v.n === 1) return esc(dez(v.z));
  if (kurzDezimal(v)) return esc(dez(v.z/v.n));
  return (v.z < 0 ? MINUS : "") + bruchHtml(Math.abs(v.z), v.n);
}
function bruchHtml(oben, unten){
  return '<span class="br"><span>' + oben + '</span><span>' + unten + '</span></span>';
}
function wurzelHtml(inhalt){
  return '<span class="wz">√<span class="dach">' + inhalt + '</span></span>';
}
function hochHtml(basis, exp){
  if (exp === 2) return basis + HOCH2;
  if (exp === 3) return basis + "³";
  return basis + "<sup>" + exp + "</sup>";
}

/* --- Terme zusammensetzen ------------------------------------------------
   Ein Term wie 2x² − x + 3 soll auch dann richtig aussehen, wenn ein
   Koeffizient 1, −1 oder 0 ist. Das hier ist die einzige Stelle, an der
   diese Fallunterscheidung steht. */
function summandHtml(k, teil, erster){
  var x = wertVon(k);
  if (x === 0) return "";
  var negativ = x < 0;
  var betrag = istBr(k) ? BR(Math.abs(k.z), k.n) : Math.abs(x);
  var zahl = (teil && wertVon(betrag) === 1) ? "" : zHtml(betrag);
  var kern = zahl + (teil || "");
  if (erster) return (negativ ? MINUS : "") + kern;
  return " " + (negativ ? MINUS : "+") + " " + kern;
}
function termHtml(teile){
  /* teile: [{k: Koeffizient, t: HTML des Variablenteils}] */
  var raus = "", erster = true;
  teile.forEach(function(s){
    var stueck = summandHtml(s.k, s.t, erster);
    if (stueck){ raus += stueck; erster = false; }
  });
  return raus || "0";
}
function linHtml(m, b){ return termHtml([{k:m, t:"x"}, {k:b, t:""}]); }
function quadHtml(a, b, c){ return termHtml([{k:a, t:"x"+HOCH2}, {k:b, t:"x"}, {k:c, t:""}]); }
/* f(x) = a(x − d)² + e — mit dem Vorzeichenwechsel, der die halbe Klasse kostet. */
function scheitelHtml(a, d, e){
  var innen = "x " + (wertVon(d) < 0 ? "+" : MINUS) + " " + zHtml(istBr(d) ? BR(Math.abs(d.z), d.n) : Math.abs(wertVon(d)));
  if (wertVon(d) === 0) innen = "x";
  var klammer = (wertVon(d) === 0 ? "x" : "(" + innen + ")") + HOCH2;
  var vorn = summandHtml(a, klammer, true);
  var hinten = summandHtml(e, "", false);
  return vorn + hinten;
}
/* Negative Zahlen gehoeren in Klammern: „3 · (−5)" liest sich, „3 · −5" nicht. */
function kl(v){ return wertVon(v) < 0 ? "(" + zHtml(v) + ")" : zHtml(v); }
/* Der Faktor vor einer Klammer: 1 und −1 werden nicht geschrieben. */
function vorFaktor(m){ return m === 1 ? "" : (m === -1 ? MINUS : zHtml(m)); }
var ORDNUNG = { 2: "zweite", 3: "dritte", 4: "vierte", 5: "fünfte" };

function punktHtml(name, x, y){
  return esc(name) + "(" + zHtml(x) + " | " + zHtml(y) + ")";
}

/* --- Zufall -------------------------------------------------------------- */
function rnd(min, max){ return Math.floor(Math.random()*(max-min+1)) + min; }
function rndOhne0(min, max){ var x; do { x = rnd(min,max); } while (x === 0); return x; }
function vorz(){ return Math.random() < 0.5 ? -1 : 1; }
function waehle(liste){ return liste[Math.floor(Math.random()*liste.length)]; }
function mische(liste){
  var k = liste.slice();
  for (var i = k.length-1; i > 0; i--){
    var j = Math.floor(Math.random()*(i+1)), h = k[i]; k[i] = k[j]; k[j] = h;
  }
  return k;
}
/* Zwei verschiedene Zahlen aus einem Bereich — für Punkte, Nullstellen, Paare. */
function zweiVerschieden(min, max){
  var a = rnd(min,max), b;
  do { b = rnd(min,max); } while (b === a);
  return [a, b];
}

/* --- Eingaben lesen ------------------------------------------------------
   Was getippt wird: 0,5 · 0.5 · 1/2 · " 4 " — alles wird verstanden. */
function zahlAus(text){
  var s = String(text).trim().replace(/\s+/g, "");
  if (!s) return null;
  s = s.replace(/−/g, "-").replace(/,/g, ".");
  var bruch = /^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/.exec(s);
  if (bruch){
    var n = parseFloat(bruch[2]);
    if (!n) return null;
    return parseFloat(bruch[1]) / n;
  }
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}
/* Wie genau muss eine Eingabe stimmen?
   Bei glatten Werten auf die letzte Stelle. Bei krummen — 4/3, 1/3, 0,8333 —
   waere das eine Falle: Wer den Bruch richtig hat und ihn als 1,33 eintippt,
   hat die Aufgabe verstanden. Deshalb dort zwei Nachkommastellen. */
function toleranzFuer(feld){
  if (typeof feld.toleranz === "number") return feld.toleranz;
  var x = feld.soll;
  return Math.abs(Math.round(x*1000)/1000 - x) < 1e-12 ? 1e-6 : 0.0051;
}
function gleichAuf(a, b, toleranz){
  if (a === null || a === undefined) return false;
  var t = (toleranz === undefined) ? 1e-6 : toleranz;
  return Math.abs(a - b) <= t + 1e-9;
}

/* ==========================================================================
   2 — Kleine Zeichnungen
   Ein Graph sagt bei Parabeln und Sinuskurven mehr als drei Sätze. Gezeichnet
   wird mit den Farbmarken der Seite, damit die Bilder auch dunkel stimmen.
   ========================================================================== */
var graphZaehler = 0;
function graphSvg(opt){
  var B = 400, H = opt.hoehe || 300, rand = 26;
  /* Eigene Kennung je Bild: Auf einer Seite können mehrere Koordinatensysteme
     stehen, und zwei gleich benannte Schnittmasken würden sich in die Quere
     kommen. */
  var maske = "gsvg" + (++graphZaehler);
  var xmin = opt.xmin, xmax = opt.xmax, ymin = opt.ymin, ymax = opt.ymax;
  function px(x){ return rand + (x - xmin) / (xmax - xmin) * (B - 2*rand); }
  function py(y){ return H - rand - (y - ymin) / (ymax - ymin) * (H - 2*rand); }
  var teile = [];

  /* Gitter in ganzen Schritten, aber höchstens 20 Linien je Richtung. */
  var sx = Math.max(1, Math.ceil((xmax - xmin) / 20));
  var sy = Math.max(1, Math.ceil((ymax - ymin) / 20));
  for (var gx = Math.ceil(xmin/sx)*sx; gx <= xmax; gx += sx)
    teile.push('<line x1="'+px(gx)+'" y1="'+py(ymin)+'" x2="'+px(gx)+'" y2="'+py(ymax)+'" stroke="var(--linie)" stroke-width="1"/>');
  for (var gy = Math.ceil(ymin/sy)*sy; gy <= ymax; gy += sy)
    teile.push('<line x1="'+px(xmin)+'" y1="'+py(gy)+'" x2="'+px(xmax)+'" y2="'+py(gy)+'" stroke="var(--linie)" stroke-width="1"/>');

  /* Achsen */
  if (ymin <= 0 && ymax >= 0)
    teile.push('<line x1="'+px(xmin)+'" y1="'+py(0)+'" x2="'+px(xmax)+'" y2="'+py(0)+'" stroke="var(--text-leise)" stroke-width="1.6"/>');
  if (xmin <= 0 && xmax >= 0)
    teile.push('<line x1="'+px(0)+'" y1="'+py(ymin)+'" x2="'+px(0)+'" y2="'+py(ymax)+'" stroke="var(--text-leise)" stroke-width="1.6"/>');

  /* Achsenbeschriftung: nur wenige Zahlen, sonst wird es unruhig. */
  var bx = Math.max(sx, Math.round((xmax-xmin)/6/sx)*sx);
  for (var tx = Math.ceil(xmin/bx)*bx; tx <= xmax; tx += bx){
    if (tx === 0) continue;
    teile.push('<text x="'+px(tx)+'" y="'+(py(Math.max(ymin,Math.min(ymax,0)))+14)+'" text-anchor="middle" font-size="11" fill="var(--text-schwach)">'+dez(tx)+'</text>');
  }
  var by = Math.max(sy, Math.round((ymax-ymin)/6/sy)*sy);
  for (var ty = Math.ceil(ymin/by)*by; ty <= ymax; ty += by){
    if (ty === 0) continue;
    teile.push('<text x="'+(px(Math.max(xmin,Math.min(xmax,0)))-6)+'" y="'+(py(ty)+4)+'" text-anchor="end" font-size="11" fill="var(--text-schwach)">'+dez(ty)+'</text>');
  }

  (opt.kurven || []).forEach(function(kurve){
    var punkte = [], N = 260, luecke = true, d = "";
    for (var i = 0; i <= N; i++){
      var x = xmin + (xmax - xmin) * i / N;
      var y = kurve.f(x);
      if (!isFinite(y) || y < ymin - (ymax-ymin) || y > ymax + (ymax-ymin)){ luecke = true; continue; }
      d += (luecke ? "M" : "L") + px(x).toFixed(1) + " " + py(y).toFixed(1) + " ";
      luecke = false;
    }
    teile.push('<g clip-path="url(#'+maske+')"><path d="'+d+'" fill="none" stroke="'+(kurve.farbe||"var(--akzent)")+'" stroke-width="2.4" stroke-linecap="round"'
      + (kurve.strich ? ' stroke-dasharray="6 5"' : '') + '/></g>');
  });

  (opt.punkte || []).forEach(function(p){
    teile.push('<circle cx="'+px(p.x)+'" cy="'+py(p.y)+'" r="4.5" fill="'+(p.farbe||"var(--rot)")+'"/>');
    if (p.name) teile.push('<text x="'+(px(p.x)+8)+'" y="'+(py(p.y)-8)+'" font-size="12" font-weight="600" fill="'+(p.farbe||"var(--rot)")+'">'+esc(p.name)+'</text>');
  });

  return '<svg class="bild" viewBox="0 0 '+B+' '+H+'" role="img" aria-label="'
    + esc(opt.alt || "Koordinatensystem mit Graph") + '"><defs><clipPath id="'+maske+'">'
    + '<rect x="'+(rand-4)+'" y="'+(rand-4)+'" width="'+(B-2*rand+8)+'" height="'+(H-2*rand+8)+'"/>'
    + '</clipPath></defs>' + teile.join("") + '</svg>';
}
/* ==========================================================================
   3 — Die Aufgaben
   --------------------------------------------------------------------------
   Jede Aufgabe ist ein Objekt:

     frage      HTML der Aufgabenstellung
     bild       optional: SVG, Tabelle, Gleichungssystem
     eingabe    wie geantwortet wird (Zahl, mehrere Felder, Auswahl)
     hinweis    der erste Tipp nach einem Fehler — nie die Lösung
     schritte   die vollständige Rechnung, Schritt für Schritt
     antwort    die Endantwort in einem Satz

   Erzeugt werden sie von Funktionen ohne Argumente. Jeder Aufruf liefert
   dieselbe Sorte Aufgabe mit neuen Zahlen — das ist der Grund, warum ein
   Re-Test hier etwas bestätigt und nicht nur ein Gedächtnis prüft.
   ========================================================================== */

function S(was, rechnung){ return { was: was, r: rechnung }; }

/* Vier Wahlmöglichkeiten mischen und merken, welche die richtige ist. */
function wahl(richtigHtml, falschHtmls){
  var alle = mische([{ h: richtigHtml, ok: true }].concat(
    falschHtmls.map(function(h){ return { h: h, ok: false }; })));
  return {
    art: "wahl",
    optionen: alle.map(function(a){ return a.h; }),
    richtig: alle.findIndex(function(a){ return a.ok; })
  };
}
/* Wie wahl(), aber gegen den haeufigsten Generatorfehler abgesichert: Bei
   bestimmten Zahlen faellt ein Ablenker mit der richtigen Antwort zusammen
   (bei a = 1 ist a² = a). Aus einer Vorratsliste werden die ersten drei
   genommen, die weder gleich der Loesung noch untereinander gleich sind. */
function wahlAus(richtigHtml, vorrat){
  var raus = [];
  vorrat.forEach(function(k){
    if (k !== richtigHtml && raus.indexOf(k) < 0 && raus.length < 3) raus.push(k);
  });
  while (raus.length < 3) raus.push("keine dieser Antworten" + " ".repeat(raus.length));
  return wahl(richtigHtml, raus);
}
function zahlFeld(label, soll, extra){
  var e = { art: "felder", felder: [Object.assign({ label: label, soll: soll }, extra || {})] };
  return e;
}
function felder(liste, egal){
  return { art: "felder", felder: liste, egal: !!egal };
}

/* ==========================================================================
   3b — Kleinteile, die sich bewährt haben (aus dem Trainer der 7b)
   --------------------------------------------------------------------------
   Geld, Tabellen, Diagramme im ersten Quadranten, Gefäße. Die Kontexte sind
   bewusst andere als in der Arbeit und in der Probearbeit: Wer hier
   übt, soll das Verfahren lernen, nicht eine bestimmte Aufgabe.
   ========================================================================== */
var NAMEN = ["Mia", "Noah", "Lea", "Finn", "Nele", "Ole", "Aylin", "Can", "Jana", "Paul", "Sofia", "Luca"];

function glatt(v, stellen){
  var f = Math.pow(10, stellen === undefined ? 2 : stellen);
  return Math.abs(Math.round(v * f) - v * f) < 1e-7;
}
/* Geld: ganze Beträge ohne Nachkommastellen, sonst immer zwei. */
function eurText(x){
  var r = Math.round(x * 100) / 100;
  return Number.isInteger(r) ? dez(r) : r.toFixed(2).replace(".", ",");
}
function eur(x){ return eurText(x) + "&nbsp;€"; }
function mitE(x, e){ return dez(x) + (e ? "&nbsp;" + e : ""); }

var LUECKE = '<span class="luecke">?</span>';

function tabelle(kopfX, kopfY, xs, ys){
  function zelle(v){ return "<td>" + (typeof v === "number" ? esc(dez(v)) : v) + "</td>"; }
  return '<table class="werte"><tr><th>' + kopfX + "</th>" + xs.map(zelle).join("")
    + "</tr><tr><th>" + kopfY + "</th>" + ys.map(zelle).join("") + "</tr></table>";
}
/* Kleine Tabelle als Antwortmöglichkeit — ohne Kopfspalte. */
function miniTabelle(xs, ys){

  return '<table class="werte mini"><tr><th>x</th>' + xs.map(function(v){ return "<td>" + esc(dez(v)) + "</td>"; }).join("")
    + '</tr><tr><th>y</th>' + ys.map(function(v){ return "<td>" + esc(dez(v)) + "</td>"; }).join("") + "</tr></table>";
}
function teilerVon(G, min, max){
  var t = [];
  for (var d = min; d <= max; d++) if (G % d === 0) t.push(d);
  return t;
}
function zweiAus(liste){
  var a = waehle(liste), b;
  do { b = waehle(liste); } while (b === a);
  return [a, b];
}

/* --- Diagramm im ersten Quadranten --------------------------------------
   Anders als graphSvg: Achsen mit Namen, Gitter im Takt der Aufgabe, Punkte
   ohne Linie möglich. klein: für Antwortmöglichkeiten, ohne Zahlen. */
var diaZaehler = 0;
function diagramm(opt){
  var klein = !!opt.klein;
  var B = klein ? 200 : 420, H = klein ? 150 : 300;
  var L = klein ? 18 : 48, R = 12, O = klein ? 12 : 30, U = klein ? 18 : 40;
  var xmax = opt.xmax, ymax = opt.ymax;
  function px(x){ return L + x / xmax * (B - L - R); }
  function py(y){ return H - U - y / ymax * (H - U - O); }
  var t = [];
  if (!klein){
    var sx = opt.sx, sy = opt.sy;
    for (var gx = sx; gx <= xmax + 1e-9; gx += sx){
      t.push('<line x1="' + px(gx) + '" y1="' + py(0) + '" x2="' + px(gx) + '" y2="' + py(ymax) + '" stroke="var(--linie)" stroke-width="1"/>');
      t.push('<text x="' + px(gx) + '" y="' + (py(0) + 16) + '" text-anchor="middle" font-size="12" fill="var(--text-leise)">' + dez(gx) + "</text>");
    }
    for (var gy = sy; gy <= ymax + 1e-9; gy += sy){
      t.push('<line x1="' + px(0) + '" y1="' + py(gy) + '" x2="' + px(xmax) + '" y2="' + py(gy) + '" stroke="var(--linie)" stroke-width="1"/>');
      t.push('<text x="' + (px(0) - 6) + '" y="' + (py(gy) + 4) + '" text-anchor="end" font-size="12" fill="var(--text-leise)">' + dez(gy) + "</text>");
    }
    t.push('<text x="' + (px(0) - 6) + '" y="' + (py(0) + 16) + '" text-anchor="end" font-size="12" fill="var(--text-leise)">0</text>');
  }
  /* Achsen mit Pfeil */
  t.push('<line x1="' + px(0) + '" y1="' + py(0) + '" x2="' + (px(xmax) + 8) + '" y2="' + py(0) + '" stroke="var(--text-leise)" stroke-width="1.6"/>');
  t.push('<line x1="' + px(0) + '" y1="' + py(0) + '" x2="' + px(0) + '" y2="' + (py(ymax) - 8) + '" stroke="var(--text-leise)" stroke-width="1.6"/>');
  t.push('<path d="M' + (px(xmax) + 8) + " " + (py(0) - 4) + "L" + (px(xmax) + 14) + " " + py(0) + "L" + (px(xmax) + 8) + " " + (py(0) + 4) + 'Z" fill="var(--text-leise)"/>');
  t.push('<path d="M' + (px(0) - 4) + " " + (py(ymax) - 8) + "L" + px(0) + " " + (py(ymax) - 14) + "L" + (px(0) + 4) + " " + (py(ymax) - 8) + 'Z" fill="var(--text-leise)"/>');
  var fs = klein ? 10 : 13;
  if (opt.xname) t.push('<text x="' + (B - R) + '" y="' + (H - (klein ? 3 : 8)) + '" text-anchor="end" font-size="' + fs + '" font-weight="600" fill="var(--text-leise)">' + esc(opt.xname) + "</text>");
  if (opt.yname) t.push('<text x="' + (px(0) + 6) + '" y="' + (klein ? 10 : 16) + '" font-size="' + fs + '" font-weight="600" fill="var(--text-leise)">' + esc(opt.yname) + "</text>");

  if (opt.linien){
    var pts = opt.linien.map(function(p){ return px(p[0]).toFixed(1) + "," + py(p[1]).toFixed(1); }).join(" ");
    t.push('<polyline points="' + pts + '" fill="none" stroke="var(--akzent)" stroke-width="' + (klein ? 2.4 : 2.8) + '" stroke-linejoin="round" stroke-linecap="round"/>');
  }
  (opt.punkte || []).forEach(function(p){
    t.push('<circle cx="' + px(p[0]) + '" cy="' + py(p[1]) + '" r="' + (klein ? 3.5 : 4.5) + '" fill="var(--rot)"/>');
  });
  var name = "dia" + (++diaZaehler);
  return '<svg class="bild' + (klein ? " klein" : "") + '" viewBox="0 0 ' + B + " " + H + '" role="img" aria-label="'
    + esc(opt.alt || "Diagramm") + '" id="' + name + '">' + t.join("") + "</svg>";
}

/* ==========================================================================
   3c — Die Aufgaben dieses Trainers: Prozentrechnung, Klasse 7
   --------------------------------------------------------------------------
   Je Thema eine Liste G_<NAME> von Generatoren, jeder ohne Argumente, jeder
   Aufruf dieselbe Sorte Aufgabe mit neuen Zahlen. Die ersten beiden jeder
   Liste sind die Diagnoseaufgaben des Themas.

   BUCHFREI: Alle Kontexte sind frei erfunden. Keine Aufgabe, kein Bild und
   kein Seitenverweis aus einem Schulbuch — die Musterliste prüft das.

   RECHNEN MIT GANZEN ZAHLEN: Werte entstehen als G · p / 100 aus ganzen
   Zahlen; so gibt es keine Gleitkomma-Reste wie 29,999…
   ========================================================================== */

/* "7 %" mit geschütztem Leerzeichen */
function pz(p){ return esc(dez(p)) + "&nbsp;%"; }
/* dasselbe, auf eine Nachkommastelle gerundet — für falsche Antworten */
function pzr(x){ return esc(dez(x, 1)) + "&nbsp;%"; }
/* 7 → 0,07 · 107 → 1,07 */
function hundertstel(p){ return dez(p / 100); }
function klein(s){ return s.charAt(0).toLowerCase() + s.slice(1); }

/* Grundwert aus einer Liste (Vielfache von 20), Prozentsatz aus einer Liste
   (Vielfache von 5): Der Prozentwert ist dann immer eine ganze Zahl. */
function ganzFall(Gs, ps){
  var G = waehle(Gs), p = waehle(ps), W = G * p / 100;
  return { G: G, p: p, W: W, R: G - W };
}

/* Waren passend zum Preis: Ein Fahrradhelm für 400 € wäre ein eigener Stolperstein. */
var WAREN_KLEIN = ["Ein Fahrradhelm", "Ein Rucksack", "Eine Lampe", "Ein Schlafsack", "Ein Fußball",
                   "Eine Jacke", "Ein Paar Turnschuhe"];
var WAREN_GROSS = ["Ein Fahrrad", "Ein Zelt", "Eine Gitarre", "Ein Roller", "Ein Tablet",
                   "Ein Schreibtisch", "Eine Kamera"];
function ware(preis){ return waehle(preis < 100 ? WAREN_KLEIN : WAREN_GROSS); }

/* --- Prozentstreifen ------------------------------------------------------
   Oben die Prozente, unten die Werte. Unter 100 % steht das Ganze. Reicht
   der Anteil über 100 % hinaus (Zunahme), wächst der Streifen golden weiter.
   o: { p, obenP, untenW, untenG } — die drei Texte dürfen "?" sein. */
var streifenZaehler = 0;
function streifen(o){
  var B = 420, H = 124, L = 30, R = 46;
  var max = Math.max(100, o.p);
  function px(v){ return L + v / max * (B - L - R); }
  var y0 = 50, h = 24, t = [];
  /* Liegen zwei Marken dicht beieinander, rückt die Marke des Anteils eine Zeile
     weiter nach außen, und die Nachbarmarke schreibt von ihr weg. */
  var eng0 = px(o.p) - px(0) < 46, eng100 = Math.abs(px(o.p) - px(100)) < 58;
  function text(x, y, s, anker){
    var frage = s === "?";
    x += anker === "end" ? -4 : (anker === "start" ? 4 : 0);
    return '<text x="' + x.toFixed(1) + '" y="' + y + '" text-anchor="' + anker + '" font-size="' + (frage ? 18 : 13.5)
      + '" font-weight="' + (frage ? 700 : 600) + '" fill="' + (frage ? "var(--rot)" : "var(--text)") + '">' + esc(s) + "</text>";
  }
  function marke(v, oben, unten, versetzt, anker){
    var x = px(v), dy = versetzt ? 16 : 0;
    t.push('<line x1="' + x.toFixed(1) + '" y1="' + (y0 - 6 - dy) + '" x2="' + x.toFixed(1) + '" y2="' + (y0 + h + 6 + dy)
      + '" stroke="var(--text-leise)" stroke-width="1.4"/>');
    t.push(text(x, y0 - 11 - dy, oben, anker));
    t.push(text(x, y0 + h + 20 + dy, unten, anker));
  }
  t.push('<rect x="' + px(0) + '" y="' + y0 + '" width="' + (px(100) - px(0)).toFixed(1) + '" height="' + h
    + '" fill="var(--flaeche-2)" stroke="var(--linie-stark)" stroke-width="1.5"/>');
  t.push('<rect x="' + px(0) + '" y="' + y0 + '" width="' + (px(Math.min(o.p, 100)) - px(0)).toFixed(1) + '" height="' + h
    + '" fill="var(--akzent-hell)" stroke="var(--akzent)" stroke-width="1.5"/>');
  if (o.p > 100)
    t.push('<rect x="' + px(100).toFixed(1) + '" y="' + y0 + '" width="' + (px(o.p) - px(100)).toFixed(1) + '" height="' + h
      + '" fill="var(--gold-hell)" stroke="var(--gold)" stroke-width="1.5"/>');
  marke(0, "0 %", "0", false, eng0 ? "end" : "middle");
  marke(100, "100 %", o.untenG, false, eng100 ? (o.p > 100 ? "end" : "start") : "middle");
  marke(o.p, o.obenP, o.untenW, eng0 || eng100, "middle");
  return '<svg class="bild" viewBox="0 0 ' + B + " " + H + '" role="img" aria-label="Prozentstreifen" id="str' + (++streifenZaehler) + '">'
    + t.join("") + "</svg>";
}
function proz(p){ return dez(p) + " %"; }      /* Text für den Streifen */
function euro(x){ return eurText(x) + " €"; }  /* Text für den Streifen */

/* ==========================================================================
   THEMA A — Bruch, Kommazahl, Prozent (Gruppe „werkzeug“)
   Drei Schreibweisen für denselben Anteil. Jede spätere Rechnung wechselt
   mindestens einmal zwischen ihnen.
   ========================================================================== */
var BRUECHE = [[1,2],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,10],[3,10],[7,10],[9,10],
               [1,20],[3,20],[7,20],[9,20],[11,20],[1,25],[2,25],[3,25],[4,25],[1,50],[3,50],[7,50]];
var G_UMWANDELN = [
  /* Bruch → Prozent */
  function(){
    var b = waehle(BRUECHE), z = b[0], n = b[1], f = 100 / n, p = z * f;
    return {
      frage: "Schreibe als Prozent: " + bruchHtml(z, n),
      eingabe: zahlFeld("Das sind", p, { einheit: "%" }),
      hinweis: "Prozent heißt Hundertstel. Erweitere den Bruch so, dass unten 100 steht.",
      schritte: [
        S("Auf Hundertstel erweitern: oben und unten mal " + f, bruchHtml(z, n) + " = " + bruchHtml(z + " " + MAL + " " + f, n + " " + MAL + " " + f) + " = " + bruchHtml(p, 100)),
        S("Hundertstel sind Prozent", bruchHtml(p, 100) + " = " + pz(p))
      ],
      antwort: bruchHtml(z, n) + " = <strong>" + pz(p) + "</strong>"
    };
  },
  /* Prozent → Kommazahl */
  function(){
    var p = waehle([2, 3, 5, 7, 8, 9, 12, 15, 35, 40, 60, 75, 90, 104, 108, 120, 125, 150]);
    var richtig = hundertstel(p);
    return {
      frage: "Wie schreibt man " + pz(p) + " als Kommazahl?",
      eingabe: wahlAus(richtig, [dez(p / 10), dez(p), dez(p / 1000), dez(1 + p / 100), dez(p * 10)]),
      hinweis: "Prozent heißt Hundertstel: Teile die Zahl vor dem Prozentzeichen durch 100.",
      schritte: [
        S("Prozent heißt Hundertstel", pz(p) + " = " + bruchHtml(p, 100)),
        S("Durch 100 teilen: Das Komma rückt zwei Stellen nach links", p + " : 100 = " + richtig)
      ],
      antwort: pz(p) + " = <strong>" + richtig + "</strong>"
    };
  },
  /* Kommazahl → Prozent */
  function(){
    var h = waehle([2, 5, 6, 8, 9, 20, 30, 45, 60, 70, 85, 110, 125, 180, 250]);
    return {
      frage: "Schreibe als Prozent: " + hundertstel(h),
      eingabe: zahlFeld("Das sind", h, { einheit: "%" }),
      hinweis: "Nimm die Kommazahl mal 100: Das Komma rückt zwei Stellen nach rechts. Fehlt eine Stelle, hänge eine Null an.",
      schritte: [
        S("Mal 100 rechnen", hundertstel(h) + " " + MAL + " 100 = " + h),
        S("Prozentzeichen dazu", hundertstel(h) + " = " + pz(h))
      ],
      antwort: hundertstel(h) + " = <strong>" + pz(h) + "</strong>"
    };
  },
  /* Prozent → gekürzter Bruch */
  function(){
    var b = waehle(BRUECHE), z = b[0], n = b[1], g = 100 / n, p = z * g;
    var richtig = bruchHtml(z, n);
    return {
      frage: "Welcher Bruch ist dasselbe wie " + pz(p) + "?",
      eingabe: wahlAus(richtig, [bruchHtml(1, p), bruchHtml(p, 10), bruchHtml(100, p), bruchHtml(z, n * 10), bruchHtml(p, 1000), bruchHtml(z + 1, n)]),
      hinweis: "Schreibe den Prozentsatz zuerst als Bruch mit dem Nenner 100. Kürze danach.",
      schritte: [
        S("Als Hundertstel schreiben", pz(p) + " = " + bruchHtml(p, 100)),
        S("Kürzen mit " + g, bruchHtml(p, 100) + " = " + bruchHtml(p + " : " + g, "100 : " + g) + " = " + richtig)
      ],
      antwort: pz(p) + " = <strong>" + richtig + "</strong>"
    };
  }
];

/* ==========================================================================
   THEMA B — Rechnen mit Kommazahlen (Gruppe „werkzeug“)
   Mal 0,06, geteilt durch 0,8, geteilt durch 100: Daran hängt jede Rechnung
   mit Prozenten, sobald kein Taschenrechner in der Nähe ist.
   ========================================================================== */
var G_KOMMA = [
  /* ganze Zahl mal Hundertstel */
  function(){
    var G = waehle([40, 50, 60, 80, 120, 150, 200, 250, 300, 350, 400, 450, 600, 800]);
    var p = waehle([2, 3, 4, 6, 7, 8, 9, 12, 15, 35, 45, 65]);
    var roh = G * p, soll = roh / 100;
    return {
      frage: "Rechne ohne Taschenrechner: " + G + " " + MAL + " " + hundertstel(p),
      eingabe: zahlFeld("Ergebnis:", soll),
      hinweis: "Rechne zuerst ohne Komma: " + G + " " + MAL + " " + p + ". Teile danach durch 100.",
      schritte: [
        S("Ohne Komma rechnen", G + " " + MAL + " " + p + " = " + roh),
        S("Der Faktor hatte zwei Stellen nach dem Komma: durch 100 teilen", roh + " : 100 = " + dez(soll))
      ],
      antwort: G + " " + MAL + " " + hundertstel(p) + " = <strong>" + dez(soll) + "</strong>"
    };
  },
  /* teilen durch eine Kommazahl */
  function(){
    var d100 = waehle([20, 40, 50, 80, 120, 150, 25, 125, 5, 8]);
    var q = d100 === 125 || d100 === 25 ? waehle([20, 40, 60, 80]) : waehle([20, 30, 40, 50, 60, 80, 120, 150, 200]);
    var k = d100 % 10 === 0 ? 10 : 100;
    var teiler = d100 * k / 100;                 /* ganze Zahl */
    var gross = q * teiler;                      /* erweiterter Dividend */
    var dividend = dez(q * d100 / 100), divisor = hundertstel(d100);
    return {
      frage: "Rechne ohne Taschenrechner: " + dividend + " : " + divisor,
      eingabe: zahlFeld("Ergebnis:", q),
      hinweis: "Mach aus dem Teiler eine ganze Zahl: Nimm <em>beide</em> Zahlen mal " + k + ". Das Ergebnis bleibt dabei gleich.",
      schritte: [
        S("Beide Zahlen mal " + k, dividend + " : " + divisor + " = " + gross + " : " + teiler),
        S("Jetzt mit ganzen Zahlen teilen", gross + " : " + teiler + " = " + q)
      ],
      antwort: dividend + " : " + divisor + " = <strong>" + q + "</strong>"
    };
  },
  /* mal 100 und geteilt durch 100: das Komma wandert */
  function(){
    if (Math.random() < 0.5){
      var v10 = waehle([70, 350, 1250, 85, 475, 2500, 30, 600, 8, 125]);     /* Zehntel */
      var a = dez(v10 / 10), richtig = dez(v10 / 1000);
      return {
        frage: "Rechne: " + a + " : 100",
        eingabe: wahlAus(richtig, [dez(v10 / 100), dez(v10 / 10000), dez(v10 * 10), a]),
        hinweis: "Geteilt durch 100: Das Komma rückt zwei Stellen nach links. Fehlen Stellen, schreibe Nullen davor.",
        schritte: [
          S("Geteilt durch 100 heißt: Komma zwei Stellen nach links", a + " → " + richtig),
          S("Kontrolle: Das Ergebnis muss viel kleiner sein", a + " : 100 = " + richtig)
        ],
        antwort: a + " : 100 = <strong>" + richtig + "</strong>"
      };
    }
    var t = waehle([70, 350, 1250, 85, 600, 2500, 30, 5, 125, 45]);            /* Tausendstel */
    var b = dez(t / 1000), ok = dez(t / 10);
    return {
      frage: "Rechne: " + b + " " + MAL + " 100",
      eingabe: wahlAus(ok, [dez(t / 100), dez(t), dez(t / 10000), b]),
      hinweis: "Mal 100: Das Komma rückt zwei Stellen nach rechts. Fehlt eine Stelle, hänge eine Null an.",
      schritte: [
        S("Mal 100 heißt: Komma zwei Stellen nach rechts", b + " → " + ok),
        S("Kontrolle: Das Ergebnis muss viel größer sein", b + " " + MAL + " 100 = " + ok)
      ],
      antwort: b + " " + MAL + " 100 = <strong>" + ok + "</strong>"
    };
  }
];

/* ==========================================================================
   THEMA C — Grundwert, Prozentwert, Prozentsatz erkennen (Gruppe „klausur“)
   Vor jeder Rechnung steht die Frage: Was ist das Ganze, was ist der Teil?
   Wer das verwechselt, rechnet sauber das Falsche aus.
   ========================================================================== */
var O_W = "der Prozentwert (der Teil als Zahl)";
var O_G = "der Grundwert (das Ganze)";
var O_P = "der Prozentsatz (der Teil in Prozent)";
var O_N = "der neue Wert nach einer Erhöhung";
var P_GLATT = [5, 10, 15, 20, 25, 30, 40, 60, 70, 75, 80, 90];

var G_WASISTWAS = [
  /* Welche Angabe ist der Grundwert, welche der Prozentwert? */
  function(){
    var f = ganzFall([40, 60, 80, 120, 160, 200, 240, 300, 360, 400], P_GLATT);
    var name = waehle(NAMEN);
    var k = waehle([
      { e: "Mitglieder", t: "In einem Sportverein sind " + f.G + " Mitglieder. " + pz(f.p) + " davon spielen Handball. Das sind " + f.W + " Mitglieder." },
      { e: "Kinder",     t: f.W + " Kinder einer Schule kommen mit dem Rad. Das sind " + pz(f.p) + " aller " + f.G + " Kinder." },
      { e: "Lose",       t: pz(f.p) + " der Lose sind Gewinne. Es gibt " + f.G + " Lose. Also gewinnt man mit " + f.W + " Losen." },
      { e: "Seiten",     t: name + " hat " + f.W + " Seiten gelesen. Das sind " + pz(f.p) + " eines Romans mit " + f.G + " Seiten." },
      { e: "Plätze",     t: "Von den " + f.G + " Plätzen im Zug sind " + f.W + " besetzt. Das sind " + pz(f.p) + "." }
    ]);
    var gStr = f.G + " " + k.e, wStr = f.W + " " + k.e, rStr = f.R + " " + k.e;
    var nachG = Math.random() < 0.6;
    return {
      frage: k.t + " Welche Angabe ist <strong>" + (nachG ? "der Grundwert" : "der Prozentwert") + "</strong>?",
      eingabe: nachG ? wahlAus(gStr, [wStr, pz(f.p), rStr, pz(100 - f.p), (f.G + f.W) + " " + k.e])
                     : wahlAus(wStr, [gStr, pz(f.p), rStr, pz(100 - f.p), (f.G + f.W) + " " + k.e]),
      hinweis: nachG
        ? "Frag dich: Wovon wird hier ein Teil genommen? Dieses Ganze ist der Grundwert — es gehört zu 100&nbsp;%."
        : "Der Prozentwert ist der Teil vom Ganzen — als Anzahl, nicht in Prozent.",
      schritte: [
        S("Das Ganze suchen: Wovon wird der Teil genommen?", "Grundwert: " + gStr + " (das sind 100&nbsp;%)"),
        S("Der Teil davon als Zahl", "Prozentwert: " + wStr),
        S("Derselbe Teil in Prozent", "Prozentsatz: " + pz(f.p))
      ],
      antwort: (nachG ? "Der Grundwert ist <strong>" + gStr : "Der Prozentwert ist <strong>" + wStr) + "</strong>."
    };
  },
  /* Was ist gesucht? — ohne zu rechnen */
  function(){
    var f = ganzFall([120, 160, 200, 240, 300, 360, 400, 480], P_GLATT);
    var name = waehle(NAMEN);
    var k = waehle([
      { r: O_W, t: "Im Zug gibt es " + f.G + " Plätze. " + pz(f.p) + " davon sind reserviert. Wie viele Plätze sind reserviert?",
        geg: "das Ganze (" + f.G + " Plätze) und der Prozentsatz (" + pz(f.p) + ")", fehlt: "der Teil als Zahl: der Prozentwert" },
      { r: O_W, t: "Eine Gitarre kostet " + f.G + "&nbsp;€. " + name + " hat schon " + pz(f.p) + " davon gespart. Wie viel Euro sind das?",
        geg: "das Ganze (" + f.G + "&nbsp;€) und der Prozentsatz (" + pz(f.p) + ")", fehlt: "der Teil in Euro: der Prozentwert" },
      { r: O_P, t: "Von " + f.G + " Kindern einer Schule spielen " + f.W + " ein Instrument. Welcher Anteil der Kinder ist das?",
        geg: "das Ganze (" + f.G + " Kinder) und der Teil als Zahl (" + f.W + " Kinder)", fehlt: "der Teil in Prozent: der Prozentsatz" },
      { r: O_P, t: "In ein Sammelalbum passen " + f.G + " Bilder. " + name + " hat schon " + f.W + " Bilder eingeklebt. Welcher Anteil des Albums ist das?",
        geg: "das Ganze (" + f.G + " Bilder) und der Teil als Zahl (" + f.W + " Bilder)", fehlt: "der Teil in Prozent: der Prozentsatz" },
      { r: O_G, t: f.W + " Kinder haben beim Sportfest eine Urkunde bekommen. Das sind " + pz(f.p) + " aller Kinder. Wie viele Kinder waren beim Sportfest dabei?",
        geg: "der Teil als Zahl (" + f.W + " Kinder) und der Prozentsatz (" + pz(f.p) + ")", fehlt: "das Ganze: der Grundwert" },
      { r: O_G, t: name + " hat schon " + f.W + "&nbsp;€ gespart. Das sind " + pz(f.p) + " vom Preis für ein Fahrrad. Wie teuer ist das Fahrrad?",
        geg: "der Teil in Euro (" + f.W + "&nbsp;€) und der Prozentsatz (" + pz(f.p) + ")", fehlt: "das Ganze: der Grundwert" }
    ]);
    return {
      frage: k.t + " <em>Du musst nicht rechnen.</em> Was ist gesucht?",
      eingabe: wahl(k.r, [O_W, O_G, O_P, O_N].filter(function(o){ return o !== k.r; })),
      hinweis: "Im Text stehen zwei der drei Größen. Finde heraus, welche das sind — die dritte ist gesucht.",
      schritte: [
        S("Was steht im Text?", "gegeben: " + k.geg),
        S("Was fehlt also?", "gesucht: " + k.fehlt)
      ],
      antwort: "Gesucht ist <strong>" + k.r + "</strong>."
    };
  },
  /* Prozentstreifen lesen */
  function(){
    var f = ganzFall([40, 60, 80, 120, 160, 200, 240, 300], [15, 20, 25, 30, 40, 60, 70, 75, 80]);
    var fehlt = waehle(["W", "G", "P"]);
    var richtig = fehlt === "W" ? O_W : (fehlt === "G" ? O_G : O_P);
    var wo = fehlt === "W" ? "unten, unter " + pz(f.p) + ": Dort steht der Teil als Zahl — der Prozentwert"
           : fehlt === "G" ? "unten, unter 100&nbsp;%: Dort steht das Ganze — der Grundwert"
           : "oben, über der " + f.W + ": Dort steht der Teil in Prozent — der Prozentsatz";
    return {
      frage: "An diesem Prozentstreifen fehlt eine Angabe. Welche Größe gehört an die Stelle mit dem Fragezeichen?",
      bild: streifen({ p: f.p, obenP: fehlt === "P" ? "?" : proz(f.p), untenW: fehlt === "W" ? "?" : String(f.W), untenG: fehlt === "G" ? "?" : String(f.G) }),
      eingabe: wahl(richtig, [O_W, O_G, O_P, O_N].filter(function(o){ return o !== richtig; })),
      hinweis: "Oben am Streifen stehen die Prozente, unten die passenden Werte. Unter 100&nbsp;% steht immer das Ganze.",
      schritte: [
        S("Den Streifen lesen", "oben die Prozente, unten die Werte, unter 100&nbsp;% das Ganze"),
        S("Wo steht das Fragezeichen?", wo)
      ],
      antwort: "Es fehlt <strong>" + richtig + "</strong>."
    };
  }
];

/* ==========================================================================
   THEMA D — Prozentwert berechnen (Gruppe „klausur“)
   Die häufigste Aufgabe überhaupt: Wie viel sind p % von einem Ganzen?
   ========================================================================== */
function pwZahlen(){
  var p = waehle([3, 4, 6, 7, 8, 9, 12, 15, 18, 35, 45, 65, 85]);
  var G = waehle([50, 150, 200, 250, 300, 400, 450, 500, 600, 700, 800, 900, 1200]);
  return { p: p, G: G, W: G * p / 100 };
}
var G_PROZENTWERT = [
  /* ohne Kontext, über 1 % */
  function(){
    var q = pwZahlen();
    return {
      frage: "Wie viel sind " + pz(q.p) + " von " + q.G + "?",
      eingabe: zahlFeld("Prozentwert:", q.W),
      hinweis: "Rechne zuerst 1&nbsp;% aus: Teile " + q.G + " durch 100. Nimm das Ergebnis dann mal " + q.p + ".",
      schritte: [
        S("1 % ist der hundertste Teil", q.G + " : 100 = " + dez(q.G / 100)),
        S(q.p + " % sind " + q.p + "-mal so viel", dez(q.G / 100) + " " + MAL + " " + q.p + " = " + dez(q.W)),
        S("In einem Schritt mit der Kommazahl", q.G + " " + MAL + " " + hundertstel(q.p) + " = " + dez(q.W))
      ],
      antwort: pz(q.p) + " von " + q.G + " sind <strong>" + dez(q.W) + "</strong>.",
      bildNachher: function(){ return streifen({ p: q.p, obenP: proz(q.p), untenW: dez(q.W), untenG: String(q.G) }); }
    };
  },
  /* Sachaufgabe mit ganzen Anzahlen */
  function(){
    var ps = [5, 15, 20, 30, 35, 40, 45, 60, 65, 70, 85];
    var k = waehle([
      function(){ var f = ganzFall([120, 160, 180, 200, 240, 280, 320, 400], ps);

var SCHLUESSEL = "mu-" + KONFIG.klasse + "-" + KONFIG.kuerzel + "-v1";
var THEMA_SCHLUESSEL = "mu-" + KONFIG.klasse + "-thema";   /* hell/dunkel, wie auf der Website */
/* Kein fester Schreibtermin: Wer mag, trägt auf der Startseite den eigenen
   ein. Er liegt wie alles andere nur im Speicher des Geräts. */
function klausurTag(){
  if (!stand.termin || !/^\d{4}-\d{2}-\d{2}$/.test(stand.termin)) return null;
  var d = stand.termin.split("-");
  return new Date(+d[0], +d[1] - 1, +d[2]);
}

var stand = laden();

function leererStand(){
  var t = {};
  THEMEN.forEach(function(th){ t[th.id] = { stand: "unbekannt", runden: 0, letzte: null }; });
  return { fassung: 1, diagnose: null, themen: t, check: null, termin: null };
}
function laden(){
  try {
    var roh = localStorage.getItem(SCHLUESSEL);
    if (!roh) return leererStand();
    var s = JSON.parse(roh);
    var frisch = leererStand();
    if (!s || s.fassung !== 1) return frisch;
    /* Neue Themen dürfen später dazukommen, ohne alte Stände zu verlieren. */
    THEMEN.forEach(function(th){ if (!s.themen[th.id]) s.themen[th.id] = frisch.themen[th.id]; });
    return s;
  } catch (e) { return leererStand(); }
}
function sichern(){
  try { localStorage.setItem(SCHLUESSEL, JSON.stringify(stand)); } catch (e) { /* privates Fenster */ }
}

function tageBisKlausur(){
  var tag = klausurTag();
  if (!tag) return null;
  var heute = new Date(); heute.setHours(0,0,0,0);
  return Math.round((tag - heute) / 86400000);
}
function zahlSicher(){
  return THEMEN.filter(function(t){ return stand.themen[t.id].stand === "sicher"; }).length;
}

/* ==========================================================================
   7 — Eine Aufgabe anzeigen und prüfen
   ========================================================================== */

function aufgabeHtml(auf){
  var teile = [];
  if (auf.frage) teile.push('<p class="frage">' + auf.frage + "</p>");
  if (auf.formel) teile.push('<div class="mblock">' + auf.formel + "</div>");
  if (auf.bild) teile.push(auf.bild);
  return teile.join("");
}

function eingabeHtml(auf, nr){
  var e = auf.eingabe;
  if (e.art === "wahl"){
    return '<div class="wahlen" role="group" aria-label="Antwortmöglichkeiten">'
      + e.optionen.map(function(o, i){
          return '<button class="wahl" type="button" data-wahl="' + i + '" aria-pressed="false">'
            + '<span class="buchstabe">' + "ABCD".charAt(i) + '</span><span class="inhalt">' + o + "</span></button>";
        }).join("")
      + "</div>";
  }
  return '<div class="felder">' + e.felder.map(function(f, i){
    return '<span class="feld"><label for="f' + nr + "_" + i + '">' + f.label + "</label>"
      + '<input id="f' + nr + "_" + i + '" type="text" inputmode="text" autocomplete="off" spellcheck="false" data-feld="' + i + '">'
      + (f.einheit ? '<span class="einheit">' + esc(f.einheit) + "</span>" : "") + "</span>";
  }).join("") + "</div>";
}

/* Prüfen: liefert {ok, teile} — teile sagt je Feld, ob es stimmt. */
function pruefen(auf, wurzel){
  var e = auf.eingabe;
  if (e.art === "wahl"){
    var gewaehlt = wurzel.querySelector('.wahl[aria-pressed="true"]');
    if (!gewaehlt) return null;                       /* nichts angekreuzt */
    var i = Number(gewaehlt.getAttribute("data-wahl"));
    return { ok: i === e.richtig, gewaehlt: i, teile: [] };
  }
  var eingaben = [].slice.call(wurzel.querySelectorAll("input[data-feld]"));
  var werte = eingaben.map(function(inp){ return zahlAus(inp.value); });
  if (werte.some(function(w){ return w === null; })) return null;

  if (e.egal && e.felder.length === 2){
    /* Reihenfolge egal: x₁ und x₂ dürfen vertauscht sein. */
    var s0 = e.felder[0].soll, s1 = e.felder[1].soll;
    var t0 = toleranzFuer(e.felder[0]), t1 = toleranzFuer(e.felder[1]);
    var gerade = gleichAuf(werte[0], s0, t0) && gleichAuf(werte[1], s1, t1);
    var quer   = gleichAuf(werte[0], s1, t1) && gleichAuf(werte[1], s0, t0);
    var ok = gerade || quer;
    return { ok: ok, teile: ok ? [true,true]
      : [ gleichAuf(werte[0], s0, t0) || gleichAuf(werte[0], s1, t1),
          gleichAuf(werte[1], s0, t0) || gleichAuf(werte[1], s1, t1) ] };
  }
  var teile = werte.map(function(w, i){ return gleichAuf(w, e.felder[i].soll, toleranzFuer(e.felder[i])); });
  return { ok: teile.every(Boolean), teile: teile };
}

function markieren(auf, wurzel, ergebnis){
  if (auf.eingabe.art === "wahl"){
    [].slice.call(wurzel.querySelectorAll(".wahl")).forEach(function(k, i){
      k.disabled = true;
      if (i === auf.eingabe.richtig) k.setAttribute("data-stand", "richtig");
      else if (i === ergebnis.gewaehlt) k.setAttribute("data-stand", "falsch");
    });
  } else {
    [].slice.call(wurzel.querySelectorAll("input[data-feld]")).forEach(function(inp, i){
      inp.setAttribute("data-stand", ergebnis.teile[i] ? "richtig" : "falsch");
    });
  }
}
function entsperren(wurzel){
  [].slice.call(wurzel.querySelectorAll(".wahl")).forEach(function(k){
    k.disabled = false; k.removeAttribute("data-stand"); k.setAttribute("aria-pressed","false");
  });
  [].slice.call(wurzel.querySelectorAll("input[data-feld]")).forEach(function(inp){
    inp.removeAttribute("data-stand");
  });
}

function schritteHtml(auf){
  var s = auf.schritte.map(function(sch, i){
    return '<li class="schritt"><span class="nr">' + (i+1) + "</span>"
      + '<span class="was">' + sch.was + "</span>"
      + '<span class="rechnung">' + sch.r + "</span></li>";
  }).join("");
  return '<ol class="schritte">' + s + "</ol>"
    + (auf.bildNachher ? auf.bildNachher() : "");
}

/* Wahl-Knöpfe verhalten sich wie Radiobuttons. */
function wahlBinden(wurzel, beiAuswahl){
  [].slice.call(wurzel.querySelectorAll(".wahl")).forEach(function(k){
    k.addEventListener("click", function(){
      if (k.disabled) return;
      [].slice.call(wurzel.querySelectorAll(".wahl")).forEach(function(a){ a.setAttribute("aria-pressed","false"); });
      k.setAttribute("aria-pressed","true");
      if (beiAuswahl) beiAuswahl();
    });
  });
}

function countdownText(){

  if (t === 1) return "Morgen ist deine " + KONFIG.art + ".";
  return "Heute ist deine " + KONFIG.art + ". Viel Erfolg!";
}
