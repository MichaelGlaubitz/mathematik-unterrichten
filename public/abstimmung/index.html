<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Abstimmung</title>
<!-- Formeln: Die Wand schreibt sie als $…$ in die Frage; hier setzt KaTeX
     sie. Fehlt die Bibliothek (kein Netz beim ersten Laden), steht der
     Quelltext da - lesbar, nur nicht schoen. -->
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/contrib/auto-render.min.js"></script>
<style>
  :root{
    --bg:#f6f7fb; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --accent:#4f46e5; --green:#15803d; --gold:#d97706;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1220;--panel:#151d2e;--ink:#e8edf7;--muted:#94a3b8;--line:#26304a}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);
       padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
       display:flex;flex-direction:column;gap:12px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .raum{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .stand{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  h1{font-size:clamp(19px,5.2vw,30px);line-height:1.25;font-weight:800}
  .karten{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center}
  button.wahl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--panel);border:2px solid var(--line);border-radius:16px;
    padding:16px 14px;font:inherit;color:inherit;font-size:clamp(16px,4.2vw,21px);
    line-height:1.3;cursor:pointer;transition:border-color .15s,background .15s}
  button.wahl .bst{flex:0 0 auto;width:2em;height:2em;border-radius:12px;background:#eef2ff;
    color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center}
  @media (prefers-color-scheme:dark){button.wahl .bst{background:#25306b;color:#c7d2fe}}
  button.wahl[aria-pressed="true"]{border-color:var(--green);background:#f0fdf4}
  @media (prefers-color-scheme:dark){button.wahl[aria-pressed="true"]{background:#10301d}}
  button.wahl[aria-pressed="true"] .bst{background:var(--green);color:#fff}
  button.wahl:disabled{opacity:.55;cursor:default}
  .hinweis{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;color:var(--muted);font-size:15px;line-height:1.45;text-align:center}
  .hinweis b{color:var(--ink)}
  .fuss{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
  .warte{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);
    margin-right:6px;vertical-align:1px;animation:blink 1.4s infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  .fehler{color:#b91c1c}
  /* Grundzustand („Blick nach vorn."): ein Satz, gross, in der Mitte. */
  body.ruhe h1{flex:1;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:clamp(30px,9vw,64px);color:var(--accent)}
  body.ruhe .karten,body.ruhe .hinweis{display:none}
  /* Zeichenauftrag: Das Feld nimmt den ganzen Schirm ein. Die Frage steht
     an der Wand und hier nicht noch einmal. Das Feld bleibt 4:3 wie die
     Kacheln an der Wand (sonst zeigte die Kachel ein gestauchtes Bild);
     die Knoepfe stehen quer rechts daneben, hochkant darunter. Die Groesse
     rechnet passeFeld() aus, weil CSS allein „so gross wie moeglich, aber
     4:3" nicht zuverlaessig kann. */
  /* Die Klasse am body heisst anders als die am Feld - sonst traefe
     .zeichnen{display:none} den body selbst, und die Seite waere leer. */
  .zeichnen{display:none}
  body.zeichenauftrag{overflow:hidden;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none}
  body.zeichenauftrag > header,body.zeichenauftrag h1,
  body.zeichenauftrag .karten,body.zeichenauftrag #hinweis{display:none}
  body.zeichenauftrag .zeichnen{display:flex;flex-direction:column;gap:10px;
    position:fixed;inset:0;background:var(--bg);
    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
            max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  /* Hochkant sitzt das Feld unten, direkt ueber der Knopfleiste; quer mittig. */
  .feldrahmen{flex:1;min-width:0;min-height:0;display:flex;align-items:flex-end;justify-content:center}
  @media (orientation:landscape){ .feldrahmen{align-items:center} }
  .feldinnen{position:relative}
  canvas.feld{display:block;width:100%;height:100%;background:#fff;
    border:2px solid var(--line);border-radius:12px;touch-action:none}
  /* Knopfleiste: nur Symbole, in Gruppen zu hoechstens drei (Werkzeug,
     Dicke, Farben, Rueckgaengig/Wiederherstellen/Loeschen, Vollbild). Hochkant stehen die Gruppen
     nebeneinander unter dem Feld, quer untereinander in einer Spalte
     rechts - dort je Gruppe eine Reihe von drei Knoepfen. Was ein Knopf
     tut, sagen title und aria-label. */
  .werkzeuge{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center}
  .gruppe{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .werkzeuge button{width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;
    border-radius:12px;border:2px solid var(--line);background:var(--panel);color:inherit;
    cursor:pointer;touch-action:manipulation}
  .werkzeuge button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .werkzeuge button.haupt{width:96px;background:var(--accent);border-color:var(--accent);color:#fff}
  .werkzeuge button:disabled{opacity:.5;cursor:default}
  /* Werkzeug und Dicke: ein Umschalter, der gewaehlte ist gefuellt. */
  .werkzeuge button[aria-pressed="true"]{background:#eef2ff;border-color:var(--accent);color:var(--accent)}
  @media (prefers-color-scheme:dark){
    .werkzeuge button[aria-pressed="true"]{background:#25306b;color:#c7d2fe}
  }
  /* Dicke: ein Punkt in der gewaehlten Farbe, so gross wie der Strich,
     auf Weiss wie im Feld - auch im dunklen Modus. */
  .werkzeuge button.dicke,.werkzeuge button.dicke[aria-pressed="true"]{background:#fff}
  .werkzeuge button.dicke[aria-pressed="true"]{border-width:3px}
  .werkzeuge button.dicke .punkt{display:block;border-radius:50%;background:var(--dfarbe,#0f172a)}
  /* Farben: runde Felder, das gewaehlte mit dickem Rand. */
  .werkzeuge button.farbe{border-radius:50%;border:3px solid var(--line)}
  .werkzeuge button.farbe[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--panel)}
  #zhinweis{order:-1;flex-basis:100%;text-align:center;font-size:14px;line-height:1.35;
    color:var(--muted);min-height:1.35em}
  #zhinweis b{color:var(--ink)}
  #zhinweis.fehler{color:#b91c1c}
  @media (orientation:landscape){
    body.zeichenauftrag .zeichnen{flex-direction:row}
    .werkzeuge{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;
      gap:12px;width:160px;flex:0 0 auto;overflow-y:auto}
    .gruppe{display:grid;grid-template-columns:repeat(3,48px);justify-content:center}
    #zhinweis{order:0;flex-basis:auto;text-align:left}
    .werkzeuge button.haupt{width:100%;margin-top:auto;flex:0 0 48px}
  }
  /* Texteingabe: sitzt genau dort, wo der Text ins Bild kommt; Schrift
     und Farbe setzt textAn(). Gestrichelter Rand, damit man sieht, wo
     man schreibt. */
  .textfeld{position:absolute;margin:0;padding:0;border:0;border-radius:0;background:transparent;
    outline:2px dashed var(--accent);outline-offset:3px;line-height:1;
    -webkit-user-select:text;user-select:text}
  /* Namentliche Runde: ein graues Kaestchen oben links fuer die
     Schueler-ID. Es liegt UEBER dem Feld und laesst die Stifte durch
     (pointer-events), gehoert also nicht zur Zeichnung - der Radierer und
     „Alles loeschen" nehmen es nicht mit. Ins abgeschickte Bild kommt es
     erst in bildDaten(), genau an dieselbe Stelle. multiply laesst die
     Schrift darin in voller Farbe stehen. Masse in Prozent von 640 x 480:
     88 Bildpunkte Kante, 8 Abstand vom Rand. */
  .idk{position:absolute;display:none;left:1.25%;top:1.667%;width:13.75%;height:18.333%;
    border-radius:6px;background:#d1d5db;mix-blend-mode:multiply;pointer-events:none}
  .idk span{position:absolute;left:6%;top:3%;font:700 11px/1 -apple-system,Segoe UI,Roboto,sans-serif;
    color:#6b7280}
  .feldinnen.namentlich .idk{display:block}
  /* Beim Radieren zeigt ein Ring, wie gross der Radierer ist. */
  .ring{position:absolute;border:2px solid var(--accent);border-radius:50%;
    pointer-events:none;display:none;transform:translate(-50%,-50%)}
</style>
</head>
<body>

<header>
  <span class="raum" id="raum">–</span>
  <span class="stand" id="stand"></span>
</header>

<h1 id="frage">Abstimmung</h1>
<div class="karten" id="karten"></div>
<div class="zeichnen" id="zeichnen">
  <div class="feldrahmen" id="feldrahmen">
    <div class="feldinnen" id="feldinnen">
      <canvas class="feld" id="feld" width="1280" height="960" aria-label="Zeichenfeld"></canvas>
      <div class="idk"><span>ID</span></div>
      <div class="ring" id="ring"></div>
      <input type="text" class="textfeld" id="textfeld" hidden aria-label="Text"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>
  <div class="werkzeuge">
    <div class="gruppe">
      <button type="button" class="art" id="stift" aria-pressed="true" title="Stift" aria-label="Stift">
        <svg viewBox="0 0 24 24"><path d="M4 20l4.5-1L19 8.5 15.5 5 5 15.5z"/><path d="M13.5 7l3.5 3.5"/></svg></button>
      <button type="button" class="art" id="radierer" aria-pressed="false" title="Radierer" aria-label="Radierer">
        <svg viewBox="0 0 24 24"><path d="M7 20h13"/><path d="M4.6 13.6l8.2-8.2a2 2 0 0 1 2.8 0l3 3a2 2 0 0 1 0 2.8L10.4 19.4a2 2 0 0 1-1.4.6H8.2a2 2 0 0 1-1.4-.6l-2.2-2.2a2 2 0 0 1 0-2.8z"/><path d="M9 9.2l5.8 5.8"/></svg></button>
      <button type="button" class="art" id="textknopf" aria-pressed="false" title="Text mit der Tastatur" aria-label="Text">
        <svg viewBox="0 0 24 24"><path d="M5 7V4h14v3"/><path d="M12 4v16"/><path d="M9 20h6"/></svg></button>
    </div>
    <div class="gruppe" id="dicken"></div>
    <div class="gruppe" id="farben"></div>
    <div class="gruppe">
      <button type="button" id="zurueck" title="Rückgängig" aria-label="Rückgängig" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" id="vor" title="Wiederherstellen" aria-label="Wiederherstellen" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button type="button" id="loeschen" title="Alles löschen" aria-label="Alles löschen">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg></button>
    </div>
    <div class="gruppe">
      <button type="button" id="vollbild" hidden title="Vollbild" aria-label="Vollbild"></button>
    </div>
    <div id="zhinweis" aria-live="polite"></div>
    <button type="button" class="haupt" id="senden" title="Abschicken" aria-label="Abschicken">
      <svg viewBox="0 0 24 24"><path d="M21 3L3 10.5l7 3 3 7z"/><path d="M21 3L10 13.5"/></svg></button>
  </div>
</div>
<div class="hinweis" id="hinweis"><span class="warte"></span>Verbinde …</div>

<!-- Kein Fusstext: Er drängte sich auf kleinen Geräten an den Knopf
     „Abschicken". Was gespeichert wird, steht in der Anleitung des
     Dienstes und auf der QR-Folie der Wand. -->

<script>
"use strict";
/* ------------------------------------------------------------------
   Abstimmungsseite fuer die Schuelergeraete.

   Sie kennt weder die richtige Antwort noch die Verteilung der
   Stimmen — beides gibt der Dienst nur gegen den Lehrerschluessel
   heraus. Hier laeuft nur: Frage holen, Antwort schicken.

   Adresse des Dienstes: ?dienst=… in der URL, sonst der eingebaute
   Wert unten. So laesst sich fuer eine Vertretungsstunde auch ein
   anderer (etwa der lokale) Dienst ansteuern, ohne die Seite neu
   auszuliefern.
   ------------------------------------------------------------------ */
const P = new URLSearchParams(location.search);
const DIENST = (P.get("dienst") || "https://abstimmung.michaelglaubitz-barton.workers.dev")
                 .replace(/\/+$/, "");
const RAUM = (P.get("raum") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 24);

const BUCHSTABEN = ["A", "B", "C", "D"];
const $ = id => document.getElementById(id);

/* Geraetekennung: einmal wuerfeln, im Browser behalten. Kein Bezug zu
   einer Person — sie sorgt nur dafuer, dass ein Gerät eine Stimme hat. */
function geraet(){
  let g = null;
  try { g = localStorage.getItem("abstimmung-geraet"); } catch(e){}
  if (!g){
    g = ([1e7]+"").replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16))
      + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem("abstimmung-geraet", g); } catch(e){}
  }
  return g;
}
const GERAET = geraet();

let stand = { schluessel: "", offen: false };
let meineWahl = null;
let fehlerAmStueck = 0;

/* $…$ im Text setzen - wenn KaTeX da ist. Liefert, ob gesetzt wurde:
   Die Bibliothek laedt verzoegert, die erste Abfrage kommt oft vorher.
   Wer dann nicht setzen konnte, merkt sich das nicht als erledigt. */
function setzeTex(el){
  if (typeof renderMathInElement !== "function") return false;
  try {
    renderMathInElement(el, { delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "$", right: "$", display: false }], throwOnError: false });
  } catch (e) {}
  return true;
}
/* Sobald KaTeX da ist: nachsetzen, was vorher roh stehen blieb. */
window.addEventListener("load", () => {
  document.querySelectorAll("[data-roh-offen]").forEach(el => {
    if (setzeTex(el)) delete el.dataset.rohOffen;
  });
});

/* Im Zeichenauftrag ist der Hinweiskasten ausgeblendet; dort steht derselbe
   Text klein in der Knopfleiste (#zhinweis). */
function zeigeHinweis(html, klasse){
  $("hinweis").className = "hinweis" + (klasse ? " " + klasse : "");
  $("hinweis").innerHTML = html;
  $("hinweis").hidden = false;
  $("zhinweis").className = klasse || "";
  $("zhinweis").innerHTML = html;
}

function baueKarten(optionen){
  const box = $("karten");
  box.textContent = "";
  optionen.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "wahl";
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    const bst = document.createElement("span");
    bst.className = "bst";
    bst.textContent = BUCHSTABEN[i] || (i + 1);
    const t = document.createElement("span");
    t.textContent = text;                       /* Text, kein HTML */
    if (!setzeTex(t) && text.includes("$")) t.dataset.rohOffen = "1";
    b.append(bst, t);
    b.onclick = () => waehle(i);
    box.append(b);
  });
}

function malWahl(){
  [...$("karten").children].forEach((b, i) => {
    b.setAttribute("aria-pressed", String(i === meineWahl));
    b.disabled = !stand.offen;
  });
}

async function waehle(i){
  const vorher = meineWahl;
  meineWahl = i;                                 /* sofort anzeigen */
  malWahl();
  try {
    const a = await fetch(DIENST + "/v1/raum/" + RAUM + "/stimme", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ geraet: GERAET, wahl: i, schluessel: stand.schluessel }),
    });
    const d = await a.json();
    if (!d.ok){
      meineWahl = vorher; malWahl();
      zeigeHinweis(d.grund === "zu"
        ? "Die Abstimmung ist <b>geschlossen</b>."
        : "Das kam nicht an. Gleich noch einmal versuchen.", "fehler");
    } else {
      zeigeHinweis("Deine Antwort ist da: <b>" + (BUCHSTABEN[i] || i + 1) + "</b>. "
                   + "Du darfst sie ändern, solange die Frage offen ist.");
    }
  } catch (e){
    meineWahl = vorher; malWahl();
    zeigeHinweis("Keine Verbindung. Die Antwort wurde <b>nicht</b> gezählt.", "fehler");
  }
}

async function hole(){
  try {
    const a = await fetch(DIENST + "/v1/raum/" + RAUM + "?geraet=" + encodeURIComponent(GERAET),
                          { cache: "no-store" });
    const d = await a.json();
    fehlerAmStueck = 0;
    if (!d.ok) return;
    $("stand").textContent = d.abgestimmt ? d.abgestimmt + " haben abgestimmt" : "";
    if (d.schluessel !== stand.schluessel){      /* neue Frage: alles zurueck */
      meineWahl = null;
      stand.schluessel = d.schluessel;
      baueKarten(d.optionen || []);
      $("hinweis").hidden = true;
      $("zhinweis").textContent = "";
      feldLeeren();
      waehleWerkzeug("stift");
      meinBildDa = false;
    }
    stand.offen = d.offen;
    /* Zeichenauftrag statt Frage: Feld und Knoepfe statt Karten. */
    const zeichnen = d.art === "zeichnen";
    document.body.classList.toggle("zeichenauftrag", zeichnen);
    setzeNamentlich(zeichnen && !!d.namentlich);
    if (zeichnen && !d.hinweis){
      if (d.meins) meinBildDa = true;
      zeichnenStand(d);
      return;
    }
    /* Grundzustand: Die Wand hat „Blick nach vorn." ausgerufen. Dann steht
       nur dieser Satz da - keine Karten, kein Zaehler, kein Warten. Die
       Karten bleiben im Dokument, damit eine danach wieder geoeffnete
       Frage die eigene Wahl noch zeigt. */
    document.body.classList.toggle("ruhe", !!d.hinweis);
    if (d.hinweis){
      $("frage").textContent = d.hinweis;
      $("frage").dataset.roh = "";            /* danach wird die Frage neu gesetzt */
      $("stand").textContent = "";
      $("hinweis").hidden = true;
      return;
    }
    const frageText = d.frage || (d.offen ? "Frage läuft" : "Gleich geht es los");
    if ($("frage").dataset.roh !== frageText){
      $("frage").textContent = frageText;
      /* Erst als erledigt merken, wenn gesetzt ist - sonst beim naechsten
         Abruf noch einmal, dann ist KaTeX da. */
      if (setzeTex($("frage")) || !frageText.includes("$"))
        $("frage").dataset.roh = frageText;
    }
    if (!d.optionen || !d.optionen.length){
      $("karten").textContent = "";
      zeigeHinweis('<span class="warte"></span>Warte auf die nächste Frage …');
    } else {
      malWahl();
      if (!d.offen && meineWahl === null)
        zeigeHinweis("Die Abstimmung ist <b>geschlossen</b>.");
    }
  } catch (e){
    if (++fehlerAmStueck === 3)
      zeigeHinweis("Keine Verbindung zum Dienst.<br>Ist das WLAN an?", "fehler");
  }
}

/* ------------------------------------------------------------------
   Zeichenauftrag. Das Feld rechnet intern mit 1280 x 960 Bildpunkten,
   damit die Schrift auch auf dem ganzen Schirm nicht pixelig wird.
   Abgeschickt wird es auf 640 x 480 verkleinert (bildDaten) - so sehen
   alle Kacheln an der Wand gleich aus, und das Bild bleibt unter der
   Grenze des Dienstes. Die Linie ist dick, weil eine Kachel dort klein
   ist: 7 Bildpunkte im abgeschickten Bild.
   ------------------------------------------------------------------ */
const feld = $("feld");
const ctx = feld.getContext("2d");
const MASS = feld.width / 640;                  /* intern : abgeschickt */
let leerBild = true, meinBildDa = false;

/* Radieren heisst: mit Weiss uebermalen, breit. Das Bild ist ohnehin ein
   weisses PNG - an der Wand sieht man keinen Unterschied zu nie Gemaltem. */
const RADIER_BREITE = 36 * MASS;
/* Stiftdicken in Bildpunkten des abgeschickten Bildes; mittel ist die
   alte feste Dicke und vorgewaehlt. Duenner als 4 liest man an der Wand
   kaum noch. */
const DICKEN = [[4, "dünn"], [7, "mittel"], [12, "dick"]];
let stiftBreite = 7 * MASS;
const FARBEN = [["#0f172a", "Schwarz"], ["#2563eb", "Blau"], ["#dc2626", "Rot"],
                ["#16a34a", "Grün"], ["#ea580c", "Orange"], ["#9333ea", "Lila"]];
let farbe = FARBEN[0][0];
let modus = "stift";                            /* "stift" | "radierer" | "text" */

function waehleWerkzeug(m){
  modus = m;
  $("stift").setAttribute("aria-pressed", String(modus === "stift"));
  $("radierer").setAttribute("aria-pressed", String(modus === "radierer"));
  $("textknopf").setAttribute("aria-pressed", String(modus === "text"));
  /* Die Farbe gilt fuer Stift und Text; beim Radieren ist keine gewaehlt. */
  [...$("farben").children].forEach(b =>

$("radierer").onclick = () => waehleWerkzeug("radierer");
$("textknopf").onclick = () => waehleWerkzeug("text");

/* --- Text -------------------------------------------------------------
   Die iPads haben eine Hardware-Tastatur; die Bildschirmtastatur bleibt
   damit weg. Antippen setzt ein Eingabefeld an die Stelle, Enter schreibt
   den Text in der gewaehlten Farbe ins Bild. Danach gehoert er zum Bild
   wie ein Strich - der Radierer nimmt ihn wieder weg. Esc verwirft.
   Tippt man woanders hin oder auf einen Knopf, wird das Offene vorher
   gesetzt, damit nichts Geschriebenes verloren geht. Was nicht mehr in
   die Zeile passt, bricht am rechten Rand um. */
const TEXT_GROESSE = 28 * MASS;                 /* 28 Bildpunkte im abgeschickten Bild */
const SCHRIFTART = "-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
const textfeld = $("textfeld");
let textOrt = null, textFarbe = farbe;

function textAn(p){
  textFertig();
  /* Nicht ganz am rechten Rand anfangen - sonst passt kein Wort hin. */
  textOrt = [Math.min(p[0], feld.width * 0.75), p[1]];
  textFarbe = farbe;
  const r = feld.getBoundingClientRect(), s = r.width / feld.width;
  const h = TEXT_GROESSE * 1.3 * s;
  textfeld.style.font = "600 " + (TEXT_GROESSE * s) + "px " + SCHRIFTART;
  textfeld.style.color = textFarbe;
  textfeld.style.left = textOrt[0] * s + "px";
  textfeld.style.top = (textOrt[1] * s - h / 2) + "px";
  textfeld.style.height = h + "px";
  textfeld.style.width = (r.width - textOrt[0] * s - 6) + "px";
  textfeld.value = "";
  textfeld.hidden = false;
  textfeld.focus();
}
function umbrechen(text, breite){
  const zeilen = [];
  let z = "";
  for (const w of text.split(/\s+/)){
    const probe = z ? z + " " + w : w;
    if (z && ctx.measureText(probe).width > breite){ zeilen.push(z); z = w; }
    else z = probe;
  }
  if (z) zeilen.push(z);
  return zeilen;
}
function textFertig(){
  if (!textOrt) return;
  const ort = textOrt, text = textfeld.value.trim();
  textOrt = null;                               /* vor blur - sonst ruft blur hier erneut an */
  textfeld.hidden = true;
  textfeld.blur();
  if (!text) return;
  ctx.save();
  ctx.font = "600 " + TEXT_GROESSE + "px " + SCHRIFTART;
  ctx.fillStyle = textFarbe;
  ctx.textBaseline = "middle";
  const zeilen = umbrechen(text, feld.width - ort[0] - 8 * MASS);
  const oben = ort[1] - TEXT_GROESSE;
  schritt(kasten(ort[0] - 4, oben, feld.width,
                 ort[1] + (zeilen.length - 1) * TEXT_GROESSE * 1.25 + TEXT_GROESSE), () => {
    zeilen.forEach((z, i) => ctx.fillText(z, ort[0], ort[1] + i * TEXT_GROESSE * 1.25));
    leerBild = false;
  });
  ctx.restore();
}
function textAbbrechen(){
  textOrt = null;
  textfeld.value = "";
  textfeld.hidden = true;
  textfeld.blur();
}
textfeld.addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); textFertig(); }
  else if (e.key === "Escape"){ e.preventDefault(); textAbbrechen(); }
});
textfeld.addEventListener("blur", textFertig);

function zeigeRing(e){
  const ring = $("ring");
  if (modus !== "radierer" || !e){ ring.style.display = "none"; return; }
  const r = feld.getBoundingClientRect();
  const d = RADIER_BREITE * r.width / feld.width;
  ring.style.width = ring.style.height = d + "px";
  ring.style.left = (e.clientX - r.left) + "px";
  ring.style.top = (e.clientY - r.top) + "px";
  ring.style.display = "block";
}

/* So gross wie moeglich, aber 4:3 - bei jeder Groessenaenderung neu,
   also auch beim Drehen des iPads und beim Wechsel ins Vollbild. Das
   Bild selbst bleibt dabei stehen: Nur die Anzeige wird gestreckt. */
function passeFeld(){
  const r = $("feldrahmen").getBoundingClientRect();
  const b = Math.floor(Math.min(r.width, r.height * 4 / 3));
  $("feldinnen").style.width = b + "px";
  $("feldinnen").style.height = Math.floor(b * 3 / 4) + "px";
}
if (window.ResizeObserver) new ResizeObserver(passeFeld).observe($("feldrahmen"));
window.addEventListener("resize", passeFeld);

/* --- Rueckgaengig und Wiederherstellen --------------------------------
   Ein Schritt ist ein Strich, ein gesetzter Text oder „Alles loeschen".
   Gespeichert wird nicht das ganze Bild (1280 x 960 sind fast 5 MB je
   Stand - zu viel fuer ein iPad), sondern nur der Ausschnitt, den der
   Schritt beruehrt hat, einmal davor und einmal danach. Zurueck legt das
   Davor wieder hin, vor das Danach. Wer nach einem Zurueck neu malt,
   verwirft die Schritte, die noch vor ihm lagen. Eine neue Frage leert
   den Verlauf. Obergrenze: 60 Schritte oder rund 60 MB - was zuerst
   erreicht ist; dann faellt der aelteste heraus. */
const VERLAUF_SCHRITTE = 60, VERLAUF_BYTES = 60e6;
let verlauf = [], wiederholbar = [];

function kasten(x0, y0, x1, y1){
  const x = Math.max(0, Math.floor(x0)), y = Math.max(0, Math.floor(y0));
  const w = Math.min(feld.width, Math.ceil(x1)) - x, h = Math.min(feld.height, Math.ceil(y1)) - y;
  return w > 0 && h > 0 ? { x, y, w, h } : null;
}
function ausschnitt(bild, k){
  const aus = new ImageData(k.w, k.h);
  for (let y = 0; y < k.h; y++){
    const von = ((k.y + y) * bild.width + k.x) * 4;
    aus.data.set(bild.data.subarray(von, von + k.w * 4), y * k.w * 4);
  }
  return aus;
}
function merke(s){
  verlauf.push(s);
  wiederholbar = [];
  let bytes = verlauf.reduce((n, v) => n + v.vor.data.length * 2, 0);
  while (verlauf.length > VERLAUF_SCHRITTE || (verlauf.length > 1 && bytes > VERLAUF_BYTES))
    bytes -= verlauf.shift().vor.data.length * 2;
  verlaufKnoepfe();
}
/* Schritt mit vorab bekanntem Ausschnitt (Text, Alles loeschen). */
function schritt(k, malen){
  if (!k){ malen(); return; }
  const leerVor = leerBild, vor = ctx.getImageData(k.x, k.y, k.w, k.h);
  malen();
  merke({ x: k.x, y: k.y, vor, nach: ctx.getImageData(k.x, k.y, k.w, k.h),
          leerVor, leerNach: leerBild });
}
function zurueck(){
  if (aktiv !== null || !verlauf.length) return;
  const s = verlauf.pop();
  ctx.putImageData(s.vor, s.x, s.y);
  leerBild = s.leerVor;
  wiederholbar.push(s);
  verlaufKnoepfe();
}
function vorwaerts(){
  if (aktiv !== null || !wiederholbar.length) return;
  const s = wiederholbar.pop();
  ctx.putImageData(s.nach, s.x, s.y);
  leerBild = s.leerNach;
  verlauf.push(s);
  verlaufKnoepfe();
}
function verlaufKnoepfe(){
  $("zurueck").disabled = !stand.offen || !verlauf.length;
  $("vor").disabled = !stand.offen || !wiederholbar.length;
}
$("zurueck").onclick = zurueck;
$("vor").onclick = vorwaerts;
/* Hardware-Tastatur: Cmd/Strg+Z zurueck, mit Umschalt (oder Strg+Y)
   wieder vor. Nicht im Textfeld - dort gilt sein eigenes Rueckgaengig. */
document.addEventListener("keydown", e => {
  if (!document.body.classList.contains("zeichenauftrag") || !stand.offen) return;
  if (e.target === textfeld || !(e.metaKey || e.ctrlKey)) return;
  const t = e.key.toLowerCase();
  if (t === "z" && !e.shiftKey){ e.preventDefault(); zurueck(); }
  else if ((t === "z" && e.shiftKey) || t === "y"){ e.preventDefault(); vorwaerts(); }
});

function feldLeeren(){
  textAbbrechen();
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, feld.width, feld.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  leerBild = true;
  verlauf = []; wiederholbar = [];
  verlaufKnoepfe();
}
/* „Alles loeschen" ist ein Schritt wie jeder andere - aus Versehen
   getippt, holt Zurueck das Bild wieder. */
function allesLoeschen(){
  textAbbrechen();
  if (leerBild) return;
  schritt(kasten(0, 0, feld.width, feld.height), () => {
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, feld.width, feld.height);
    leerBild = true;
  });
}
function punkt(e){
  const r = feld.getBoundingClientRect();
  return [(e.clientX - r.left) * feld.width / r.width,
          (e.clientY - r.top) * feld.height / r.height];
}

/* --- Der Strich -------------------------------------------------------
   Frueher wurde bei jeder Bewegung der ganze bisherige Strich neu
   gezogen; bei langen Strichen wurde das zaeh. Jetzt kommt je Bewegung
   nur das neue Stueck dazu, als Kurve durch die Mittelpunkte - das
   glaettet die Ecken. getCoalescedEvents liefert die Zwischenpunkte, die
   der Apple Pencil zwischen zwei Bildern des Schirms misst.

   Handballen: Wer mit dem Stift schreibt, legt die Hand ab. Eine
   Beruehrung mit dem Finger zaehlt deshalb nicht, solange der Stift
   gerade (bis 2 s zuvor) im Einsatz war; und setzt der Stift auf,
   waehrend schon ein Finger malt, wird dessen Strich zurueckgenommen. */
let aktiv = null, aktivArt = "", p0 = null, m0 = null;
let stiftZuletzt = 0;
/* Fuer Rueckgaengig: das ganze Bild vor dem Strich (auch die Rueckfalllage
   fuer den Handballen) und der Kasten, den der Strich bisher beruehrt hat. */
let vorStrich = null, leerVorStrich = true, strichKasten = null;

function strichStil(){
  const weg = modus === "radierer";
  ctx.lineWidth = weg ? RADIER_BREITE : stiftBreite;
  ctx.strokeStyle = ctx.fillStyle = weg ? "#fff" : farbe;
}
function dehne(p){
  const r = ctx.lineWidth / 2 + 2, k = strichKasten;
  if (!k){ strichKasten = [p[0] - r, p[1] - r, p[0] + r, p[1] + r]; return; }
  k[0] = Math.min(k[0], p[0] - r); k[1] = Math.min(k[1], p[1] - r);
  k[2] = Math.max(k[2], p[0] + r); k[3] = Math.max(k[3], p[1] + r);
}
function weiter(p){
  const m = [(p0[0] + p[0]) / 2, (p0[1] + p[1]) / 2];
  ctx.beginPath(); ctx.moveTo(m0[0], m0[1]);
  ctx.quadraticCurveTo(p0[0], p0[1], m[0], m[1]); ctx.stroke();
  dehne(p);
  m0 = m; p0 = p;
}
feld.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (!stand.offen) return;
  if (modus === "text"){ if (aktiv === null) textAn(punkt(e)); return; }
  const stift = e.pointerType === "pen";
  if (stift) stiftZuletzt = Date.now();
  else if (e.pointerType === "touch" && Date.now() - stiftZuletzt < 2000) return;
  if (aktiv !== null){
    if (!(stift && aktivArt === "touch")) return;   /* ein Strich zur Zeit */
    ctx.putImageData(vorStrich, 0, 0);              /* Handballen zuruecknehmen */
    leerBild = leerVorStrich;
  } else {
    vorStrich = ctx.getImageData(0, 0, feld.width, feld.height);
    leerVorStrich = leerBild;
  }
  strichKasten = null;
  aktiv = e.pointerId; aktivArt = e.pointerType;
  try { feld.setPointerCapture(e.pointerId); } catch (_){}
  strichStil();
  p0 = m0 = punkt(e);
  ctx.beginPath(); ctx.arc(p0[0], p0[1], ctx.lineWidth / 2, 0, 2 * Math.PI); ctx.fill();
  dehne(p0);
  if (modus === "stift") leerBild = false;
  zeigeRing(e);
});
feld.addEventListener("pointermove", e => {
  if (e.pointerId !== aktiv) return;
  if (aktivArt === "pen") stiftZuletzt = Date.now();
  const liste = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const z of (liste.length ? liste : [e])) weiter(punkt(z));
  zeigeRing(e);
});
const malEnde = e => {
  if (e.pointerId !== aktiv) return;
  ctx.beginPath(); ctx.moveTo(m0[0], m0[1]); ctx.lineTo(p0[0], p0[1]); ctx.stroke();
  if (aktivArt === "pen") stiftZuletzt = Date.now();
  aktiv = null;
  const k = strichKasten && kasten(...strichKasten);
  if (k) merke({ x: k.x, y: k.y, vor: ausschnitt(vorStrich, k),
                 nach: ctx.getImageData(k.x, k.y, k.w, k.h),
                 leerVor: leerVorStrich, leerNach: leerBild });
  vorStrich = null; strichKasten = null;
  zeigeRing(null);
};
feld.addEventListener("pointerup", malEnde);
feld.addEventListener("pointercancel", malEnde);
$("loeschen").onclick = allesLoeschen;

/* --- Vollbild ---------------------------------------------------------
   Blendet die Adressleiste aus. Der Knopf erscheint nur, wo der Browser
   es kann (iPad ja, iPhone nein). */
const WURZEL = document.documentElement;
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) $("vollbild").hidden = false;
const imVollbild = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
$("vollbild").onclick = () => {

      ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
      : (WURZEL.requestFullscreen || WURZEL.webkitRequestFullscreen).call(WURZEL);
    if (r && r.catch) r.catch(() => {});
  } catch (_){}
};
/* Vier Ecken nach aussen: Vollbild an; nach innen: wieder aus. */
const ECKEN_AUS = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ECKEN_EIN = '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const vollbildText = () => {

document.addEventListener("fullscreenchange", vollbildText);
document.addEventListener("webkitfullscreenchange", vollbildText);

/* --- Namentliche Runde ------------------------------------------------
   Die Wand schaltet sie ein; dann steht oben links ein graues Kaestchen
   fuer die Schueler-ID (zwei handgeschriebene Ziffern). Im abgeschickten
   Bild liegt es an derselben Stelle wie auf dem Schirm (CSS .idk) -
   Kante 88, Abstand 8, gemessen in 640 x 480. */
const ID_KANTE = 88, ID_RAND = 8;
let namentlich = false;

function setzeNamentlich(an){
  if (an === namentlich) return;
  namentlich = an;
  $("feldinnen").classList.toggle("namentlich", an);
  if (an) zeigeHinweis("Schreib deine <b>Schüler-ID</b> in das graue Kästchen oben links.");
}
function idKaestchen(x, s){
  const k = ID_KANTE * s, r = ID_RAND * s;
  x.save();
  x.globalCompositeOperation = "multiply";
  x.fillStyle = "#d1d5db";
  x.fillRect(r, r, k, k);
  x.globalCompositeOperation = "source-over";
  x.fillStyle = "#6b7280";
  x.font = "700 " + Math.round(9 * s) + "px sans-serif";
  x.textBaseline = "top";
  x.fillText("ID", r + 5 * s, r + 3 * s);
  x.restore();
}

/* Verkleinert auf 640 x 480. Passt ein sehr buntes Bild dann noch nicht
   unter die Grenze des Dienstes (160 000 Zeichen), wird es kleiner. */
function bildDaten(){
  for (const b of [640, 560, 480]){
    const c = document.createElement("canvas");
    c.width = b; c.height = b * 3 / 4;
    const x = c.getContext("2d");
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high";
    x.drawImage(feld, 0, 0, c.width, c.height);
    if (namentlich) idKaestchen(x, b / 640);
    const d = c.toDataURL("image/png");
    if (d.length <= 158000) return d;
  }
  return null;
}

$("senden").onclick = async () => {

function zeichnenStand(d){
  const frageText = d.frage || "Zeichne";
  if ($("frage").dataset.roh !== frageText){
    $("frage").textContent = frageText;
    if (setzeTex($("frage")) || !frageText.includes("$"))

    ? d.eingereicht + (d.eingereicht === 1 ? " Bild da" : " Bilder da") : "";

  $("senden").disabled = !d.offen;
  verlaufKnoepfe();

  else if (!d.offen) zeigeHinweis(d.meins ? "Der Auftrag ist geschlossen. Dein Bild ist da."
                                          : "Der Auftrag ist <b>geschlossen</b>.");

if (!RAUM){
  $("frage").textContent = "Kein Raum angegeben";
  zeigeHinweis("Diese Seite wird über den <b>QR-Code an der Wand</b> geöffnet. "
               + "Scanne ihn noch einmal.", "fehler");
} else {
  $("raum").textContent = "Raum " + RAUM.toUpperCase();

  /* --- Wie oft gefragt wird --------------------------------------------
     Hier stand einmal setInterval(hole, 1500) - unbedingt, rund um die
     Uhr. EIN Geraet macht damit 2400 Anfragen je Stunde; dreissig iPads
     machen 72 000. Der Dienst laeuft auf dem freien Cloudflare-Kontingent
     von 100 000 Anfragen an das Durable Object je Tag, und am 08.09.2026
     war es um 10:46 Uhr aufgebraucht - danach antwortete der Dienst den
     Rest des Tages mit Fehlern. Es war kein Absturz, es war die Rechnung.

     Drei Regeln, die zusammen aus 2400 Anfragen je Stunde einige hundert
     machen:

       Bildschirm aus, anderer Tab   gar nicht fragen. Das ist der groesste
                                     Posten - ein iPad liegt die meiste
                                     Zeit gesperrt in der Tasche, und die
                                     alte Fassung fragte trotzdem weiter.
       Frage offen                   alle 5 Sekunden
       nichts offen                  alle 8 Sekunden; nach 10 Minuten Ruhe
                                     alle 30, nach einer halben Stunde alle
                                     zwei Minuten

     Die Ruhe-Staffel faengt den Fall auf, dass eine Seite nach der Stunde
     offen liegen bleibt. Wer das iPad anfasst, ist sofort zurueck im
     schnellen Takt (visibilitychange) - darauf laeuft es in der Stunde
     ohnehin immer hinaus. */
  const TAKT_OFFEN = 5000, TAKT_RUHE = 8000;
  let zuletztOffen = Date.now(), taktUhr = null, laeuft = false;

  function takt(){
    if (stand.offen) return TAKT_OFFEN;
    const ruhe = Date.now() - zuletztOffen;
    if (ruhe < 10 * 60 * 1000) return TAKT_RUHE;
    if (ruhe < 30 * 60 * 1000) return 30000;
    return 120000;
  }

  async function schleife(){
    if (laeuft) return;                       /* keine zwei Ketten nebeneinander */
    laeuft = true;
    clearTimeout(taktUhr); taktUhr = null;
    try { await hole(); if (stand.offen) zuletztOffen = Date.now(); }
    finally {
      laeuft = false;
      if (!document.hidden) taktUhr = setTimeout(schleife, takt());
    }
  }

  schleife();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ clearTimeout(taktUhr); taktUhr = null; }
    else schleife();                          /* sofort, nicht erst im Takt */
  });
}
</script>
