/* --- Einen Baustein durcharbeiten --------------------------------------- */
var sitzung = null;
var PHASEN = ["Ankommen", "Verstehen", "Beispiel", "Üben", "Re-Test", "Geschafft"];

function phasenleiste(jetzt){
  return '<div class="phasen">' + PHASEN.map(function(p, i){
    return '<span class="phase"' + (i === jetzt ? ' data-jetzt="ja"' : (i < jetzt ? ' data-fertig="ja"' : "")) + ">" + esc(p) + "</span>";
  }).join("") + "</div>";
}

function bausteinOeffnen(id){
  sitzung = { id: id, runde: 0, index: 0, ergebnisse: [], versuch: 0, seite: 0 };
  zeigeAnkommen();
}

function zeigeAnkommen(){
  imTest = false;
  var b = bausteinMit(sitzung.id);
  var s = stand.bausteine[b.id];
  var fehlt = offeneVoraussetzungen(b);
  var gruss;
  if (s.stand === "sicher")
    gruss = "Diesen Baustein hast du schon geschafft. Eine Auffrischung schadet trotzdem nie — du kannst auch direkt zum Re-Test.";
  else if (s.stand === "wackelig")
    gruss = "Im Test war eine von zwei Aufgaben richtig. Der Gedanke ist also da, es fehlt die Sicherheit. Das ist die schnellste Sorte Lücke.";
  else if (s.stand === "offen")
    gruss = "Im Test hat das hier noch nicht geklappt. Kein Grund zur Sorge — wir fangen ganz vorne an, in Ruhe.";
  else
    gruss = "Wir fangen ganz vorne an. Du brauchst nichts mitzubringen außer dem, was in den Bausteinen davor steht.";

  zeige(
    '<div class="karte">'
    + phasenleiste(0)
    + '<span class="pille pille-teal">' + esc((KONFIG.stufen.find(function(st){ return st.id === b.stufe; }) || {}).pille || "") + "</span>"
    + '<h2 style="margin-top:.6rem">' + esc(b.name) + "</h2>"
    + '<p class="leise">' + esc(b.unter) + "</p>"
    + (fehlt.length
        ? '<div class="hinweis hinweis-rot" style="margin-top:1rem"><strong>Tipp:</strong> Dieser Baustein baut auf '
          + fehlt.map(function(v){ return "„" + esc(v.name) + "“"; }).join(" und ") + " auf, und " + (fehlt.length === 1 ? "das sitzt" : "die sitzen")
          + " noch nicht. Du kannst trotzdem hier anfangen — leichter wird es andersherum.</div>"
        : "")
    + '<div class="hinweis hinweis-gold" style="margin-top:1rem">' + gruss + "</div>"
    + "<h3 style=\"margin-top:1.2rem\">Wozu du das brauchst</h3>"
    + "<p>" + b.warum + "</p>"
    + "<h3>Was du danach kannst</h3>"
    + '<ul style="margin:.4rem 0 1rem 1.1rem; padding:0; color:var(--text-leise)">'
    + b.koennen.map(function(k){ return "<li>" + k + "</li>"; }).join("") + "</ul>"
    + '<div class="reihe">'
    + (fehlt.length ? '<button class="knopf knopf-haupt knopf-gross" id="t-vorher" type="button">Erst „' + esc(fehlt[0].name) + "“</button>" : "")
    + '<button class="knopf' + (fehlt.length ? "" : " knopf-haupt knopf-gross") + '" id="t-los" type="button">Los geht\'s</button>'
    + (s.stand === "sicher" ? '<button class="knopf" id="t-direkt" type="button">Direkt zum Re-Test</button>' : "")
    + '<button class="knopf knopf-still" id="t-zurueck" type="button">Zur Übersicht</button>'
    + "</div></div>"
  );
  var v = document.getElementById("t-vorher");
  if (v) v.onclick = function(){ bausteinOeffnen(fehlt[0].id); };
  document.getElementById("t-los").onclick = function(){ sitzung.seite = 0; zeigeLernweg(); };
  var d = document.getElementById("t-direkt");
  if (d) d.onclick = function(){ sitzung.index = 0; sitzung.ergebnisse = []; zeigeRetest(); };
  document.getElementById("t-zurueck").onclick = zeigeKarte;
}

/* Verstehen: eine Seite nach der anderen. Seiten mit Frage lassen sich erst
   nach einer richtigen Antwort verlassen — jede Antwort bekommt ihre
   Begründung, auch die richtige. */
function zeigeLernweg(){
  imTest = false;
  var b = bausteinMit(sitzung.id);
  var n = b.lernweg.length;
  if (sitzung.seite >= n) return zeigeZusammenfassung();
  var seite = b.lernweg[sitzung.seite];
  var fr = seite.frage;
  var reihenfolge = fr ? mische(fr.optionen.map(function(o, i){ return i; })) : [];

  zeige(
    '<div class="karte">'
    + phasenleiste(1)
    + '<div class="reihe" style="justify-content:space-between">'
    + '<span class="leise">' + esc(b.name) + '</span><span class="seitenzahl">Seite ' + (sitzung.seite + 1) + " von " + n + "</span></div>"
    + '<h2 style="margin-top:.5rem">' + esc(seite.titel) + "</h2>"
    + '<div class="lernseite">' + seite.html + "</div>"
    + (fr ? '<div class="hinweis" style="margin-top:1.1rem"><strong>Kurz geprüft:</strong> ' + fr.text + "</div>"
          + (fr.bild || "")
          + '<div class="wahlen" role="group" aria-label="Antwortmöglichkeiten">'
          + reihenfolge.map(function(oi, i){
              return '<button class="wahl" type="button" data-opt="' + oi + '" aria-pressed="false"><span class="buchstabe">'
                + "ABCD".charAt(i) + '</span><span class="inhalt">' + fr.optionen[oi].t + "</span></button>";
            }).join("") + "</div>"
          + '<div id="l-echo"></div>' : "")
    + '<div class="reihe" style="margin-top:1rem">'
    + (sitzung.seite > 0 ? '<button class="knopf knopf-still" id="l-zurueck" type="button">‹ Zurück</button>' : "")
    + '<button class="knopf knopf-haupt" id="l-weiter" type="button"' + (fr ? " disabled" : "") + ">"
    + (sitzung.seite + 1 >= n ? "Zusammenfassung" : "Weiter") + " ›</button>"
    + "</div></div>"
  );
  var weiter = document.getElementById("l-weiter");
  weiter.onclick = function(){ sitzung.seite++; zeigeLernweg(); };
  var z = document.getElementById("l-zurueck");
  if (z) z.onclick = function(){ sitzung.seite--; zeigeLernweg(); };
  if (!fr) return;

  var karte = buehne.querySelector(".karte");
  [].slice.call(karte.querySelectorAll(".wahl")).forEach(function(k){
    k.onclick = function(){
      if (k.disabled) return;
      var o = fr.optionen[Number(k.getAttribute("data-opt"))];
      var echo = document.getElementById("l-echo");
      if (o.ok){
        [].slice.call(karte.querySelectorAll(".wahl")).forEach(function(a){ a.disabled = true; });
        k.setAttribute("data-stand", "richtig");
        echo.innerHTML = '<div class="echo gut"><div class="kopfzeile"><span class="zeichen">✓</span>' + waehle(LOB) + "</div>"
          + "<p>" + o.grund + "</p>" + (fr.danach || "") + "</div>";
        weiter.disabled = false;
        weiter.focus();
      } else {
        k.setAttribute("data-stand", "falsch");
        k.disabled = true;
        echo.innerHTML = '<div class="echo fast"><div class="kopfzeile"><span class="zeichen">~</span>Noch nicht.</div>'
          + "<p>" + o.grund + "</p><p class=\"leise\">Lies die Seite oben noch einmal und wähle dann neu.</p></div>";
      }
    };
  });
}

function zeigeZusammenfassung(){
  var b = bausteinMit(sitzung.id);
  stand.bausteine[b.id].gelesen = true;
  sichern();
  zeige(
    '<div class="karte">'
    + phasenleiste(1)
    + "<h2>" + esc(b.name) + " — das Wichtigste</h2>"
    + '<div class="hinweis"><strong>In einem Satz:</strong> ' + b.merksatz + "</div>"
    + '<div class="hinweis hinweis-rot"><strong>Typischer Stolperstein:</strong> ' + b.stolperstein + "</div>"
    + (b.quellen && b.quellen.length
        ? "<h3 style=\"margin-top:1.1rem\">Noch einmal anders erklärt</h3>"
          + '<p class="leise">Wenn etwas noch unklar ist: Eine andere Stimme hilft oft. Die Links öffnen fremde Seiten.</p>'
          + quellenHtml(b.quellen)
        : "")
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt knopf-gross" id="z-bsp" type="button">Zum Beispiel</button>'
    + '<button class="knopf knopf-still" id="z-nochmal" type="button">Seiten noch einmal</button>'
    + "</div></div>"
  );
  document.getElementById("z-bsp").onclick = zeigeBeispiel;
  document.getElementById("z-nochmal").onclick = function(){ sitzung.seite = 0; zeigeLernweg(); };
}

/* Das Beispiel: vollständig durchgerechnet, Schritt für Schritt aufdeckbar.
   Wer alles auf einmal sieht, liest es nicht. */
function zeigeBeispiel(){
  imTest = false;
  var b = bausteinMit(sitzung.id);
  var auf = b.gen[sitzung.runde % b.gen.length]();
  sitzung.gezeigt = 0;

  zeige(
    '<div class="karte">'
    + phasenleiste(2)
    + "<h2>Ein Beispiel, ganz durchgerechnet</h2>"
    + '<div class="hinweis"><strong>Das Wichtigste in einem Satz:</strong> ' + b.merksatz + "</div>"
    + aufgabeHtml(auf)
    + (auf.eingabe.art === "wahl" || auf.eingabe.art === "zuordnen"
        ? '<p class="leise">Überlege zuerst selbst, was du antworten würdest. Dann deck die Schritte auf.</p>' : "")
    + '<div id="erk-schritte"></div>'
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="e-mehr" type="button">Ersten Schritt zeigen</button>'
    + '<button class="knopf knopf-still" id="e-alles" type="button">Alle Schritte auf einmal</button>'
    + "</div>"
    + '<div class="reihe" style="margin-top:.6rem" id="e-weiter-reihe" hidden>'
    + '<button class="knopf knopf-haupt knopf-gross" id="e-weiter" type="button">Verstanden — jetzt selbst</button>'
    + '<button class="knopf knopf-still" id="e-anders" type="button">Noch ein Beispiel</button>'
    + "</div></div>"
  );

  var ziel = document.getElementById("erk-schritte");
  function nachlegen(){
    var sch = auf.schritte[sitzung.gezeigt];
    ziel.insertAdjacentHTML("beforeend",
      '<ol class="schritte" style="margin-top:0"><li class="schritt"><span class="nr">' + (sitzung.gezeigt+1) + "</span>"
      + '<span class="was">' + sch.was + '</span><span class="rechnung">' + sch.r + "</span></li></ol>");
    sitzung.gezeigt++;
    if (sitzung.gezeigt >= auf.schritte.length) fertig();
    else document.getElementById("e-mehr").textContent = "Nächster Schritt (" + (sitzung.gezeigt+1) + " von " + auf.schritte.length + ")";
  }
  function fertig(){
    document.getElementById("e-mehr").hidden = true;
    document.getElementById("e-alles").hidden = true;
    if (auf.bildNachher) ziel.insertAdjacentHTML("beforeend", auf.bildNachher());
    ziel.insertAdjacentHTML("beforeend", '<div class="echo gut"><p><strong>Ergebnis:</strong> ' + auf.antwort + "</p></div>");
    document.getElementById("e-weiter-reihe").hidden = false;
  }
  document.getElementById("e-mehr").onclick = nachlegen;
  document.getElementById("e-alles").onclick = function(){
    while (sitzung.gezeigt < auf.schritte.length) nachlegen();
  };
  document.getElementById("e-weiter").onclick = function(){
    sitzung.index = 0; sitzung.ergebnisse = []; sitzung.versuch = 0;
    zeigeUeben();
  };
  document.getElementById("e-anders").onclick = function(){ sitzung.runde++; zeigeBeispiel(); };
}

/* Üben: vier Aufgaben, jede Aufgabensorte kommt dran. Hinweis beim ersten,
   ganzer Weg beim zweiten Fehlversuch. Fehler kosten hier nichts. */
var UEBEN_ANZAHL = 4;

function zeigeUeben(){
  imTest = false;
  var b = bausteinMit(sitzung.id);
  if (sitzung.index >= UEBEN_ANZAHL) return zeigeUebergang();
  var auf = b.gen[(sitzung.index + sitzung.runde) % b.gen.length]();
  sitzung.versuch = 0;

  zeige(
    '<div class="karte">'
    + phasenleiste(3)
    + '<div class="reihe" style="justify-content:space-between">'
    + '<span class="pille">Üben · Aufgabe ' + (sitzung.index+1) + " von " + UEBEN_ANZAHL + "</span>"
    + '<span class="leise">' + esc(b.name) + "</span></div>"
    + '<div style="margin-top:.7rem">' + aufgabeHtml(auf) + "</div>"
    + eingabeHtml(auf, "u" + sitzung.index)
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="u-ok" type="button">Prüfen</button>'
    + '<button class="knopf knopf-still" id="u-hilf" type="button">Ich komme nicht weiter</button>'
    + "</div>"
    + '<div id="u-echo"></div>'
    + "</div>"
  );

  var karte = buehne.querySelector(".karte");
  var echo = document.getElementById("u-echo");
  wahlBinden(karte);
  erstesFeld(karte);

  function naechsteKnopf(){
    return '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="u-next" type="button">'
      + (sitzung.index + 1 >= UEBEN_ANZAHL ? "Weiter zum Re-Test" : "Nächste Aufgabe") + "</button></div>";
  }
  function naechsteBinden(){
    document.getElementById("u-ok").disabled = true;
    document.getElementById("u-hilf").hidden = true;
    document.getElementById("u-next").onclick = function(){ sitzung.index++; zeigeUeben(); };
    document.getElementById("u-next").focus();
  }
  function loesungZeigen(vorspann, art, e){
    if (e) markieren(auf, karte, e);
    else if (auf.eingabe.art === "wahl"){
      [].slice.call(karte.querySelectorAll(".wahl")).forEach(function(k, i){
        k.disabled = true;
        if (i === auf.eingabe.richtig) k.setAttribute("data-stand","richtig");
      });
    }
    echo.innerHTML = '<div class="echo ' + art + '">'
      + '<div class="kopfzeile"><span class="zeichen">→</span>' + vorspann + "</div>"
      + grundText(auf, e)
      + schritteHtml(auf)
      + "<p style=\"margin-top:.7rem\"><strong>Antwort:</strong> " + auf.antwort + "</p></div>"
      + naechsteKnopf();
    naechsteBinden();
  }

  document.getElementById("u-ok").onclick = function(){
    var e = pruefen(auf, karte);
    if (!e){
      echo.innerHTML = '<div class="echo"><p>Da fehlt noch eine Antwort — oder eine Eingabe ist keine Zahl. '
        + "Erlaubt sind zum Beispiel " + KONFIG.eingabeBeispiele.map(function(x){ return "<code>" + esc(x) + "</code>"; }).join(", ").replace(/, (?=[^,]*$)/, " oder ") + ".</p></div>";
      return;
    }
    sitzung.versuch++;
    if (e.ok){
      markieren(auf, karte, e);
      echo.innerHTML = '<div class="echo gut"><div class="kopfzeile"><span class="zeichen">✓</span>' + waehle(LOB) + "</div>"
        + "<p>" + auf.antwort + "</p>"
        + '<p style="margin-top:.5rem"><button class="knopf knopf-still" id="u-weg" type="button">Lösungsweg trotzdem ansehen</button></p></div>'
        + '<div id="u-weg-ziel"></div>'
        + naechsteKnopf();
      document.getElementById("u-weg").onclick = function(){
        document.getElementById("u-weg-ziel").innerHTML = schritteHtml(auf);
        document.getElementById("u-weg").hidden = true;
      };
      naechsteBinden();
      return;
    }
    if (sitzung.versuch === 1){
      markieren(auf, karte, e);
      echo.innerHTML = '<div class="echo fast"><div class="kopfzeile"><span class="zeichen">~</span>' + waehle(MUT) + "</div>"
        + grundText(auf, e) + zeilenText(auf, e)
        + "<p><strong>Hinweis:</strong> " + auf.hinweis + "</p></div>"
        + '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="u-retry" type="button">Noch einmal versuchen</button></div>';
      document.getElementById("u-retry").onclick = function(){
        entsperren(karte);
        echo.innerHTML = "";
        erstesFeld(karte);
      };
      return;
    }
    loesungZeigen(waehle(ZWEITER), "nein", e);
  };
  document.getElementById("u-hilf").onclick = function(){
    loesungZeigen("Kein Problem — hier ist der ganze Weg.", "", null);
  };
}

/* Zwischenstopp vor dem Re-Test: kurz Luft holen, klar sagen, was kommt. */
function zeigeUebergang(){
  var b = bausteinMit(sitzung.id);
  zeige(
    '<div class="karte">'
    + phasenleiste(4)
    + "<h2>Jetzt der Re-Test</h2>"
    + '<p class="lead">Vier Aufgaben zu <strong>' + esc(b.name) + "</strong> — neue Zahlen, kein Hinweis, ein Versuch pro Aufgabe. "
    + "Drei richtige genügen, damit der Baustein grün wird.</p>"
    + '<div class="hinweis"><strong>Warum ohne Hilfe?</strong> Weil du erst dann weißt, dass du es kannst, wenn du es einmal allein geschafft hast. '
    + "Geht es schief, ist nichts verloren — dann schauen wir, woran es liegt.</div>"
    + '<div class="reihe">'
    + '<button class="knopf knopf-haupt knopf-gross" id="r-los" type="button">Re-Test starten</button>'
    + '<button class="knopf knopf-still" id="r-mehr" type="button">Lieber noch etwas üben</button>'
    + "</div></div>"
  );
  document.getElementById("r-los").onclick = function(){
    sitzung.index = 0; sitzung.ergebnisse = []; zeigeRetest();
  };
  document.getElementById("r-mehr").onclick = function(){
    sitzung.index = 0; sitzung.runde++; zeigeUeben();
  };
}

var TEST_ANZAHL = 4, TEST_NOETIG = 3;

function zeigeRetest(){
  imTest = true;
  var b = bausteinMit(sitzung.id);
  if (sitzung.index >= TEST_ANZAHL) return retestAuswerten();
  /* Jede Aufgabensorte kommt dran, in zufälliger Reihenfolge. */
  if (sitzung.index === 0){
    var sorten = mische(b.gen.map(function(g, i){ return i; }));
    while (sorten.length < TEST_ANZAHL) sorten.push(rnd(0, b.gen.length - 1));
    sitzung.testplan = mische(sorten.slice(0, TEST_ANZAHL));
  }
  var auf = b.gen[sitzung.testplan[sitzung.index]]();

  var punkte = "";
  for (var i = 0; i < TEST_ANZAHL; i++){
    var s = sitzung.ergebnisse[i];
    punkte += '<span class="punkt"' + (s === undefined ? "" : ' data-stand="' + (s ? "richtig" : "falsch") + '"') + "></span>";
  }

  zeige(
    '<div class="karte">'
    + phasenleiste(4)
    + '<div class="reihe" style="justify-content:space-between">'
    + '<span class="pille pille-teal">Re-Test · ' + (sitzung.index+1) + " von " + TEST_ANZAHL + "</span>"
    + '<span class="punkte" aria-label="bisherige Ergebnisse">' + punkte + "</span></div>"
    + '<div style="margin-top:.7rem">' + aufgabeHtml(auf) + "</div>"
    + eingabeHtml(auf, "r" + sitzung.index)
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="rt-ok" type="button">Antwort abschicken</button></div>'
    + '<div id="rt-echo"></div>'
    + "</div>"
  );

  var karte = buehne.querySelector(".karte");
  wahlBinden(karte);
  erstesFeld(karte);

  document.getElementById("rt-ok").onclick = function(){
    var e = pruefen(auf, karte);
    if (!e){
      document.getElementById("rt-echo").innerHTML =
        '<div class="echo"><p>Bitte fülle jedes Feld aus — oder wähle eine Antwort aus.</p></div>';
      return;
    }
    markieren(auf, karte, e);
    sitzung.ergebnisse.push(e.ok);
    document.getElementById("rt-ok").disabled = true;
    document.getElementById("rt-echo").innerHTML =
      '<div class="echo ' + (e.ok ? "gut" : "nein") + '">'
      + '<div class="kopfzeile"><span class="zeichen">' + (e.ok ? "✓" : "✗") + "</span>"
      + (e.ok ? waehle(LOB) : "Diese nicht.") + "</div>"
      + grundText(auf, e)
      + "<p>" + auf.antwort + "</p>"
      + '<p style="margin-top:.5rem"><button class="knopf knopf-still" id="rt-weg" type="button">Lösungsweg ansehen</button></p></div>'
      + '<div id="rt-weg-ziel"></div>'
      + '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="rt-next" type="button">'
      + (sitzung.index + 1 >= TEST_ANZAHL ? "Auswertung" : "Nächste Aufgabe") + "</button></div>";
    document.getElementById("rt-weg").onclick = function(){
      document.getElementById("rt-weg-ziel").innerHTML = schritteHtml(auf);
      document.getElementById("rt-weg").hidden = true;
    };
    document.getElementById("rt-next").onclick = function(){ sitzung.index++; zeigeRetest(); };
    document.getElementById("rt-next").focus();
  };
}

function retestAuswerten(){
  imTest = false;
  var b = bausteinMit(sitzung.id);
  var richtig = sitzung.ergebnisse.filter(Boolean).length;
  var bestanden = richtig >= TEST_NOETIG;
  var s = stand.bausteine[b.id];
  s.runden++;
  s.letzte = { richtig: richtig, gesamt: TEST_ANZAHL };
  if (bestanden){ s.stand = "sicher"; s.wann = heuteText(); }
  else if (richtig >= 1 && s.stand !== "sicher") s.stand = "wackelig";
  else if (richtig === 0 && s.stand !== "sicher") s.stand = "offen";
  sichern();

  if (bestanden){
    var naechste = naechsterBaustein();
    var schluss = naechste
      ? "Als Nächstes steht <strong>" + esc(naechste.name) + "</strong> an."
      : "Damit sind alle Bausteine grün. Der Gesamt-Check ist jetzt der beste nächste Schritt.";
    zeige(
      '<div class="karte">'
      + phasenleiste(5)
      + '<span class="pille pille-gruen">' + richtig + " von " + TEST_ANZAHL + " richtig</span>"
      + "<h2 style=\"margin-top:.6rem\">" + esc(b.name) + " sitzt.</h2>"
      + '<p class="lead">' + (richtig === TEST_ANZAHL
          ? "Vier von vier — ohne Hinweise, mit neuen Zahlen. Das ist kein Zufall mehr, das ist Können."
          : "Drei von vier ohne Hilfe: Das reicht. Der eine Ausrutscher ist normal und kein Grund, hier länger zu bleiben.") + "</p>"
      + '<div class="hinweis hinweis-gruen"><strong>Du kannst jetzt:</strong><ul style="margin:.4rem 0 0 1.1rem; padding:0">'
      + b.koennen.map(function(k){ return "<li>" + k + "</li>"; }).join("") + "</ul></div>"
      + '<p class="leise">Ein Tipp aus Erfahrung: Komm in ein paar Tagen wieder und nimm „Auffrischen“ in der Übersicht. '
      + "Was man mit Abstand noch einmal kann, bleibt.</p>"
      + "<p>" + schluss + "</p>"
      + '<div class="reihe">'
      + (naechste ? '<button class="knopf knopf-haupt knopf-gross" id="g-next" type="button">Weiter mit ' + esc(naechste.name) + "</button>" : "")
      + '<button class="knopf" id="g-karte" type="button">Zur Übersicht</button>'
      + "</div></div>"
    );
    var n = document.getElementById("g-next");
    if (n) n.onclick = function(){ bausteinOeffnen(naechste.id); };
    document.getElementById("g-karte").onclick = zeigeKarte;
    return;
  }

  /* Nicht bestanden: kein Tadel. Liegt es an einer Voraussetzung, geht es
     dorthin; sonst ein neuer Anlauf über die Seiten und ein anderes Beispiel. */
  sitzung.runde++;
  var fehlt = offeneVoraussetzungen(b);
  var vorher = (b.braucht || []).map(bausteinMit);
  zeige(
    '<div class="karte">'
    + phasenleiste(4)
    + '<span class="pille pille-gold">' + richtig + " von " + TEST_ANZAHL + " richtig</span>"
    + "<h2 style=\"margin-top:.6rem\">Noch nicht — und das ist in Ordnung.</h2>"
    + '<p class="lead">' + (richtig === 2
        ? "Zwei von vier: Die Hälfte stimmt schon. Meistens fehlt genau ein Schritt."
        : "Hier fehlt noch etwas Grundsätzliches. Das heißt nicht, dass du es nicht kannst — sondern dass die Erklärung noch nicht angekommen ist.") + "</p>"
    + (fehlt.length
        ? '<div class="hinweis hinweis-rot"><strong>Wahrscheinlich liegt es davor:</strong> „' + fehlt.map(function(v){ return esc(v.name); }).join("“ und „")
          + "“ " + (fehlt.length === 1 ? "sitzt" : "sitzen") + " noch nicht. Dieser Baustein baut darauf auf.</div>"
        : (vorher.length && richtig < 2
          ? '<div class="hinweis">Manchmal wackelt auch etwas, das schon grün war: Ein kurzer Blick in „' + esc(vorher[0].name) + "“ kann helfen.</div>" : ""))
    + (b.quellen && b.quellen.length ? "<h3>Eine andere Erklärung</h3>" + quellenHtml(b.quellen.slice(0, 2)) : "")
    + '<div class="reihe" style="margin-top:1rem">'
    + (fehlt.length ? '<button class="knopf knopf-haupt knopf-gross" id="w-vorher" type="button">Zu „' + esc(fehlt[0].name) + "“</button>" : "")
    + '<button class="knopf' + (fehlt.length ? "" : " knopf-haupt knopf-gross") + '" id="w-seiten" type="button">Seiten noch einmal lesen</button>'
    + '<button class="knopf" id="w-erk" type="button">Neues Beispiel</button>'
    + '<button class="knopf knopf-still" id="w-karte" type="button">Später weitermachen</button>'
    + "</div></div>"
  );
  var wv = document.getElementById("w-vorher");
  if (wv) wv.onclick = function(){ bausteinOeffnen(fehlt[0].id); };
  document.getElementById("w-seiten").onclick = function(){ sitzung.seite = 0; zeigeLernweg(); };
  document.getElementById("w-erk").onclick = zeigeBeispiel;
  document.getElementById("w-karte").onclick = zeigeKarte;
}

/* --- Gemischte Durchgänge: Auffrischen und Gesamt-Check ------------------
   Beide laufen gleich: Aufgaben ohne Themenansage, eine Antwort je Aufgabe,
   am Ende eine Tabelle je Baustein. Unterschied ist nur die Auswahl. */
var runde = null;
var CHECK_ANZAHL = Math.max(10, BAUSTEINE.length + 2);

function auffrischenStarten(){
  /* Sichere Bausteine, die am längsten zurückliegen, zuerst und doppelt. */
  var sichere = BAUSTEINE.filter(function(b){ return stand.bausteine[b.id].stand === "sicher"; })
    .sort(function(a, b){ return String(stand.bausteine[a.id].wann).localeCompare(String(stand.bausteine[b.id].wann)); });
  var plan = [];
  var i = 0;
  while (plan.length < AUFFRISCHEN_ANZAHL && sichere.length){
    plan.push(sichere[i % sichere.length].id);
    if (plan.length < AUFFRISCHEN_ANZAHL && i < 2) plan.push(sichere[i % sichere.length].id);
    i++;
  }
  runde = { art: "auffrischen", titel: "Auffrischen", plan: mische(plan), index: 0, ergebnisse: [] };
  rundeSchritt();
}
function checkStarten(){
  var plan = BAUSTEINE.map(function(b){ return b.id; });
  var obere = BAUSTEINE.slice(Math.floor(BAUSTEINE.length / 2)).map(function(b){ return b.id; });
  while (plan.length < CHECK_ANZAHL) plan.push(waehle(obere));
  runde = { art: "check", titel: "Gesamt-Check", plan: mische(plan).slice(0, CHECK_ANZAHL), index: 0, ergebnisse: [] };
  rundeSchritt();
}

function rundeSchritt(){
  imTest = true;
  if (runde.index >= runde.plan.length) return rundeAuswerten();
  var b = bausteinMit(runde.plan[runde.index]);
  var auf = waehle(b.gen)();
  var richtigBisher = runde.ergebnisse.filter(function(e){ return e.ok; }).length;

  zeige(
    '<div class="karte">'
    + '<div class="reihe" style="justify-content:space-between">'
    + '<span class="pille pille-teal">' + runde.titel + " · " + (runde.index+1) + " von " + runde.plan.length + "</span>"
    + '<span class="leise">' + richtigBisher + " richtig</span></div>"
    + '<p class="leise" style="margin:.7rem 0 0">Welches Thema? Das musst du hier selbst erkennen.</p>'
    + aufgabeHtml(auf)
    + eingabeHtml(auf, "c" + runde.index)
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="c-ok" type="button">Antwort abschicken</button>'
    + '<button class="knopf knopf-still" id="c-skip" type="button">Überspringen</button></div>'
    + '<div id="c-echo"></div>'
    + "</div>"
  );

  var karte = buehne.querySelector(".karte");
  wahlBinden(karte);
  erstesFeld(karte);

  function weiter(ok){
    runde.ergebnisse.push({ id: b.id, ok: ok });
    runde.index++;
    rundeSchritt();
  }
  document.getElementById("c-ok").onclick = function(){
    var e = pruefen(auf, karte);
    if (!e){
      document.getElementById("c-echo").innerHTML = '<div class="echo"><p>Bitte fülle alle Felder aus oder überspringe die Aufgabe.</p></div>';
      return;
    }
    markieren(auf, karte, e);
    document.getElementById("c-ok").disabled = true;
    document.getElementById("c-skip").hidden = true;
    document.getElementById("c-echo").innerHTML =
      '<div class="echo ' + (e.ok ? "gut" : "nein") + '"><div class="kopfzeile"><span class="zeichen">'
      + (e.ok ? "✓" : "✗") + "</span>" + (e.ok ? waehle(LOB) : "Das gehört zu „" + esc(b.name) + "“ — schau gleich noch einmal hin.") + "</div>"
      + grundText(auf, e)
      + "<p>" + auf.antwort + "</p></div>"
      + '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="c-next" type="button">Weiter</button></div>';
    document.getElementById("c-next").onclick = function(){ weiter(e.ok); };
    document.getElementById("c-next").focus();
  };
  document.getElementById("c-skip").onclick = function(){ weiter(false); };
}

function rundeAuswerten(){
  imTest = false;
  var proB = {};
  runde.ergebnisse.forEach(function(e){
    if (!proB[e.id]) proB[e.id] = { richtig: 0, gesamt: 0 };
    proB[e.id].gesamt++;
    if (e.ok) proB[e.id].richtig++;
  });
  var richtig = runde.ergebnisse.filter(function(e){ return e.ok; }).length;
  var gesamt = runde.plan.length;
  if (runde.art === "check") stand.check = { richtig: richtig, gesamt: gesamt, wann: heuteText() };
  /* Ein Baustein, der im gemischten Durchgang ganz durchfällt, war nur im
     Zusammenhang sicher. Er rutscht auf „wackelig“; wer ihn besteht,
     bekommt ein neues Datum — er zählt dann als frisch aufgefrischt. */
  Object.keys(proB).forEach(function(id){
    var s = stand.bausteine[id];
    if (proB[id].richtig === 0 && s.stand === "sicher") s.stand = "wackelig";
    else if (proB[id].richtig === proB[id].gesamt && s.stand === "sicher") s.wann = heuteText();
  });
  sichern();

  var anteil = richtig / gesamt;
  var urteil;
  if (anteil >= 0.9) urteil = "Das sitzt. Mehr als eine Wiederholung in ein paar Tagen braucht es nicht.";
  else if (anteil >= 0.7) urteil = "Ein gutes Ergebnis. Sieh dir die Wackler unten an — der Rest steht.";
  else if (anteil >= 0.5) urteil = "Die Hälfte und mehr steht. Nimm dir gezielt die Bausteine vor, die unten rot sind.";
  else urteil = "Das war noch schwer. Nimm dir den ersten roten Baustein von oben vor und arbeite ihn fertig — das trägt die anderen mit.";

  var zeilen = BAUSTEINE.filter(function(b){ return proB[b.id]; }).map(function(b){
    var p = proB[b.id];
    var farbe = p.richtig === p.gesamt ? "pille-gruen" : (p.richtig === 0 ? "pille-rot" : "pille-gold");
    return '<tr><td style="text-align:left">' + esc(b.name) + '</td><td><span class="pille ' + farbe + '">'
      + p.richtig + "/" + p.gesamt + "</span></td></tr>";
  }).join("");

  zeige(
    '<div class="karte">'
    + '<span class="pille pille-teal">' + runde.titel + "</span>"
    + "<h2 style=\"margin-top:.6rem\">" + richtig + " von " + gesamt + " richtig</h2>"
    + '<p class="lead">' + urteil + "</p>"
    + '<table class="werte"><tr><th style="text-align:left">Baustein</th><th>Ergebnis</th></tr>' + zeilen + "</table>"
    + '<div class="reihe">'
    + '<button class="knopf knopf-haupt" id="c-karte" type="button">Zur Übersicht</button>'
    + '<button class="knopf" id="c-nochmal" type="button">Noch ein Durchgang</button>'
    + "</div></div>"
  );
  document.getElementById("c-karte").onclick = zeigeKarte;
  document.getElementById("c-nochmal").onclick = runde.art === "check" ? checkStarten : auffrischenStarten;
}

/* ==========================================================================
   9 — Bedienung außen herum
   ========================================================================== */
document.getElementById("knopf-karte").onclick = function(){
  if (imTest && !window.confirm("Den laufenden Test abbrechen?")) return;
  var begonnen = stand.diagnose !== null || BAUSTEINE.some(function(b){ return stand.bausteine[b.id].stand !== "unbekannt" || stand.bausteine[b.id].gelesen; });
  if (begonnen) zeigeKarte(); else zeigeStart();
};
document.getElementById("knopf-buch").onclick = function(){
  if (imTest){
    if (!window.confirm("Nachschlagen beendet den laufenden Test. Trotzdem?")) return;
  }
  zeigeNachschlagen();
};
document.getElementById("knopf-thema").onclick = function(){
  var dunkel = document.documentElement.getAttribute("data-thema") === "dunkel";
  document.documentElement.setAttribute("data-thema", dunkel ? "hell" : "dunkel");
  document.getElementById("knopf-thema").textContent = dunkel ? "☾" : "☀";
  try { localStorage.setItem(THEMA_SCHLUESSEL, dunkel ? "hell" : "dunkel"); } catch (e) {}
};
document.getElementById("knopf-reset").onclick = function(){
  if (!window.confirm("Wirklich alles zurücksetzen? Dein Fortschritt auf diesem Gerät geht dabei verloren.")) return;
  stand = leererStand();
  sichern();
  zeigeStart();
};

/* Enter schickt ab — auf dem iPad spart das den Griff zum Knopf. */
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter" || e.shiftKey || e.ctrlKey || e.metaKey) return;
  var ziel = e.target;
  if (ziel && (ziel.tagName === "BUTTON" || ziel.tagName === "SELECT" || ziel.tagName === "A")) return;
  var knopf = buehne.querySelector(".knopf-haupt:not([disabled])");
  if (knopf){ e.preventDefault(); knopf.click(); }
});

/* Beim Öffnen: gespeicherte Darstellung, dann die passende Ansicht. */
(function start(){
  var t = null;
  try { t = localStorage.getItem(THEMA_SCHLUESSEL); } catch (e) {}
  if (t !== "hell" && t !== "dunkel"){
    var dunkel = false;
    try { dunkel = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    t = dunkel ? "dunkel" : "hell";
  }
  document.documentElement.setAttribute("data-thema", t);
  document.getElementById("knopf-thema").textContent = t === "dunkel" ? "☀" : "☾";
  document.getElementById("kopf-unter").textContent = KONFIG.bereich;
  document.title = document.title || KONFIG.bereich;
  zeigeStart();
})();
</script>
