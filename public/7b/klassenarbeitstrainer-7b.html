  INHALT: Die Themen folgen dem Aufbau der Klassenarbeit (Graphen ablesen,
  Punkte oder Linie, Füllgraphen, Art der Zuordnung, proportional und
  antiproportional rechnen, Fehler finden, Sachaufgaben, Begründen), dazu
  Rechnen ohne Taschenrechner. Das Wort „Dreisatz“ kommt bewusst nicht vor:

  WARUM GENERIERTE AUFGABEN: Ein Re-Test muss dieselbe Sache mit anderen
  Zahlen prüfen. Aus einem festen Pool käme die gemerkte Aufgabe zurück.

<style>

<script>
"use strict";
/* ==========================================================================
   1 — Kleinteile: Text, Zahlen, Zufall
   ========================================================================== */

var MINUS = "−";        /* echtes Minuszeichen, wie im Buch und an der Wand */
var MAL   = "·";
var HOCH2 = "²";

function esc(s){
  return String(s).replace(/[&<>"']/g, function(z){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[z];
  });
}

function el(tag, attr, kinder){
  var k = document.createElement(tag);
  if (attr) Object.keys(attr).forEach(function(name){
    var w = attr[name];
    if (w === null || w === undefined || w === false) return;
    if (name === "text") k.textContent = w;
    else if (name === "html") k.innerHTML = w;
    else if (name.slice(0,2) === "on" && typeof w === "function") k.addEventListener(name.slice(2).toLowerCase(), w);
    else k.setAttribute(name, w === true ? "" : w);
  });
  (kinder || []).forEach(function(kind){
    if (kind === null || kind === undefined) return;
    k.appendChild(typeof kind === "string" ? document.createTextNode(kind) : kind);
  });
  return k;
}

/* --- Brüche als Datentyp -------------------------------------------------
   WARUM: Eine Steigung ist oft 2/3, und 0,6666666667 ist an der Tafel keine
   Antwort. Wo geteilt wird, rechnet der Trainer mit {z, n} weiter und
   entscheidet erst beim Anzeigen, ob Dezimalzahl oder Bruch dasteht. */
function ggt(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var h=b; b=a%b; a=h; } return a||1; }

function BR(z, n){
  if (n === undefined) n = 1;
  if (n < 0){ z = -z; n = -n; }
  var t = ggt(z, n);
  return { z: z/t, n: n/t, bruch: true };
}
function istBr(v){ return v && typeof v === "object" && v.bruch === true; }
function wertVon(v){ return istBr(v) ? v.z / v.n : v; }
function brMal(a, b){ a = zuBr(a); b = zuBr(b); return BR(a.z*b.z, a.n*b.n); }
function brPlus(a, b){ a = zuBr(a); b = zuBr(b); return BR(a.z*b.n + b.z*a.n, a.n*b.n); }
function brMinus(a, b){ a = zuBr(a); b = zuBr(b); return BR(a.z*b.n - b.z*a.n, a.n*b.n); }
function brDurch(a, b){ a = zuBr(a); b = zuBr(b); return BR(a.z*b.n, a.n*b.z); }
function zuBr(v){
  if (istBr(v)) return v;
  if (Number.isInteger(v)) return BR(v, 1);
  /* Dezimalzahlen aus den Generatoren haben höchstens vier Stellen. */
  return BR(Math.round(v*10000), 10000);
}

/* Dezimaltext in deutscher Schreibweise, ohne Nachkommanullen. */
function dez(x, stellen){
  var n = (stellen === undefined) ? 4 : stellen;
  var g = Math.round(x * Math.pow(10,n)) / Math.pow(10,n);
  var s = String(g);
  if (s.indexOf("e") >= 0) s = g.toFixed(n);
  return s.replace("-", MINUS).replace(".", ",");
}

/* Endet die Dezimaldarstellung nach höchstens drei Stellen? Dann ist sie
   lesbarer als der Bruch — 0,75 statt drei Vierteln. */
function kurzDezimal(v){
  var b = zuBr(v);
  var x = b.z / b.n;
  return Math.abs(Math.round(x*1000)/1000 - x) < 1e-12;
}

/* Zahl als reiner Text (für Eingabefelder, Titel, Tabellen). */
function zText(v){
  if (!istBr(v)) return dez(v);
  if (v.n === 1) return dez(v.z);
  if (kurzDezimal(v)) return dez(v.z/v.n);
  return (v.z < 0 ? MINUS : "") + Math.abs(v.z) + "/" + v.n;
}

/* Zahl als HTML — hier darf der Bruch übereinander stehen. */
function zHtml(v){
  if (!istBr(v)) return esc(dez(v));
  if (v.n === 1) return esc(dez(v.z));
  if (kurzDezimal(v)) return esc(dez(v.z/v.n));
  return (v.z < 0 ? MINUS : "") + bruchHtml(Math.abs(v.z), v.n);
}
function bruchHtml(oben, unten){
  return '<span class="br"><span>' + oben + '</span><span>' + unten + '</span></span>';
}
function wurzelHtml(inhalt){
  return '<span class="wz">√<span class="dach">' + inhalt + '</span></span>';
}
function hochHtml(basis, exp){
  if (exp === 2) return basis + HOCH2;
  if (exp === 3) return basis + "³";
  return basis + "<sup>" + exp + "</sup>";
}

/* --- Terme zusammensetzen ------------------------------------------------
   Ein Term wie 2x² − x + 3 soll auch dann richtig aussehen, wenn ein
   Koeffizient 1, −1 oder 0 ist. Das hier ist die einzige Stelle, an der
   diese Fallunterscheidung steht. */
function summandHtml(k, teil, erster){
  var x = wertVon(k);
  if (x === 0) return "";
  var negativ = x < 0;
  var betrag = istBr(k) ? BR(Math.abs(k.z), k.n) : Math.abs(x);
  var zahl = (teil && wertVon(betrag) === 1) ? "" : zHtml(betrag);
  var kern = zahl + (teil || "");
  if (erster) return (negativ ? MINUS : "") + kern;
  return " " + (negativ ? MINUS : "+") + " " + kern;
}
function termHtml(teile){
  /* teile: [{k: Koeffizient, t: HTML des Variablenteils}] */
  var raus = "", erster = true;
  teile.forEach(function(s){
    var stueck = summandHtml(s.k, s.t, erster);
    if (stueck){ raus += stueck; erster = false; }
  });
  return raus || "0";
}
function linHtml(m, b){ return termHtml([{k:m, t:"x"}, {k:b, t:""}]); }
function quadHtml(a, b, c){ return termHtml([{k:a, t:"x"+HOCH2}, {k:b, t:"x"}, {k:c, t:""}]); }
/* f(x) = a(x − d)² + e — mit dem Vorzeichenwechsel, der die halbe Klasse kostet. */
function scheitelHtml(a, d, e){
  var innen = "x " + (wertVon(d) < 0 ? "+" : MINUS) + " " + zHtml(istBr(d) ? BR(Math.abs(d.z), d.n) : Math.abs(wertVon(d)));
  if (wertVon(d) === 0) innen = "x";
  var klammer = (wertVon(d) === 0 ? "x" : "(" + innen + ")") + HOCH2;
  var vorn = summandHtml(a, klammer, true);
  var hinten = summandHtml(e, "", false);
  return vorn + hinten;
}
/* Negative Zahlen gehoeren in Klammern: „3 · (−5)" liest sich, „3 · −5" nicht. */
function kl(v){ return wertVon(v) < 0 ? "(" + zHtml(v) + ")" : zHtml(v); }
/* Der Faktor vor einer Klammer: 1 und −1 werden nicht geschrieben. */
function vorFaktor(m){ return m === 1 ? "" : (m === -1 ? MINUS : zHtml(m)); }
var ORDNUNG = { 2: "zweite", 3: "dritte", 4: "vierte", 5: "fünfte" };

function punktHtml(name, x, y){
  return esc(name) + "(" + zHtml(x) + " | " + zHtml(y) + ")";
}

/* --- Zufall -------------------------------------------------------------- */
function rnd(min, max){ return Math.floor(Math.random()*(max-min+1)) + min; }
function rndOhne0(min, max){ var x; do { x = rnd(min,max); } while (x === 0); return x; }
function vorz(){ return Math.random() < 0.5 ? -1 : 1; }
function waehle(liste){ return liste[Math.floor(Math.random()*liste.length)]; }
function mische(liste){
  var k = liste.slice();
  for (var i = k.length-1; i > 0; i--){
    var j = Math.floor(Math.random()*(i+1)), h = k[i]; k[i] = k[j]; k[j] = h;
  }
  return k;
}
/* Zwei verschiedene Zahlen aus einem Bereich — für Punkte, Nullstellen, Paare. */
function zweiVerschieden(min, max){
  var a = rnd(min,max), b;
  do { b = rnd(min,max); } while (b === a);
  return [a, b];
}

/* --- Eingaben lesen ------------------------------------------------------
   Was getippt wird: 0,5 · 0.5 · 1/2 · " 4 " — alles wird verstanden. */
function zahlAus(text){
  var s = String(text).trim().replace(/\s+/g, "");
  if (!s) return null;
  s = s.replace(/−/g, "-").replace(/,/g, ".");
  var bruch = /^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/.exec(s);
  if (bruch){
    var n = parseFloat(bruch[2]);
    if (!n) return null;
    return parseFloat(bruch[1]) / n;
  }
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}
/* Wie genau muss eine Eingabe stimmen?
   Bei glatten Werten auf die letzte Stelle. Bei krummen — 4/3, 1/3, 0,8333 —
   waere das eine Falle: Wer den Bruch richtig hat und ihn als 1,33 eintippt,
   hat die Aufgabe verstanden. Deshalb dort zwei Nachkommastellen. */
function toleranzFuer(feld){
  if (typeof feld.toleranz === "number") return feld.toleranz;
  var x = feld.soll;
  return Math.abs(Math.round(x*1000)/1000 - x) < 1e-12 ? 1e-6 : 0.0051;
}
function gleichAuf(a, b, toleranz){
  if (a === null || a === undefined) return false;
  var t = (toleranz === undefined) ? 1e-6 : toleranz;
  return Math.abs(a - b) <= t + 1e-9;
}

/* ==========================================================================
   2 — Kleine Zeichnungen
   Ein Graph sagt bei Parabeln und Sinuskurven mehr als drei Sätze. Gezeichnet
   wird mit den Farbmarken der Seite, damit die Bilder auch dunkel stimmen.
   ========================================================================== */
var graphZaehler = 0;
function graphSvg(opt){
  var B = 400, H = opt.hoehe || 300, rand = 26;
  /* Eigene Kennung je Bild: Auf einer Seite können mehrere Koordinatensysteme
     stehen, und zwei gleich benannte Schnittmasken würden sich in die Quere
     kommen. */
  var maske = "gsvg" + (++graphZaehler);
  var xmin = opt.xmin, xmax = opt.xmax, ymin = opt.ymin, ymax = opt.ymax;
  function px(x){ return rand + (x - xmin) / (xmax - xmin) * (B - 2*rand); }
  function py(y){ return H - rand - (y - ymin) / (ymax - ymin) * (H - 2*rand); }
  var teile = [];

  /* Gitter in ganzen Schritten, aber höchstens 20 Linien je Richtung. */
  var sx = Math.max(1, Math.ceil((xmax - xmin) / 20));
  var sy = Math.max(1, Math.ceil((ymax - ymin) / 20));
  for (var gx = Math.ceil(xmin/sx)*sx; gx <= xmax; gx += sx)
    teile.push('<line x1="'+px(gx)+'" y1="'+py(ymin)+'" x2="'+px(gx)+'" y2="'+py(ymax)+'" stroke="var(--linie)" stroke-width="1"/>');
  for (var gy = Math.ceil(ymin/sy)*sy; gy <= ymax; gy += sy)
    teile.push('<line x1="'+px(xmin)+'" y1="'+py(gy)+'" x2="'+px(xmax)+'" y2="'+py(gy)+'" stroke="var(--linie)" stroke-width="1"/>');

  /* Achsen */
  if (ymin <= 0 && ymax >= 0)
    teile.push('<line x1="'+px(xmin)+'" y1="'+py(0)+'" x2="'+px(xmax)+'" y2="'+py(0)+'" stroke="var(--text-leise)" stroke-width="1.6"/>');
  if (xmin <= 0 && xmax >= 0)
    teile.push('<line x1="'+px(0)+'" y1="'+py(ymin)+'" x2="'+px(0)+'" y2="'+py(ymax)+'" stroke="var(--text-leise)" stroke-width="1.6"/>');

  /* Achsenbeschriftung: nur wenige Zahlen, sonst wird es unruhig. */
  var bx = Math.max(sx, Math.round((xmax-xmin)/6/sx)*sx);
  for (var tx = Math.ceil(xmin/bx)*bx; tx <= xmax; tx += bx){
    if (tx === 0) continue;
    teile.push('<text x="'+px(tx)+'" y="'+(py(Math.max(ymin,Math.min(ymax,0)))+14)+'" text-anchor="middle" font-size="11" fill="var(--text-schwach)">'+dez(tx)+'</text>');
  }
  var by = Math.max(sy, Math.round((ymax-ymin)/6/sy)*sy);
  for (var ty = Math.ceil(ymin/by)*by; ty <= ymax; ty += by){
    if (ty === 0) continue;
    teile.push('<text x="'+(px(Math.max(xmin,Math.min(xmax,0)))-6)+'" y="'+(py(ty)+4)+'" text-anchor="end" font-size="11" fill="var(--text-schwach)">'+dez(ty)+'</text>');
  }

  (opt.kurven || []).forEach(function(kurve){
    var punkte = [], N = 260, luecke = true, d = "";
    for (var i = 0; i <= N; i++){
      var x = xmin + (xmax - xmin) * i / N;
      var y = kurve.f(x);
      if (!isFinite(y) || y < ymin - (ymax-ymin) || y > ymax + (ymax-ymin)){ luecke = true; continue; }
      d += (luecke ? "M" : "L") + px(x).toFixed(1) + " " + py(y).toFixed(1) + " ";
      luecke = false;
    }
    teile.push('<g clip-path="url(#'+maske+')"><path d="'+d+'" fill="none" stroke="'+(kurve.farbe||"var(--akzent)")+'" stroke-width="2.4" stroke-linecap="round"'
      + (kurve.strich ? ' stroke-dasharray="6 5"' : '') + '/></g>');
  });

  (opt.punkte || []).forEach(function(p){
    teile.push('<circle cx="'+px(p.x)+'" cy="'+py(p.y)+'" r="4.5" fill="'+(p.farbe||"var(--rot)")+'"/>');
    if (p.name) teile.push('<text x="'+(px(p.x)+8)+'" y="'+(py(p.y)-8)+'" font-size="12" font-weight="600" fill="'+(p.farbe||"var(--rot)")+'">'+esc(p.name)+'</text>');
  });

  return '<svg class="bild" viewBox="0 0 '+B+' '+H+'" role="img" aria-label="'
    + esc(opt.alt || "Koordinatensystem mit Graph") + '"><defs><clipPath id="'+maske+'">'
    + '<rect x="'+(rand-4)+'" y="'+(rand-4)+'" width="'+(B-2*rand+8)+'" height="'+(H-2*rand+8)+'"/>'
    + '</clipPath></defs>' + teile.join("") + '</svg>';
}
/* ==========================================================================
   3 — Die Aufgaben
   --------------------------------------------------------------------------
   Jede Aufgabe ist ein Objekt:

     frage      HTML der Aufgabenstellung
     bild       optional: SVG, Tabelle, Gleichungssystem
     eingabe    wie geantwortet wird (Zahl, mehrere Felder, Auswahl)
     hinweis    der erste Tipp nach einem Fehler — nie die Lösung
     schritte   die vollständige Rechnung, Schritt für Schritt
     antwort    die Endantwort in einem Satz

   Erzeugt werden sie von Funktionen ohne Argumente. Jeder Aufruf liefert
   dieselbe Sorte Aufgabe mit neuen Zahlen — das ist der Grund, warum ein
   Re-Test hier etwas bestätigt und nicht nur ein Gedächtnis prüft.
   ========================================================================== */

function S(was, rechnung){ return { was: was, r: rechnung }; }

/* Vier Wahlmöglichkeiten mischen und merken, welche die richtige ist. */
function wahl(richtigHtml, falschHtmls){
  var alle = mische([{ h: richtigHtml, ok: true }].concat(
    falschHtmls.map(function(h){ return { h: h, ok: false }; })));
  return {
    art: "wahl",
    optionen: alle.map(function(a){ return a.h; }),
    richtig: alle.findIndex(function(a){ return a.ok; })
  };
}
/* Wie wahl(), aber gegen den haeufigsten Generatorfehler abgesichert: Bei
   bestimmten Zahlen faellt ein Ablenker mit der richtigen Antwort zusammen
   (bei a = 1 ist a² = a). Aus einer Vorratsliste werden die ersten drei
   genommen, die weder gleich der Loesung noch untereinander gleich sind. */
function wahlAus(richtigHtml, vorrat){
  var raus = [];
  vorrat.forEach(function(k){
    if (k !== richtigHtml && raus.indexOf(k) < 0 && raus.length < 3) raus.push(k);
  });
  while (raus.length < 3) raus.push("keine dieser Antworten" + " ".repeat(raus.length));
  return wahl(richtigHtml, raus);
}
function zahlFeld(label, soll, extra){
  var e = { art: "felder", felder: [Object.assign({ label: label, soll: soll }, extra || {})] };
  return e;
}
function felder(liste, egal){
  return { art: "felder", felder: liste, egal: !!egal };
}

/* ==========================================================================
   3b — Kleinteile für die 7b
   --------------------------------------------------------------------------
   Geld, Tabellen, Diagramme im ersten Quadranten, Gefäße. Die Kontexte sind
   bewusst andere als in der Klassenarbeit und in der Probearbeit: Wer hier
   übt, soll das Verfahren lernen, nicht eine bestimmte Aufgabe.
   ========================================================================== */
var NAMEN = ["Mia", "Noah", "Lea", "Finn", "Nele", "Ole", "Aylin", "Can", "Jana", "Paul", "Sofia", "Luca"];

function glatt(v, stellen){
  var f = Math.pow(10, stellen === undefined ? 2 : stellen);
  return Math.abs(Math.round(v * f) - v * f) < 1e-7;
}
/* Geld: ganze Beträge ohne Nachkommastellen, sonst immer zwei. */
function eurText(x){
  var r = Math.round(x * 100) / 100;
  return Number.isInteger(r) ? dez(r) : r.toFixed(2).replace(".", ",");
}
function eur(x){ return eurText(x) + "&nbsp;€"; }
function mitE(x, e){ return dez(x) + (e ? "&nbsp;" + e : ""); }

var LUECKE = '<span class="luecke">?</span>';

function tabelle(kopfX, kopfY, xs, ys){
  function zelle(v){ return "<td>" + (typeof v === "number" ? esc(dez(v)) : v) + "</td>"; }
  return '<table class="werte"><tr><th>' + kopfX + "</th>" + xs.map(zelle).join("")
    + "</tr><tr><th>" + kopfY + "</th>" + ys.map(zelle).join("") + "</tr></table>";
}
/* Kleine Tabelle als Antwortmöglichkeit — ohne Kopfspalte. */
function miniTabelle(xs, ys){
  function zeile(w){ return "<tr>" + w.map(function(v){ return "<td>" + esc(dez(v)) + "</td>"; }).join("") + "</tr>"; }
  return '<table class="werte mini"><tr><th>x</th>' + xs.map(function(v){ return "<td>" + esc(dez(v)) + "</td>"; }).join("")
    + '</tr><tr><th>y</th>' + ys.map(function(v){ return "<td>" + esc(dez(v)) + "</td>"; }).join("") + "</tr></table>";
}
function teilerVon(G, min, max){
  var t = [];
  for (var d = min; d <= max; d++) if (G % d === 0) t.push(d);
  return t;
}
function zweiAus(liste){
  var a = waehle(liste), b;
  do { b = waehle(liste); } while (b === a);
  return [a, b];
}

/* --- Diagramm im ersten Quadranten --------------------------------------
   Anders als graphSvg: Achsen mit Namen, Gitter im Takt der Aufgabe, Punkte
   ohne Linie möglich. klein: für Antwortmöglichkeiten, ohne Zahlen. */
var diaZaehler = 0;
function diagramm(opt){
  var klein = !!opt.klein;
  var B = klein ? 200 : 420, H = klein ? 150 : 300;
  var L = klein ? 18 : 48, R = 12, O = klein ? 12 : 30, U = klein ? 18 : 40;
  var xmax = opt.xmax, ymax = opt.ymax;
  function px(x){ return L + x / xmax * (B - L - R); }
  function py(y){ return H - U - y / ymax * (H - U - O); }
  var t = [];
  if (!klein){
    var sx = opt.sx, sy = opt.sy;
    for (var gx = sx; gx <= xmax + 1e-9; gx += sx){
      t.push('<line x1="' + px(gx) + '" y1="' + py(0) + '" x2="' + px(gx) + '" y2="' + py(ymax) + '" stroke="var(--linie)" stroke-width="1"/>');
      t.push('<text x="' + px(gx) + '" y="' + (py(0) + 16) + '" text-anchor="middle" font-size="12" fill="var(--text-leise)">' + dez(gx) + "</text>");
    }
    for (var gy = sy; gy <= ymax + 1e-9; gy += sy){
      t.push('<line x1="' + px(0) + '" y1="' + py(gy) + '" x2="' + px(xmax) + '" y2="' + py(gy) + '" stroke="var(--linie)" stroke-width="1"/>');
      t.push('<text x="' + (px(0) - 6) + '" y="' + (py(gy) + 4) + '" text-anchor="end" font-size="12" fill="var(--text-leise)">' + dez(gy) + "</text>");
    }
    t.push('<text x="' + (px(0) - 6) + '" y="' + (py(0) + 16) + '" text-anchor="end" font-size="12" fill="var(--text-leise)">0</text>');
  }
  /* Achsen mit Pfeil */
  t.push('<line x1="' + px(0) + '" y1="' + py(0) + '" x2="' + (px(xmax) + 8) + '" y2="' + py(0) + '" stroke="var(--text-leise)" stroke-width="1.6"/>');
  t.push('<line x1="' + px(0) + '" y1="' + py(0) + '" x2="' + px(0) + '" y2="' + (py(ymax) - 8) + '" stroke="var(--text-leise)" stroke-width="1.6"/>');
  t.push('<path d="M' + (px(xmax) + 8) + " " + (py(0) - 4) + "L" + (px(xmax) + 14) + " " + py(0) + "L" + (px(xmax) + 8) + " " + (py(0) + 4) + 'Z" fill="var(--text-leise)"/>');
  t.push('<path d="M' + (px(0) - 4) + " " + (py(ymax) - 8) + "L" + px(0) + " " + (py(ymax) - 14) + "L" + (px(0) + 4) + " " + (py(ymax) - 8) + 'Z" fill="var(--text-leise)"/>');
  var fs = klein ? 10 : 13;
  if (opt.xname) t.push('<text x="' + (B - R) + '" y="' + (H - (klein ? 3 : 8)) + '" text-anchor="end" font-size="' + fs + '" font-weight="600" fill="var(--text-leise)">' + esc(opt.xname) + "</text>");
  if (opt.yname) t.push('<text x="' + (px(0) + 6) + '" y="' + (klein ? 10 : 16) + '" font-size="' + fs + '" font-weight="600" fill="var(--text-leise)">' + esc(opt.yname) + "</text>");

  if (opt.linien){
    var pts = opt.linien.map(function(p){ return px(p[0]).toFixed(1) + "," + py(p[1]).toFixed(1); }).join(" ");
    t.push('<polyline points="' + pts + '" fill="none" stroke="var(--akzent)" stroke-width="' + (klein ? 2.4 : 2.8) + '" stroke-linejoin="round" stroke-linecap="round"/>');
  }
  (opt.punkte || []).forEach(function(p){
    t.push('<circle cx="' + px(p[0]) + '" cy="' + py(p[1]) + '" r="' + (klein ? 3.5 : 4.5) + '" fill="var(--rot)"/>');
  });
  var name = "dia" + (++diaZaehler);
  return '<svg class="bild' + (klein ? " klein" : "") + '" viewBox="0 0 ' + B + " " + H + '" role="img" aria-label="'
    + esc(opt.alt || "Diagramm") + '" id="' + name + '">' + t.join("") + "</svg>";
}

/* ==========================================================================
   THEMA A — Rechnen ohne Taschenrechner
   Die Klassenarbeit ist ohne Taschenrechner. Die Zahlen darin sind
   Kopfzahlen — aber mit Komma.
   ========================================================================== */
var G_RECHNEN = [];

/* Kommazahl mal ganze Zahl — über das Weglassen des Kommas. */
G_RECHNEN.push(function(){
  var a = waehle([1.5, 2.5, 0.5, 1.2, 3.5, 0.8, 4.5, 0.25, 1.25, 2.4]);
  var n = rnd(3, 12);
  var s = glatt(a, 1) ? 1 : 2, f = Math.pow(10, s);
  var ganz = Math.round(a * f), prod = ganz * n, erg = prod / f;
  return {
    frage: "Rechne ohne Taschenrechner:",
    formel: dez(a) + " " + MAL + " " + n,
    eingabe: zahlFeld("Ergebnis =", erg),
    hinweis: "Rechne zuerst ohne Komma: " + ganz + " " + MAL + " " + n + ". Setze das Komma danach wieder ein — so viele Stellen wie vorher.",
    schritte: [
      S("Komma weglassen: aus " + dez(a) + " wird " + ganz + " (das ist " + f + "-mal so viel)", dez(a) + " " + MAL + " " + f + " = " + ganz),
      S("Ohne Komma rechnen", ganz + " " + MAL + " " + n + " = " + prod),
      S("Wieder durch " + f + " teilen, weil wir vorher mit " + f + " malgenommen haben", prod + " : " + f + " = " + dez(erg))
    ],
    antwort: dez(a) + " " + MAL + " " + n + " = <strong>" + dez(erg) + "</strong>."
  };
});

/* Geldbetrag teilen — in Cent geht es glatt. */
G_RECHNEN.push(function(){
  var n = rnd(3, 8);
  var q = waehle([0.4, 0.6, 0.75, 0.8, 1.2, 1.4, 1.5, 1.6, 2.25, 2.4, 3.5]);
  var p = Math.round(q * n * 100) / 100;
  var cent = Math.round(p * 100), qc = Math.round(q * 100);
  return {
    frage: n + " gleiche Teile kosten zusammen " + eur(p) + ". Wie viel kostet ein Teil?",
    eingabe: zahlFeld("ein Teil kostet", q, { einheit: "€" }),
    hinweis: "Rechne in Cent: " + eurText(p) + " € sind " + cent + " Cent.",
    schritte: [
      S("In Cent umrechnen", eurText(p) + " € = " + cent + " ct"),
      S("Teilen", cent + " ct : " + n + " = " + qc + " ct"),
      S("Zurück in Euro", qc + " ct = " + eur(q))
    ],
    antwort: "Ein Teil kostet <strong>" + eur(q) + "</strong>."
  };
});

/* Mit welcher Zahl muss man malnehmen? — der Faktor zwischen zwei Werten. */
G_RECHNEN.push(function(){
  var r = waehle([1.5, 2.5, 0.5, 1.25, 0.75, 3, 4, 1.2]);
  var basis;
  do { basis = rnd(2, 16); } while (!Number.isInteger(basis * r) || basis * r === basis);
  var ziel = basis * r;
  return {

/* Eine Knickkurve mit ganzen Gitterwerten. Genau ein Abschnitt ist am
   steilsten; höchstens ein Abschnitt ist waagerecht. */
function leseKurve(k){
  for (var versuch = 0; versuch < 200; versuch++){
    var zuw = [], flach = 0;
    for (var i = 0; i < k.n; i++){
      var s = waehle(k.schritte);
      if (s === 0 && (i === 0 || flach)) s = k.schritte[0];
      if (s === 0) flach++;
      zuw.push(s);
    }
    var max = Math.max.apply(null, zuw);
    if (zuw.filter(function(s){ return s === max; }).length !== 1) continue;
    var start = k.steigend ? 0 : waehle(k.start);
    var ys = [start];
    zuw.forEach(function(s){ ys.push(ys[ys.length - 1] + (k.steigend ? s : -s)); });
    if (!k.steigend && ys[ys.length - 1] < 0) continue;
    if (k.hoechstens && ys[ys.length - 1] > k.hoechstens) continue;
    var hoch = Math.max.apply(null, ys);
    var ymax = Math.ceil((hoch + k.sy * 0.5) / k.sy) * k.sy;
    var punkte = ys.map(function(y, j){ return [j * k.sx, y]; });
    return { zuw: zuw, ys: ys, punkte: punkte, ymax: ymax, xmax: k.n * k.sx };
  }
  throw new Error("Keine Kurve gefunden: " + k.id);
}
function leseBild(k, kurve){
  return diagramm({ xmax: kurve.xmax, ymax: kurve.ymax, sx: k.sx, sy: k.sy, xname: k.xname, yname: k.yname,
    linien: kurve.punkte, alt: k.yname + " in Abhängigkeit von der " + k.xname });
}
function abschnitt(k, i){ return "zwischen " + dez(i * k.sx) + " und " + dez((i + 1) * k.sx) + " " + k.xe; }

/* In beide Richtungen ablesen. */

function fuellKurve(p){
  var N = 80, V = [0];
  for (var i = 1; i <= N; i++){ var hm = (i - 0.5) / N, r = p.r(hm); V.push(V[i - 1] + r * r / N); }
  return V.map(function(v, i){ return [v / V[N], i / N]; });
}
function fuellGraph(p){
  return diagramm({ klein: true, xmax: 1, ymax: 1, xname: "Zeit", yname: "Höhe", linien: fuellKurve(p), alt: "Füllgraph" });
}
function gefaess(p, klein){
  var B = klein ? 110 : 150, H = klein ? 120 : 170, u = H - 12, o = 14, m = B / 2, s = (B / 2 - 10) / 1.2;
  var N = 60, links = [], rechts = [];
  for (var i = 0; i <= N; i++){
    var h = i / N;
    var hh = [h];
    if (p.id.indexOf("stufe") === 0 && Math.abs(h - 0.5) < 1e-9) hh = [0.4999, 0.5];
    hh.forEach(function(x){
      var y = u - x * (u - o);
      links.push((m - p.r(x) * s).toFixed(1) + "," + y.toFixed(1));
      rechts.unshift((m + p.r(x) * s).toFixed(1) + "," + y.toFixed(1));
    });
  }
  var umriss = links.concat(rechts);
  var wasser = [];
  for (var j = 0; j <= 20; j++){ var hw = j / 20 * 0.35, yw = u - hw * (u - o); wasser.push((m - p.r(hw) * s).toFixed(1) + "," + yw.toFixed(1)); }
  for (var j2 = 20; j2 >= 0; j2--){ var hw2 = j2 / 20 * 0.35, yw2 = u - hw2 * (u - o); wasser.push((m + p.r(hw2) * s).toFixed(1) + "," + yw2.toFixed(1)); }
  return '<svg class="bild gefaess' + (klein ? " klein" : "") + '" viewBox="0 0 ' + B + " " + H + '" role="img" aria-label="Gefäß: ' + esc(p.wie) + '">'
    + '<polygon points="' + wasser.join(" ") + '" fill="var(--akzent-hell)" stroke="none"/>'
    + '<polyline points="' + umriss.join(" ") + '" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linejoin="round"/>'
    + "</svg>";
}
function fuellSchritte(p){

    S("Wie ist das Gefäß geformt?", p.wie),
    S("Die Regel", "Schmal → die Höhe steigt schnell (steiler Graph). Breit → die Höhe steigt langsam (flacher Graph)."),
    S("Also sieht der Graph so aus", p.graph)
  ];
}

/* Zwei Wertepaare einer proportionalen Zuordnung. */
function pPaar(k){
  var r = waehle(k.raten), xs = zweiAus(k.xs);
  return { k: k, r: r, x1: xs[0], y1: Math.round(r * xs[0] * 100) / 100, x2: xs[1], y2: Math.round(r * xs[1] * 100) / 100 };
}
/* Zwei Wertepaare einer antiproportionalen Zuordnung. */
/* Mögliche x-Werte zu einer Gesamtgröße: y = G : x muss sich mit höchstens
   ystellen Nachkommastellen schreiben lassen. */
function aKandidaten(k, G){
  var liste = k.xlist ? k.xlist.slice() : [];
  if (!k.xlist) for (var x = k.xmin; x <= k.xmax; x++) liste.push(x);
  return liste.filter(function(x){ return glatt(G / x, k.ystellen) && G / x >= 0.5 && x !== G / x; });
}
function aPaar(k){
  for (var v = 0; v < 200; v++){
    var G = waehle(k.G);
    var kand = aKandidaten(k, G);
    if (kand.length < 2) continue;
    var p = zweiAus(kand);
    return { k: k, G: G, x1: p[0], y1: G / p[0], x2: p[1], y2: G / p[1] };
  }
  throw new Error("Kein Paar");
}

/* ==========================================================================
   THEMA E — Welche Zuordnung ist das?
   ========================================================================== */
var ARTEN = {
  P: "proportional",
  A: "antiproportional",
  K: "weder proportional noch antiproportional",
  B: "proportional und antiproportional zugleich"
};
/* Eine Tabelle mit vier Spalten. Die Fallen sind die, an denen die 7b
   hängen bleibt: gleichmäßig steigend mit Startwert, „je mehr, desto
   weniger“ mit gleicher Summe, und die Zaun-Falle — außen gleiche Produkte,
   innen nicht. */
function erkennTabelle(art){
  var xs, ys, falle = "";
  if (art === "P"){
    var r = waehle([2, 3, 4, 5, 1.5, 2.5, 6]);
    var start = rnd(1, 3), d = waehle([1, 2]);
    xs = [0, 1, 2, 3].map(function(i){ return start + i * d; });
    ys = xs.map(function(x){ return r * x; });
  } else if (art === "A"){
    var G = waehle([24, 36, 48, 60, 72]);
    xs = mische(teilerVon(G, 2, 12)).slice(0, 4).sort(function(a, b){ return a - b; });
    ys = xs.map(function(x){ return G / x; });
  } else {
    var typ = waehle(["grund", "summe", "zaun", "fast"]);
    falle = typ;
    if (typ === "grund"){
      var m = rnd(2, 5), b = rnd(1, 6);
      xs = [1, 2, 4, 5]; ys = xs.map(function(x){ return m * x + b; });
    } else if (typ === "summe"){
      var s = rnd(9, 16);
      xs = [1, 2, 3, 4].map(function(i){ return i * rnd(1, 2); });
      xs = xs.filter(function(x, i){ return xs.indexOf(x) === i; });
      while (xs.length < 4) xs.push(xs[xs.length - 1] + 1);
      ys = xs.map(function(x){ return s - x; });
    } else if (typ === "zaun"){
      var s2 = waehle([8, 10, 12, 14]);
      var a = rnd(1, 2), c = rnd(a + 1, s2 / 2 - 1);
      xs = [a, c, s2 - c, s2 - a]; ys = xs.map(function(x){ return s2 - x; });
    } else {
      var G2 = waehle([24, 36, 48, 60]);
      xs = mische(teilerVon(G2, 2, 12)).slice(0, 4).sort(function(p, q){ return p - q; });
      ys = xs.map(function(x){ return G2 / x; });
      var j = rnd(1, 2);
      ys[j] = ys[j] + waehle([1, 2]);
    }
  }
  return { xs: xs, ys: ys, falle: falle };
}
/* Krumme Quotienten nur gerundet und als solche gekennzeichnet — ohne
   Taschenrechner rechnet niemand 22 : 3 auf vier Stellen aus. */
function quotListe(t){
  return t.xs.map(function(x, i){
    var q = t.ys[i] / x;
    return dez(t.ys[i]) + " : " + dez(x) + (glatt(q, 2) ? " = " + dez(q) : " ≈ " + dez(q, 2));
  }).join("<br>");
}
function prodListe(t){ return t.xs.map(function(x, i){ return dez(x) + " " + MAL + " " + dez(t.ys[i]) + " = " + dez(x * t.ys[i]); }).join("<br>"); }

};

/* Alle Produkte ausrechnen — die Zaun-Falle als Rechenaufgabe. */

  var art = waehle(["A", "K"]);

  var gleich = prods.every(function(p){ return p === prods[0]; });
  return {
    frage: "Rechne für <em>jede</em> Spalte das Produkt x " + MAL + " y aus. Danach weißt du, ob die Zuordnung antiproportional ist.",

/* ==========================================================================
   THEMA I — Sachaufgaben: erst entscheiden, dann rechnen
   ========================================================================== */
function sachFall(){
  var anti = Math.random() < 0.5;
  if (anti){
    var k = waehle(A_KONTEXTE), p = aPaar(k);
    return { anti: true, k: k, x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2, G: p.G,
      proportionalFalsch: p.y1 * p.x2 / p.x1 };
  }
  var kp = waehle(P_KONTEXTE), q = pPaar(kp);
  return { anti: false, k: kp, x1: q.x1, y1: q.y1, x2: q.x2, y2: q.y2, r: q.r,
    antiFalsch: q.y1 * q.x1 / q.x2 };
}
function sachSchritte(f){
  var k = f.k;
  return f.anti ? [
    S("Erst entscheiden", "Mehr " + k.xe + " → " + (f.k.ye === "€" ? "weniger €" : "weniger " + k.ye) + ", und zwar doppelt so viele → halb so viel: <strong>antiproportional</strong>"),
    S("Das Produkt bleibt gleich (Gesamtgröße)", dez(f.x1) + " " + MAL + " " + dez(f.y1) + " = " + dez(f.G)),
    S("Durch den neuen Wert teilen", dez(f.G) + " : " + dez(f.x2) + " = " + dez(f.y2))
  ] : [
    S("Erst entscheiden", "Doppelt so viel " + k.xe + " → doppelt so viel: <strong>proportional</strong>"),
    S("Wert für 1 (Quotient)", dez(f.y1) + " : " + dez(f.x1) + " = " + dez(f.r)),
    S("Mal den neuen Wert", dez(f.r) + " " + MAL + " " + dez(f.x2) + " = " + dez(f.y2))
  ];
}

var G_SACH_1 = function(){
  var f;
  do { f = sachFall(); } while (!glatt(f.anti ? f.proportionalFalsch : f.antiFalsch, 2));
  var k = f.k;

var SCHLUESSEL = "mu-7b-katrainer-v1";
var KLAUSUR = new Date(2026, 8, 22);  /* Di, 22.09.2026 — 1. Klassenarbeit der 7b */

var stand = laden();

function leererStand(){
  var t = {};
  THEMEN.forEach(function(th){ t[th.id] = { stand: "unbekannt", runden: 0, letzte: null }; });
  return { fassung: 1, diagnose: null, themen: t, check: null };
}
function laden(){
  try {
    var roh = localStorage.getItem(SCHLUESSEL);
    if (!roh) return leererStand();
    var s = JSON.parse(roh);
    var frisch = leererStand();
    if (!s || s.fassung !== 1) return frisch;
    /* Neue Themen dürfen später dazukommen, ohne alte Stände zu verlieren. */
    THEMEN.forEach(function(th){ if (!s.themen[th.id]) s.themen[th.id] = frisch.themen[th.id]; });
    return s;
  } catch (e) { return leererStand(); }
}
function sichern(){
  try { localStorage.setItem(SCHLUESSEL, JSON.stringify(stand)); } catch (e) { /* privates Fenster */ }
}

function tageBisKlausur(){
  var heute = new Date(); heute.setHours(0,0,0,0);
  return Math.round((KLAUSUR - heute) / 86400000);
}
function zahlSicher(){
  return THEMEN.filter(function(t){ return stand.themen[t.id].stand === "sicher"; }).length;

function aufgabeHtml(auf){
  var teile = [];
  if (auf.frage) teile.push('<p class="frage">' + auf.frage + "</p>");
  if (auf.formel) teile.push('<div class="mblock">' + auf.formel + "</div>");
  if (auf.bild) teile.push(auf.bild);
  return teile.join("");
}

function eingabeHtml(auf, nr){
  var e = auf.eingabe;
  if (e.art === "wahl"){
    return '<div class="wahlen" role="group" aria-label="Antwortmöglichkeiten">'
      + e.optionen.map(function(o, i){
          return '<button class="wahl" type="button" data-wahl="' + i + '" aria-pressed="false">'
            + '<span class="buchstabe">' + "ABCD".charAt(i) + '</span><span class="inhalt">' + o + "</span></button>";
        }).join("")
      + "</div>";
  }
  return '<div class="felder">' + e.felder.map(function(f, i){
    return '<span class="feld"><label for="f' + nr + "_" + i + '">' + f.label + "</label>"
      + '<input id="f' + nr + "_" + i + '" type="text" inputmode="text" autocomplete="off" spellcheck="false" data-feld="' + i + '">'
      + (f.einheit ? '<span class="einheit">' + esc(f.einheit) + "</span>" : "") + "</span>";
  }).join("") + "</div>";
}

/* Prüfen: liefert {ok, teile} — teile sagt je Feld, ob es stimmt. */
function pruefen(auf, wurzel){
  var e = auf.eingabe;
  if (e.art === "wahl"){
    var gewaehlt = wurzel.querySelector('.wahl[aria-pressed="true"]');
    if (!gewaehlt) return null;                       /* nichts angekreuzt */
    var i = Number(gewaehlt.getAttribute("data-wahl"));
    return { ok: i === e.richtig, gewaehlt: i, teile: [] };
  }
  var eingaben = [].slice.call(wurzel.querySelectorAll("input[data-feld]"));
  var werte = eingaben.map(function(inp){ return zahlAus(inp.value); });
  if (werte.some(function(w){ return w === null; })) return null;

  if (e.egal && e.felder.length === 2){
    /* Reihenfolge egal: x₁ und x₂ dürfen vertauscht sein. */
    var s0 = e.felder[0].soll, s1 = e.felder[1].soll;
    var t0 = toleranzFuer(e.felder[0]), t1 = toleranzFuer(e.felder[1]);
    var gerade = gleichAuf(werte[0], s0, t0) && gleichAuf(werte[1], s1, t1);
    var quer   = gleichAuf(werte[0], s1, t1) && gleichAuf(werte[1], s0, t0);
    var ok = gerade || quer;
    return { ok: ok, teile: ok ? [true,true]
      : [ gleichAuf(werte[0], s0, t0) || gleichAuf(werte[0], s1, t1),
          gleichAuf(werte[1], s0, t0) || gleichAuf(werte[1], s1, t1) ] };
  }
  var teile = werte.map(function(w, i){ return gleichAuf(w, e.felder[i].soll, toleranzFuer(e.felder[i])); });
  return { ok: teile.every(Boolean), teile: teile };
}

function markieren(auf, wurzel, ergebnis){
  if (auf.eingabe.art === "wahl"){
    [].slice.call(wurzel.querySelectorAll(".wahl")).forEach(function(k, i){
      k.disabled = true;
      if (i === auf.eingabe.richtig) k.setAttribute("data-stand", "richtig");
      else if (i === ergebnis.gewaehlt) k.setAttribute("data-stand", "falsch");
    });
  } else {
    [].slice.call(wurzel.querySelectorAll("input[data-feld]")).forEach(function(inp, i){
      inp.setAttribute("data-stand", ergebnis.teile[i] ? "richtig" : "falsch");
    });
  }
}
function entsperren(wurzel){
  [].slice.call(wurzel.querySelectorAll(".wahl")).forEach(function(k){
    k.disabled = false; k.removeAttribute("data-stand"); k.setAttribute("aria-pressed","false");
  });
  [].slice.call(wurzel.querySelectorAll("input[data-feld]")).forEach(function(inp){
    inp.removeAttribute("data-stand");
  });
}

function schritteHtml(auf){
  var s = auf.schritte.map(function(sch, i){
    return '<li class="schritt"><span class="nr">' + (i+1) + "</span>"
      + '<span class="was">' + sch.was + "</span>"
      + '<span class="rechnung">' + sch.r + "</span></li>";
  }).join("");
  return '<ol class="schritte">' + s + "</ol>"
    + (auf.bildNachher ? auf.bildNachher() : "");
}

/* Wahl-Knöpfe verhalten sich wie Radiobuttons. */
function wahlBinden(wurzel, beiAuswahl){
  [].slice.call(wurzel.querySelectorAll(".wahl")).forEach(function(k){
    k.addEventListener("click", function(){
      if (k.disabled) return;
      [].slice.call(wurzel.querySelectorAll(".wahl")).forEach(function(a){ a.setAttribute("aria-pressed","false"); });
      k.setAttribute("aria-pressed","true");
      if (beiAuswahl) beiAuswahl();
    });
  });
}

/* --- Diagnose ------------------------------------------------------------
   Zwei Aufgaben je Thema. Wer bei der ersten „weiß ich nicht“ drückt,
   bekommt die zweite nicht mehr — das Ergebnis stünde ohnehin fest, und
   nichts entmutigt so zuverlässig wie eine zweite Aufgabe zum selben Loch. */
var dia = null;

function diagnoseStarten(){
  dia = { plan: [], index: 0, treffer: {} };
  THEMEN.forEach(function(t){
    dia.treffer[t.id] = [];
    dia.plan.push({ id: t.id, stufe: 0 });
    dia.plan.push({ id: t.id, stufe: 1 });
  });
  diagnoseSchritt();
}

function diagnoseSchritt(){
  /* Übersprungene Aufgaben aussortieren. */
  while (dia.index < dia.plan.length){
    var p = dia.plan[dia.index];
    if (p.stufe === 1 && dia.treffer[p.id].indexOf("weissnicht") >= 0){ dia.index++; continue; }
    break;
  }
  if (dia.index >= dia.plan.length) return diagnoseAuswerten();

  var eintrag = dia.plan[dia.index];
  var thema = themaMit(eintrag.id);
  var macher = thema.gen[eintrag.stufe % thema.gen.length];
  var auf = macher();
  var offen = dia.plan.filter(function(p, i){
    return i >= dia.index && !(p.stufe === 1 && dia.treffer[p.id].indexOf("weissnicht") >= 0);
  }).length;

  zeige(
    '<div class="karte">'
    + '<div class="reihe" style="justify-content:space-between">'
    + '<span class="pille">Diagnose</span>'
    + '<span class="leise">noch ' + offen + " " + (offen === 1 ? "Aufgabe" : "Aufgaben") + "</span></div>"
    + '<p class="leise" style="margin:.6rem 0 .2rem">' + esc(thema.name) + "</p>"
    + aufgabeHtml(auf)
    + eingabeHtml(auf, dia.index)
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="d-ok" type="button">Antwort abschicken</button>'
    + '<button class="knopf knopf-still" id="d-nix" type="button">Weiß ich nicht</button>'
    + "</div>"
    + '<p class="leise" style="margin-top:.9rem">Hier gibt es keine Rückmeldung — das ist Absicht. '
    + "Die Diagnose soll ein ehrliches Bild geben, kein Training. „Weiß ich nicht“ ist eine gültige und nützliche Antwort.</p>"
    + "</div>"
  );

  var karte = buehne.querySelector(".karte");
  wahlBinden(karte);
  var erstes = karte.querySelector("input[data-feld]");
  if (erstes) erstes.focus();

  document.getElementById("d-ok").onclick = function(){
    var e = pruefen(auf, karte);
    if (!e){
      meldung(karte, "Da fehlt noch eine Antwort. Wenn du nicht weiterweißt, ist „Weiß ich nicht“ genau richtig.");
      return;
    }
    dia.treffer[eintrag.id].push(e.ok ? "richtig" : "falsch");
    dia.index++;
    diagnoseSchritt();
  };
  document.getElementById("d-nix").onclick = function(){
    dia.treffer[eintrag.id].push("weissnicht");
    dia.index++;
    diagnoseSchritt();
  };
}

function meldung(karte, text){
  var alt = karte.querySelector(".echo");
  if (alt) alt.remove();
  karte.appendChild(el("div", { class: "echo", html: "<p>" + text + "</p>" }));
}

function diagnoseAuswerten(){
  THEMEN.forEach(function(t){
    var r = dia.treffer[t.id] || [];
    var richtig = r.filter(function(x){ return x === "richtig"; }).length;
    var neu = richtig >= 2 ? "sicher" : (richtig === 1 ? "wackelig" : "offen");
    /* Ein bereits bestandener Re-Test wiegt schwerer als eine Momentaufnahme:
       Wer ein Thema abgeschlossen hat, verliert das nicht durch einen
       verrutschten Diagnoseklick. */
    if (!(stand.themen[t.id].stand === "sicher" && stand.themen[t.id].runden > 0))
      stand.themen[t.id].stand = neu;
  });
  stand.diagnose = { wann: new Date().toISOString().slice(0,10) };
  sichern();

  var offen = THEMEN.filter(function(t){ return stand.themen[t.id].stand !== "sicher"; });
  var sicher = THEMEN.length - offen.length;
  var text;
  if (sicher === THEMEN.length)
    text = "Alle zehn Themen sitzen bereits. Dann ist der Arbeits-Check unten dein nächster Schritt — "
         + "gemischte Aufgaben, wie in der Klassenarbeit, ohne Ankündigung, welches Thema kommt.";
  else if (sicher >= 6)
    text = "Der größte Teil steht. Es bleiben " + offen.length + " Themen — das ist in ein paar Sitzungen zu schaffen.";
  else if (sicher >= 3)
    text = "Eine solide Grundlage und " + offen.length + " Baustellen. Genau dafür ist noch Zeit.";
  else
    text = "Das sieht nach viel aus — ist es aber nicht. Die Themen bauen aufeinander auf: Wenn die ersten beiden sitzen, "
         + "fallen mehrere der späteren fast von allein.";

  zeige(
    '<div class="karte">'
    + '<span class="pille pille-teal">Diagnose ausgewertet</span>'
    + "<h2 style=\"margin-top:.6rem\">Das ist deine Landkarte</h2>"
    + '<p class="lead">' + text + "</p>"
    + '<div class="hinweis hinweis-gold"><strong>Wichtig:</strong> Das hier ist keine Note und kein Urteil. '
    + "Es ist eine Karte, die dir sagt, wo deine Zeit gerade am meisten bringt. Rot heißt nicht „kann ich nicht“, "
    + "sondern „hier hole ich am schnellsten Punkte“.</div>"
    + '<div class="reihe"><button class="knopf knopf-haupt knopf-gross" id="d-karte" type="button">Zur Übersicht</button></div>'
    + "</div>"
  );
  document.getElementById("d-karte").onclick = zeigeKarte;
}

/* --- Ein Thema durcharbeiten --------------------------------------------- */
var sitzung = null;
var PHASEN = ["Ankommen","Erklärung","Üben","Re-Test","Geschafft"];

function phasenleiste(jetzt){
  return '<div class="phasen">' + PHASEN.map(function(p, i){

  }).join("") + "</div>";

function themaOeffnen(id){
  sitzung = { id: id, runde: 0, index: 0, ergebnisse: [], versuch: 0 };
  zeigeAnkommen();
}

function zeigeAnkommen(){
  var t = themaMit(sitzung.id);
  var s = stand.themen[t.id];
  var gruss;
  if (s.stand === "sicher")
    gruss = "Dieses Thema hast du schon bestanden. Eine Auffrischung schadet trotzdem nie — besonders kurz vor der Klassenarbeit.";
  else if (s.stand === "wackelig")
    gruss = "In der Diagnose war eine von zwei Aufgaben richtig. Das heißt: Der Gedanke ist da, es fehlt die Sicherheit. Das ist die schnellste Sorte Baustelle.";
  else if (s.stand === "offen")
    gruss = "In der Diagnose hat das hier noch nicht geklappt. Kein Grund zur Sorge — dafür ist das Programm da. Wir gehen es von vorn an, in Ruhe und mit vollständiger Rechnung.";
  else
    gruss = "Dieses Thema ist noch nicht geprüft. Wir fangen einfach vorn an.";

  zeige(
    '<div class="karte">'
    + phasenleiste(0)
    + '<span class="pille' + (t.gruppe === "werkzeug" ? "" : " pille-teal") + '">'
    + (t.gruppe === "werkzeug" ? "Grundlage" : "Aktuelles Thema") + "</span>"
    + '<h2 style="margin-top:.6rem">' + esc(t.name) + "</h2>"
    + '<p class="leise">' + esc(t.unter) + (t.buch ? " · " + esc(t.buch) : "") + "</p>"
    + '<div class="hinweis hinweis-gold" style="margin-top:1rem">' + gruss + "</div>"
    + "<h3 style=\"margin-top:1.2rem\">Warum das zählt</h3>"
    + "<p>" + t.warum + "</p>"
    + "<h3>Was du danach kannst</h3>"
    + '<ul style="margin:.4rem 0 1rem 1.1rem; padding:0; color:var(--text-leise)">'
    + t.koennen.map(function(k){ return "<li>" + k + "</li>"; }).join("") + "</ul>"
    + '<div class="reihe">'
    + '<button class="knopf knopf-haupt knopf-gross" id="t-los" type="button">Los geht\'s</button>'
    + (s.stand === "sicher" ? '<button class="knopf" id="t-direkt" type="button">Direkt zum Re-Test</button>' : "")
    + '<button class="knopf knopf-still" id="t-zurueck" type="button">Zurück zur Übersicht</button>'
    + "</div></div>"
  );
  document.getElementById("t-los").onclick = zeigeErklaerung;
  var d = document.getElementById("t-direkt");
  if (d) d.onclick = function(){ sitzung.index = 0; sitzung.ergebnisse = []; zeigeRetest(); };
  document.getElementById("t-zurueck").onclick = zeigeKarte;
}

/* Die Erklärung: ein vollständig durchgerechnetes Beispiel, Schritt für
   Schritt aufdeckbar. Wer alles auf einmal sieht, liest es nicht. */
function zeigeErklaerung(){
  var t = themaMit(sitzung.id);
  var macher = t.gen[sitzung.runde % t.gen.length];
  var auf = macher();
  sitzung.beispiel = auf;
  sitzung.gezeigt = 0;

  zeige(
    '<div class="karte">'
    + phasenleiste(1)
    + '<h2>' + esc(t.name) + "</h2>"
    + '<div class="hinweis"><strong>Das Wichtigste in einem Satz:</strong> ' + t.merksatz + "</div>"
    + '<div class="hinweis hinweis-rot"><strong>Typischer Stolperstein:</strong> ' + t.stolperstein + "</div>"
    + "<h3 style=\"margin-top:1.2rem\">Ein Beispiel, ganz durchgerechnet</h3>"
    + aufgabeHtml(auf)
    + '<div id="erk-schritte"></div>'
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="e-mehr" type="button">Ersten Schritt zeigen</button>'
    + '<button class="knopf knopf-still" id="e-alles" type="button">Alle Schritte auf einmal</button>'
    + "</div>"
    + '<div class="reihe" style="margin-top:.6rem" id="e-weiter-reihe" hidden>'
    + '<button class="knopf knopf-haupt knopf-gross" id="e-weiter" type="button">Verstanden — jetzt selbst</button>'
    + "</div></div>"
  );

  var ziel = document.getElementById("erk-schritte");
  function nachlegen(){
    var sch = auf.schritte[sitzung.gezeigt];
    ziel.insertAdjacentHTML("beforeend",
      '<ol class="schritte" style="margin-top:0"><li class="schritt"><span class="nr">' + (sitzung.gezeigt+1) + "</span>"
      + '<span class="was">' + sch.was + '</span><span class="rechnung">' + sch.r + "</span></li></ol>");
    sitzung.gezeigt++;
    if (sitzung.gezeigt >= auf.schritte.length) fertig();
    else document.getElementById("e-mehr").textContent = "Nächster Schritt (" + (sitzung.gezeigt+1) + " von " + auf.schritte.length + ")";
  }
  function fertig(){
    document.getElementById("e-mehr").hidden = true;
    document.getElementById("e-alles").hidden = true;
    if (auf.bildNachher) ziel.insertAdjacentHTML("beforeend", auf.bildNachher());
    ziel.insertAdjacentHTML("beforeend", '<div class="echo gut"><p><strong>Ergebnis:</strong> ' + auf.antwort + "</p></div>");
    document.getElementById("e-weiter-reihe").hidden = false;
  }
  document.getElementById("e-mehr").onclick = nachlegen;
  document.getElementById("e-alles").onclick = function(){
    while (sitzung.gezeigt < auf.schritte.length) nachlegen();
  };
  document.getElementById("e-weiter").onclick = function(){
    sitzung.index = 0; sitzung.ergebnisse = []; sitzung.versuch = 0;
    zeigeUeben();
  };
}

/* Üben: drei Aufgaben, mit Hinweis beim ersten und voller Rechnung beim
   zweiten Fehlversuch. Fehler kosten hier nichts. */
var UEBEN_ANZAHL = 3;

function zeigeUeben(){
  var t = themaMit(sitzung.id);
  if (sitzung.index >= UEBEN_ANZAHL) return zeigeUebergang();
  var auf = waehle(t.gen)();
  sitzung.versuch = 0;

  zeige(
    '<div class="karte">'
    + phasenleiste(2)
    + '<div class="reihe" style="justify-content:space-between">'
    + '<span class="pille">Üben · Aufgabe ' + (sitzung.index+1) + " von " + UEBEN_ANZAHL + "</span>"
    + '<span class="leise">' + esc(t.name) + "</span></div>"
    + '<div style="margin-top:.7rem">' + aufgabeHtml(auf) + "</div>"
    + eingabeHtml(auf, "u" + sitzung.index)
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="u-ok" type="button">Prüfen</button>'
    + '<button class="knopf knopf-still" id="u-hilf" type="button">Ich komme nicht weiter</button>'
    + "</div>"
    + '<div id="u-echo"></div>'
    + "</div>"
  );

  var karte = buehne.querySelector(".karte");
  var echo = document.getElementById("u-echo");
  wahlBinden(karte);
  var erstes = karte.querySelector("input[data-feld]");
  if (erstes) erstes.focus();

  function loesungZeigen(vorspann, art){
    markierenWennMoeglich();
    echo.innerHTML = '<div class="echo ' + art + '">'
      + '<div class="kopfzeile"><span class="zeichen">→</span>' + vorspann + "</div>"
      + schritteHtml(auf)
      + "<p style=\"margin-top:.7rem\"><strong>Antwort:</strong> " + auf.antwort + "</p></div>"
      + '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="u-next" type="button">'
      + (sitzung.index + 1 >= UEBEN_ANZAHL ? "Weiter zum Re-Test" : "Nächste Aufgabe") + "</button></div>";
    document.getElementById("u-ok").disabled = true;
    document.getElementById("u-hilf").hidden = true;
    document.getElementById("u-next").onclick = function(){ sitzung.index++; zeigeUeben(); };
    document.getElementById("u-next").focus();
  }
  function markierenWennMoeglich(){
    var e = pruefen(auf, karte);
    if (e) markieren(auf, karte, e);
    else if (auf.eingabe.art === "wahl"){
      [].slice.call(karte.querySelectorAll(".wahl")).forEach(function(k, i){
        k.disabled = true;
        if (i === auf.eingabe.richtig) k.setAttribute("data-stand","richtig");
      });
    }
  }

  document.getElementById("u-ok").onclick = function(){
    var e = pruefen(auf, karte);
    if (!e){
      echo.innerHTML = '<div class="echo"><p>Da fehlt noch eine Antwort — oder eine Eingabe ist keine Zahl. '
        + "Erlaubt sind zum Beispiel <code>12</code>, <code>2,5</code> oder <code>3/4</code>.</p></div>";
      return;
    }
    sitzung.versuch++;
    if (e.ok){
      markieren(auf, karte, e);
      echo.innerHTML = '<div class="echo gut"><div class="kopfzeile"><span class="zeichen">✓</span>' + waehle(LOB) + "</div>"
        + "<p>" + auf.antwort + "</p>"
        + '<p style="margin-top:.5rem"><button class="knopf knopf-still" id="u-weg" type="button">Rechenweg trotzdem ansehen</button></p></div>'
        + '<div id="u-weg-ziel"></div>'
        + '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="u-next" type="button">'
        + (sitzung.index + 1 >= UEBEN_ANZAHL ? "Weiter zum Re-Test" : "Nächste Aufgabe") + "</button></div>";
      document.getElementById("u-ok").disabled = true;
      document.getElementById("u-hilf").hidden = true;
      document.getElementById("u-weg").onclick = function(){
        document.getElementById("u-weg-ziel").innerHTML = schritteHtml(auf);
        document.getElementById("u-weg").hidden = true;
      };
      document.getElementById("u-next").onclick = function(){ sitzung.index++; zeigeUeben(); };
      document.getElementById("u-next").focus();
      return;
    }
    if (sitzung.versuch === 1){
      markieren(auf, karte, e);
      echo.innerHTML = '<div class="echo fast"><div class="kopfzeile"><span class="zeichen">~</span>' + waehle(MUT) + "</div>"
        + "<p><strong>Hinweis:</strong> " + auf.hinweis + "</p></div>"
        + '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="u-retry" type="button">Noch einmal versuchen</button></div>';
      document.getElementById("u-retry").onclick = function(){
        entsperren(karte);
        echo.innerHTML = "";
        var f = karte.querySelector("input[data-feld]");
        if (f) f.focus();
      };
      return;
    }
    loesungZeigen(waehle(ZWEITER), "nein");
  };
  document.getElementById("u-hilf").onclick = function(){
    loesungZeigen("Kein Problem — hier ist der ganze Weg.", "");
  };
}

/* Zwischenstopp vor dem Re-Test: kurz Luft holen, klar sagen, was kommt. */
function zeigeUebergang(){
  var t = themaMit(sitzung.id);
  zeige(
    '<div class="karte">'
    + phasenleiste(3)
    + "<h2>Jetzt der Re-Test</h2>"
    + '<p class="lead">Vier Aufgaben zu <strong>' + esc(t.name) + "</strong> — neue Zahlen, kein Hinweis, ein Versuch pro Aufgabe. "
    + "Drei richtige genügen, damit das Thema als sicher gilt.</p>"
    + '<div class="hinweis"><strong>Warum ohne Hilfe?</strong> Weil in der Klassenarbeit auch niemand danebensteht. '
    + "Und weil du erst dann weißt, dass du es kannst, wenn du es einmal allein geschafft hast. "
    + "Geht es schief, ist nichts verloren — dann erkläre ich es dir noch einmal anders.</div>"
    + '<div class="reihe">'
    + '<button class="knopf knopf-haupt knopf-gross" id="r-los" type="button">Re-Test starten</button>'
    + '<button class="knopf knopf-still" id="r-mehr" type="button">Lieber noch etwas üben</button>'
    + "</div></div>"
  );
  document.getElementById("r-los").onclick = function(){
    sitzung.index = 0; sitzung.ergebnisse = []; zeigeRetest();
  };
  document.getElementById("r-mehr").onclick = function(){
    sitzung.index = 0; zeigeUeben();
  };
}

var TEST_ANZAHL = 4, TEST_NOETIG = 3;

function zeigeRetest(){
  var t = themaMit(sitzung.id);
  if (sitzung.index >= TEST_ANZAHL) return retestAuswerten();
  var auf = waehle(t.gen)();

  var punkte = "";
  for (var i = 0; i < TEST_ANZAHL; i++){
    var s = sitzung.ergebnisse[i];
    punkte += '<span class="punkt"' + (s === undefined ? "" : ' data-stand="' + (s ? "richtig" : "falsch") + '"') + "></span>";
  }

  zeige(
    '<div class="karte">'
    + phasenleiste(3)
    + '<div class="reihe" style="justify-content:space-between">'
    + '<span class="pille pille-teal">Re-Test · ' + (sitzung.index+1) + " von " + TEST_ANZAHL + "</span>"
    + '<span class="punkte" aria-label="bisherige Ergebnisse">' + punkte + "</span></div>"
    + '<div style="margin-top:.7rem">' + aufgabeHtml(auf) + "</div>"
    + eingabeHtml(auf, "r" + sitzung.index)
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="rt-ok" type="button">Antwort abschicken</button></div>'
    + '<div id="rt-echo"></div>'
    + "</div>"
  );

  var karte = buehne.querySelector(".karte");
  wahlBinden(karte);
  var erstes = karte.querySelector("input[data-feld]");
  if (erstes) erstes.focus();

  document.getElementById("rt-ok").onclick = function(){
    var e = pruefen(auf, karte);
    if (!e){
      document.getElementById("rt-echo").innerHTML =
        '<div class="echo"><p>Bitte trage in jedes Feld eine Zahl ein — oder wähle eine Antwort aus.</p></div>';
      return;
    }
    markieren(auf, karte, e);
    sitzung.ergebnisse.push(e.ok);
    document.getElementById("rt-ok").disabled = true;
    document.getElementById("rt-echo").innerHTML =
      '<div class="echo ' + (e.ok ? "gut" : "nein") + '">'
      + '<div class="kopfzeile"><span class="zeichen">' + (e.ok ? "✓" : "✗") + "</span>"
      + (e.ok ? waehle(LOB) : "Diese nicht.") + "</div>"
      + "<p>" + auf.antwort + "</p>"
      + '<p style="margin-top:.5rem"><button class="knopf knopf-still" id="rt-weg" type="button">Rechenweg ansehen</button></p></div>'
      + '<div id="rt-weg-ziel"></div>'
      + '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="rt-next" type="button">'
      + (sitzung.index + 1 >= TEST_ANZAHL ? "Auswertung" : "Nächste Aufgabe") + "</button></div>";
    document.getElementById("rt-weg").onclick = function(){
      document.getElementById("rt-weg-ziel").innerHTML = schritteHtml(auf);
      document.getElementById("rt-weg").hidden = true;
    };
    document.getElementById("rt-next").onclick = function(){ sitzung.index++; zeigeRetest(); };
    document.getElementById("rt-next").focus();
  };
}

function retestAuswerten(){
  var t = themaMit(sitzung.id);
  var richtig = sitzung.ergebnisse.filter(Boolean).length;
  var bestanden = richtig >= TEST_NOETIG;
  var s = stand.themen[t.id];
  s.runden++;
  s.letzte = { richtig: richtig, gesamt: TEST_ANZAHL };
  if (bestanden) s.stand = "sicher";
  else if (richtig >= 1 && s.stand === "offen") s.stand = "wackelig";
  sichern();

  if (bestanden){
    var naechste = null;
    for (var i = 0; i < THEMEN.length; i++){
      if (stand.themen[THEMEN[i].id].stand !== "sicher"){ naechste = THEMEN[i]; break; }
    }
    var schluss = naechste
      ? "Als Nächstes steht <strong>" + esc(naechste.name) + "</strong> an."
      : "Damit sind alle zehn Themen grün. Der gemischte Arbeits-Check ist jetzt der beste nächste Schritt.";
    zeige(
      '<div class="karte">'
      + phasenleiste(4)
      + '<span class="pille pille-gruen">' + richtig + " von " + TEST_ANZAHL + " richtig</span>"
      + "<h2 style=\"margin-top:.6rem\">" + esc(t.name) + " sitzt.</h2>"
      + '<p class="lead">' + (richtig === TEST_ANZAHL
          ? "Vier von vier — ohne Hinweise, mit neuen Zahlen. Das ist kein Zufall mehr, das ist Können."
          : "Drei von vier ohne Hilfe: Das reicht. Der eine Ausrutscher ist normal und kein Grund, hier länger zu bleiben.") + "</p>"
      + '<div class="hinweis hinweis-gruen"><strong>Du kannst jetzt:</strong><ul style="margin:.4rem 0 0 1.1rem; padding:0">'
      + t.koennen.map(function(k){ return "<li>" + k + "</li>"; }).join("") + "</ul></div>"
      + '<p class="leise">Ein Tipp aus Erfahrung: Komm in ein paar Tagen noch einmal her und mach nur den Re-Test. '
      + "Was man zweimal mit Abstand kann, kann man in der Klassenarbeit auch.</p>"
      + "<p>" + schluss + "</p>"
      + '<div class="reihe">'
      + (naechste ? '<button class="knopf knopf-haupt knopf-gross" id="g-next" type="button">Weiter mit ' + esc(naechste.name) + "</button>" : "")
      + '<button class="knopf" id="g-karte" type="button">Zur Übersicht</button>'
      + "</div></div>"
    );
    var n = document.getElementById("g-next");
    if (n) n.onclick = function(){ themaOeffnen(naechste.id); };
    document.getElementById("g-karte").onclick = zeigeKarte;
    return;
  }

  /* Nicht bestanden: kein Tadel, sondern ein zweiter Anlauf mit einem
     anderen Beispiel. Der Weg zurück ist immer derselbe wie beim ersten Mal. */
  sitzung.runde++;
  zeige(
    '<div class="karte">'
    + phasenleiste(3)
    + '<span class="pille pille-gold">' + richtig + " von " + TEST_ANZAHL + " richtig</span>"
    + "<h2 style=\"margin-top:.6rem\">Noch nicht — und das ist in Ordnung.</h2>"
    + '<p class="lead">' + (richtig === 2
        ? "Zwei von vier: Die Hälfte stimmt schon. Meistens fehlt genau ein Schritt, und den finden wir jetzt."
        : (richtig === 1
          ? "Eine richtige Antwort ist mehr als keine — aber es fehlt noch etwas Grundsätzliches. Gehen wir es anders an."
          : "Diesmal hat keine gepasst. Das heißt nicht, dass du es nicht kannst; es heißt, dass die Erklärung noch nicht bei dir angekommen ist. Also nehmen wir eine andere.")) + "</p>"
    + '<div class="hinweis"><strong>So geht es weiter:</strong> ein neues Beispiel, vollständig durchgerechnet, '
    + "danach wieder drei Übungsaufgaben mit Hinweisen — und dann ein frischer Re-Test. "
    + "Es gibt keine Begrenzung, wie oft du das machen darfst.</div>"
    + '<div class="reihe">'
    + '<button class="knopf knopf-haupt knopf-gross" id="w-erk" type="button">Neues Beispiel ansehen</button>'
    + '<button class="knopf knopf-still" id="w-karte" type="button">Später weitermachen</button>'
    + "</div></div>"
  );
  document.getElementById("w-erk").onclick = zeigeErklaerung;
  document.getElementById("w-karte").onclick = zeigeKarte;
}

/* --- Arbeits-Check: gemischt, wie in der Klassenarbeit -------------------------- */
var check = null;
var CHECK_ANZAHL = 12;

function checkStarten(){
  /* Gemischt, aber mit Schwerpunkt auf den Klausurthemen: jedes Thema
     mindestens einmal, die restlichen Plätze an die Kapitel-1-Themen. */
  var plan = THEMEN.map(function(t){ return t.id; });
  var klausurThemen = THEMEN.filter(function(t){ return t.gruppe === "klausur"; }).map(function(t){ return t.id; });
  while (plan.length < CHECK_ANZAHL) plan.push(waehle(klausurThemen));
  check = { plan: mische(plan), index: 0, ergebnisse: [] };
  checkSchritt();
}

function checkSchritt(){
  if (check.index >= check.plan.length) return checkAuswerten();
  var t = themaMit(check.plan[check.index]);
  var auf = waehle(t.gen)();
  var richtigBisher = check.ergebnisse.filter(function(e){ return e.ok; }).length;

  zeige(
    '<div class="karte">'
    + '<div class="reihe" style="justify-content:space-between">'
    + '<span class="pille pille-teal">Arbeits-Check · ' + (check.index+1) + " von " + CHECK_ANZAHL + "</span>"
    + '<span class="leise">' + richtigBisher + " richtig</span></div>"
    + '<p class="leise" style="margin:.7rem 0 0">Welches Thema? Das musst du hier selbst erkennen.</p>'
    + aufgabeHtml(auf)
    + eingabeHtml(auf, "c" + check.index)
    + '<div class="reihe" style="margin-top:1rem">'
    + '<button class="knopf knopf-haupt" id="c-ok" type="button">Antwort abschicken</button>'
    + '<button class="knopf knopf-still" id="c-skip" type="button">Überspringen</button></div>'
    + '<div id="c-echo"></div>'
    + "</div>"
  );

  var karte = buehne.querySelector(".karte");
  wahlBinden(karte);
  var erstes = karte.querySelector("input[data-feld]");
  if (erstes) erstes.focus();

  function weiter(ok){
    check.ergebnisse.push({ id: t.id, ok: ok });
    check.index++;
    checkSchritt();
  }
  document.getElementById("c-ok").onclick = function(){
    var e = pruefen(auf, karte);
    if (!e){
      document.getElementById("c-echo").innerHTML = '<div class="echo"><p>Bitte fülle alle Felder aus oder überspringe die Aufgabe.</p></div>';
      return;
    }
    markieren(auf, karte, e);
    document.getElementById("c-ok").disabled = true;
    document.getElementById("c-skip").hidden = true;
    document.getElementById("c-echo").innerHTML =
      '<div class="echo ' + (e.ok ? "gut" : "nein") + '"><div class="kopfzeile"><span class="zeichen">'
      + (e.ok ? "✓" : "✗") + "</span>" + (e.ok ? waehle(LOB) : esc(t.name) + " — schau gleich noch einmal hin.") + "</div>"
      + "<p>" + auf.antwort + "</p></div>"
      + '<div class="reihe" style="margin-top:.8rem"><button class="knopf knopf-haupt" id="c-next" type="button">Weiter</button></div>';
    document.getElementById("c-next").onclick = function(){ weiter(e.ok); };
    document.getElementById("c-next").focus();
  };
  document.getElementById("c-skip").onclick = function(){ weiter(false); };
}

function checkAuswerten(){
  var proThema = {};
  check.ergebnisse.forEach(function(e){
    if (!proThema[e.id]) proThema[e.id] = { richtig: 0, gesamt: 0 };
    proThema[e.id].gesamt++;
    if (e.ok) proThema[e.id].richtig++;
  });
  var richtig = check.ergebnisse.filter(function(e){ return e.ok; }).length;
  stand.check = { richtig: richtig, gesamt: CHECK_ANZAHL, wann: new Date().toISOString().slice(0,10) };
  /* Ein Thema, das im gemischten Test durchfällt, war nur im Zusammenhang
     sicher. Es rutscht auf „wackelig“ — mit Absicht: Das ist die ehrlichere
     Auskunft, und der Weg dorthin zurück ist kurz. */
  Object.keys(proThema).forEach(function(id){
    if (proThema[id].richtig === 0 && stand.themen[id].stand === "sicher")
      stand.themen[id].stand = "wackelig";
  });
  sichern();

  var urteil;
  if (richtig >= 11) urteil = "Das ist Klassenarbeitsniveau. Mehr als eine Wiederholung in ein paar Tagen braucht es nicht.";
  else if (richtig >= 9) urteil = "Ein gutes Ergebnis. Sieh dir die zwei, drei Wackler unten an — der Rest sitzt.";
  else if (richtig >= 6) urteil = "Die Hälfte und mehr steht. Nimm dir gezielt die Themen vor, die unten rot sind, statt alles noch einmal zu machen.";
  else urteil = "Das war noch schwer. Wichtig: Nicht alles gleichzeitig. Nimm dir das erste rote Thema von oben vor und arbeite es fertig — das trägt die anderen mit.";

  var zeilen = Object.keys(proThema).map(function(id){
    var t = themaMit(id), p = proThema[id];
    var farbe = p.richtig === p.gesamt ? "pille-gruen" : (p.richtig === 0 ? "pille-rot" : "pille-gold");
    return '<tr><td style="text-align:left">' + esc(t.name) + '</td><td><span class="pille ' + farbe + '">'
      + p.richtig + "/" + p.gesamt + "</span></td></tr>";
  }).join("");

  zeige(
    '<div class="karte">'
    + '<span class="pille pille-teal">Arbeits-Check</span>'
    + "<h2 style=\"margin-top:.6rem\">" + richtig + " von " + CHECK_ANZAHL + " richtig</h2>"
    + '<p class="lead">' + urteil + "</p>"
    + '<table class="werte"><tr><th style="text-align:left">Thema</th><th>Ergebnis</th></tr>' + zeilen + "</table>"
    + '<div class="reihe">'
    + '<button class="knopf knopf-haupt" id="c-karte" type="button">Zur Übersicht</button>'
    + '<button class="knopf" id="c-nochmal" type="button">Noch einen Durchgang</button>'
    + "</div></div>"
  );
  document.getElementById("c-karte").onclick = zeigeKarte;
  document.getElementById("c-nochmal").onclick = checkStarten;
}

/* ==========================================================================
   9 — Bedienung außen herum
   ========================================================================== */
document.getElementById("knopf-karte").onclick = function(){
  if (stand.diagnose === null && zahlSicher() === 0) zeigeStart(); else zeigeKarte();
};
document.getElementById("knopf-thema").onclick = function(){
  var dunkel = document.documentElement.getAttribute("data-thema") === "dunkel";
  document.documentElement.setAttribute("data-thema", dunkel ? "hell" : "dunkel");
  document.getElementById("knopf-thema").textContent = dunkel ? "☾" : "☀";
  try { localStorage.setItem("mu-7b-thema", dunkel ? "hell" : "dunkel"); } catch (e) {}
};
document.getElementById("knopf-reset").onclick = function(){
  if (!window.confirm("Wirklich alles zurücksetzen? Dein Fortschritt auf diesem Gerät geht dabei verloren.")) return;
  stand = leererStand();
  sichern();
  zeigeStart();
};

/* Enter schickt ab — auf dem iPad spart das den Griff zum Knopf. */
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter" || e.shiftKey || e.ctrlKey || e.metaKey) return;
  var ziel = e.target;
  if (ziel && ziel.tagName === "BUTTON") return;
  var knopf = buehne.querySelector(".knopf-haupt:not([disabled])");
  if (knopf){ e.preventDefault(); knopf.click(); }
});

/* Beim Öffnen: gespeicherte Darstellung, dann die passende Ansicht. */
(function start(){
  var t = null;
  try { t = localStorage.getItem("mu-7b-thema"); } catch (e) {}
  if (t !== "hell" && t !== "dunkel"){
    var dunkel = false;
    try { dunkel = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
    t = dunkel ? "dunkel" : "hell";
  }
  document.documentElement.setAttribute("data-thema", t);
  document.getElementById("knopf-thema").textContent = t === "dunkel" ? "☀" : "☾";
  document.getElementById("kopf-unter").textContent = countdownText();
  zeigeStart();
})();
</script>
