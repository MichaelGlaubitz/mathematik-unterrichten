# LaTeX-on-HTTP (lokal gebautes App-Image) + Caddy (HTTPS + CORS)
# Das Docker-Hub-Image yoant/latexonhttp-python:debian ist nur die Basis (ohne Gunicorn-App).

services:
  latex:
    build:
      context: https://github.com/YtoTech/latex-on-http.git
      dockerfile: Dockerfile
    image: latex-onhttp:local
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      latex:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
