# LaTeX-on-HTTP (eigener Build-Server) + Caddy (HTTPS + CORS für mathematik-unterrichten.de)
# Voraussetzung: Domain per A-Record auf die VPS-IP, Ports 80/443 offen.

services:
  latex:
    image: yoant/latexonhttp-python:debian
    restart: unless-stopped
    # Nur intern; von außen nur über Caddy erreichbar
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - latex

volumes:
  caddy_data:
  caddy_config:
